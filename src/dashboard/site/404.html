<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada · Onça</title>
<!-- #216: target of the edge redirect for unknown paths (infra/edge_policy.py site_paths_js),
     instead of S3's raw AccessDenied XML. Self-contained: no feed, no auth-dependent asset. -->
<style>
  :root { color-scheme: light dark; --ink:#1b1f24; --muted:#5b6470; --bg:#f6f5f2; --card:#fff; --line:#e3e0d8; --accent:#9a6b1f; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ece9e2; --muted:#a3a8b0; --bg:#14171b; --card:#1c2026; --line:#2c3139; --accent:#d9a548; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:30rem; margin:1.5rem; padding:2rem; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .code { font-size:.8rem; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
  h1 { font-size:1.4rem; margin:.4rem 0 .8rem; }
  p { color:var(--muted); margin:0 0 1.2rem; }
  nav { display:flex; flex-wrap:wrap; gap:.6rem; }
  a { color:var(--accent); font-weight:600; text-decoration:none; padding:.55rem .9rem; border:1px solid var(--line); border-radius:8px; min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; }
  a:hover { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="code">Erro 404</div>
  <h1>Página não encontrada</h1>
  <p>O endereço acessado não existe ou foi movido. Verifique o link ou siga para uma das áreas abaixo.</p>
  <nav>
    <a href="/exec">Painel executivo</a>
    <a href="/app">Dashboard do setor</a>
    <a href="/">Início</a>
  </nav>
</main>
</body>
</html>
