<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Onça · Sala Executiva</title>
<!-- #162 installable PWA -->
<link rel="manifest" href="/v3/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/v3/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/v3/icons/icon-192.png" />
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1214" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Onça" />
<!-- #170 link previews are GENERIC by design: a shared card link never previews its finding -->
<meta property="og:title" content="Onça — painel executivo" />
<meta property="og:description" content="Conteúdo disponível apenas para usuários autorizados." />
<meta property="og:image" content="https://onssa.org/v3/og.png" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="/v2/app.css" />
<style>
  /* v3 executive — built on the shared design tokens (dual-theme, no hardcoded hex) */
  .officer-tabs { display:flex; gap:2px; }
  .officer-tabs a { border-bottom:2px solid transparent; border-radius:0; padding:var(--s2) var(--s3); }
  .officer-tabs a[aria-current="page"] { color:var(--ink); background:transparent; border-bottom-color:var(--primary); }
  .selwrap { display:flex; align-items:center; gap:var(--s2); }
  .selwrap select { background:var(--surface-2); color:var(--ink); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:5px var(--s2); font:inherit; font-size:var(--fs-meta); }

  /* Hero readout — the promoted metric that leads every board */
  .readout { display:grid; grid-template-columns:minmax(230px,.85fr) 2fr; gap:var(--s4); margin-bottom:var(--s4); }
  .hero { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:var(--s4) var(--s5); box-shadow:var(--shadow-1); display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .hero .h-lbl { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.9px; color:var(--muted); }
  .hero .h-row { display:flex; align-items:baseline; gap:var(--s3); }
  .hero .h-val { font-size:var(--fs-hero); font-weight:800; line-height:1; letter-spacing:.3px; color:var(--ink); }
  .hero .h-sub { font-size:var(--fs-meta); color:var(--muted); margin-top:2px; }
  .gauge { height:8px; border-radius:var(--r-pill); background:var(--surface-3); overflow:hidden; margin-top:var(--s2); }
  .gauge > i { display:block; height:100%; border-radius:var(--r-pill); }
  .readout .tiles { align-content:center; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
  .tile { position:relative; }
  .tile.is-crit { border-left:3px solid var(--t-crit); } .tile.is-high { border-left:3px solid var(--t-high); }
  .tile.is-warn { border-left:3px solid var(--warn); } .tile.is-ok { border-left:3px solid var(--ok); }
  /* A tile that leads somewhere is a real <a> (activateTiles): arrow glyph + hover lift + focus ring.
     The hover ring is a box-shadow so it never repaints the 3px status border on the left. */
  a.tile--nav { display:block; color:inherit; text-decoration:none; cursor:pointer; padding-right:calc(var(--s4) + 14px);
    transition:box-shadow .15s, background-color .15s, transform .15s; }
  a.tile--nav::after { content:"→"; position:absolute; top:var(--s2); right:var(--s3); font-size:var(--fs-sm); font-weight:700;
    line-height:1; color:var(--primary); transition:transform .15s; }
  a.tile--nav:hover { background:var(--surface-2); box-shadow:var(--shadow-2), 0 0 0 1px var(--primary); transform:translateY(-1px); }
  a.tile--nav:hover::after { transform:translateX(3px); }
  a.tile--nav:hover .tile__l { color:var(--ink-2); }
  a.tile--nav:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  a.tile--nav:active { background:var(--surface-2); transform:none; }
  /* destination of a tile / Hoje-count jump: ring for ~2s, then fades */
  [data-nav] { scroll-margin-top:76px; }   /* phone: slim sticky bar */
  @media (min-width: 861px) { [data-nav] { scroll-margin-top:116px; } }   /* desktop: ~100px sticky header */
  .nav-hit { outline:3px solid var(--primary); outline-offset:3px; border-radius:var(--r-lg); transition:outline-color .6s; }
  .nav-hit.is-fading { outline-color:transparent; }
  .panel__hd h2:focus, .band-hd .overline:focus { outline:none; }
  /* --primary-2 (5.65:1 on the pill's surface-3 in light, 6.8:1 dark): --primary is only 4.1:1 there */
  .hoje-hd a.n--nav { position:relative; color:var(--primary-2); text-decoration:none; border-bottom:1px solid currentColor; }
  .hoje-hd a.n--nav::after { content:""; position:absolute; inset:-12px -8px; }   /* 44px touch target */
  .hoje-hd a.n--nav:hover { color:var(--ink); }
  .hoje-hd a.n--nav:focus-visible { outline:2px solid var(--primary); outline-offset:3px; border-radius:var(--r-sm); }
  /* Desktop key-decision panels (the one band per officer where the verdict lives): brand-tinted header
     band, 3px accent rule, bigger sentence-case title, a text tag (never colour alone), taller list. */
  .lead-tag { display:none; }
  @media (min-width: 861px) {
    .panel--key { border-color:color-mix(in srgb, var(--primary) 40%, var(--border)); border-top:3px solid var(--primary);
      box-shadow:var(--shadow-2); }
    .panel--key > .panel__hd { background:var(--primary-weak); padding:var(--s4) var(--s5);
      border-bottom-color:color-mix(in srgb, var(--primary) 30%, var(--border)); }
    .panel--key > .panel__hd h2 { font-size:var(--fs-md); text-transform:none; letter-spacing:.1px; color:var(--ink); font-weight:750; }
    .panel--key > .panel__hd .hd-note { color:var(--ink-2); }
    .panel--key > .panel__hd .lead-tag { display:inline-block; font-size:var(--fs-micro); font-weight:700; letter-spacing:.7px;
      text-transform:uppercase; color:var(--primary-2); border:1px solid color-mix(in srgb, var(--primary) 55%, transparent);
      border-radius:var(--r-pill); padding:1px 8px; white-space:nowrap; }
    .panel--key > .panel__bd--scroll { max-height:640px; }
    .band--key > .band-hd .overline { color:var(--ink); font-size:var(--fs-sm); letter-spacing:1.1px; }
    .band--key > .band-hd .rule { height:2px; background:color-mix(in srgb, var(--primary) 55%, var(--border)); }
  }

  /* rows */
  .exrow { display:flex; gap:var(--s3); align-items:flex-start; padding:var(--s2) var(--s4);
    border-bottom:1px solid var(--border); }
  /* #239: only a row that opens something looks clickable (bindRows sets tabindex on those) */
  .exrow[tabindex] { cursor:pointer; }
  .exrow[tabindex]:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
  .exrow:last-child { border-bottom:0; }
  .exrow:hover { background:var(--surface-2); }
  .exrow .ent { font-weight:600; min-width:118px; max-width:36%; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* headline: clamps to 3 lines. A click anywhere on the row opens the sources drawer (as on Hoje, #283);
     a clamped headline gets an explicit "ver mais"/"ver menos" button (wireHeadlines) that expands it in place. */
  .exrow .ttl { flex:1; min-width:0; color:var(--ink-2); font-size:var(--fs-sm); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .exrow[tabindex] .ttl:hover { color:var(--ink); }
  .exrow .ttl.is-expanded { -webkit-line-clamp:unset; display:block; overflow:visible;
    background:var(--surface-2); border-radius:var(--r-sm); padding:2px 6px; margin:-2px -6px; }
  .exrow .ttl-more { flex:none; align-self:flex-start; margin-top:1px; padding:0 2px; border:0; background:none;
    font:inherit; font-size:var(--fs-micro); font-weight:700; line-height:1.4; white-space:nowrap; cursor:pointer;
    color:var(--primary-2); text-decoration:underline; text-underline-offset:2px; }
  .exrow .ttl-more:hover { color:var(--ink); }
  .exrow .ttl-more:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:var(--r-sm); }
  .exrow .ttl-more[hidden] { display:none; }
  .exrow .dt, .exrow .meta, .exrow .heat, .exrow .badge { margin-top:1px; }
  .exrow .dt { color:var(--muted); font-size:var(--fs-micro); min-width:64px; font-variant-numeric:tabular-nums; }
  .exrow .meta { color:var(--muted); font-size:var(--fs-micro); font-variant-numeric:tabular-nums; }
  .exrow .badge.enf-src { white-space:normal; overflow-wrap:anywhere; max-width:100%; }

  /* momentum — diverging bar anchored to a center baseline (rising vs receding) */
  .mom { display:grid; grid-template-columns:140px 1fr 66px; align-items:center; gap:var(--s3);
    padding:6px var(--s4); border-bottom:1px solid var(--border); }
  .mom:last-child { border-bottom:0; }
  .mom .lbl { font-weight:600; color:var(--ink); font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mom .track { position:relative; height:12px; }
  .mom .track::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--border-2); }
  .mom .track i { position:absolute; top:1px; bottom:1px; border-radius:var(--r-sm); }
  .mom .track i.up { left:50%; background:color-mix(in srgb,var(--t-high) 72%,transparent); }
  .mom .track i.down { right:50%; background:color-mix(in srgb,var(--ok) 66%,transparent); }
  .mom .val { text-align:right; font-variant-numeric:tabular-nums; font-size:var(--fs-sm); font-weight:600; }
  .mom .val.up { color:var(--t-high); } .mom .val.down { color:var(--ok); }

  /* Mapa Competitivo — ameaça × momentum scatter (v1 flagship → CSO) */
  .scatter { padding:var(--s4); }
  .scatter svg { width:100%; height:auto; display:block; }
  .sc-frame { fill:none; stroke:var(--border); }
  .sc-grid { stroke:var(--border-2); stroke-dasharray:3 3; }
  .sc-danger { fill:color-mix(in srgb,var(--t-crit) 8%,transparent); }
  .sc-dot { stroke:var(--surface); stroke-width:1.2; }
  .sc-dot:hover { stroke:var(--ink); stroke-width:1.6; }
  .sc-dot--nd { stroke:var(--muted); stroke-width:1; stroke-dasharray:2 1.5; }
  .sc-lbl { fill:var(--ink-2); font-size:11px; font-variant-numeric:tabular-nums;
    paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; }
  .sc-lbl-lead { stroke:var(--border-2); stroke-width:1; }
  .sc-whisker { stroke-width:1.75; stroke-linecap:round; }
  .sc-ax  { fill:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .sc-quad { fill:var(--muted); font-size:10px; letter-spacing:.4px; opacity:.7; }
  .sc-legend { margin-top:var(--s2); display:flex; flex-wrap:wrap; align-items:center;
    justify-content:flex-end; gap:var(--s3); font-size:var(--fs-micro); color:var(--muted); }

  /* Macro strip — Copom & Focus, shared across all officers */
  .macro-strip { margin:0 0 var(--s4); }
  .macro-inner { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:var(--s2) var(--s4); box-shadow:var(--shadow-1); }
  .macro-lbl { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.9px; color:var(--muted); margin-right:var(--s2); }
  .mchip { display:inline-flex; align-items:baseline; gap:6px; }
  .mchip + .mchip { border-left:1px solid var(--border); padding-left:var(--s3); }
  .mchip .mk { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .mchip .mv { font-size:var(--fs-sm); font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .mchip .md { font-size:var(--fs-micro); font-variant-numeric:tabular-nums; }
  .md--up { color:var(--t-high); } .md--down { color:var(--ok); } .md--flat { color:var(--muted); }
  .macro-headline { font-size:var(--fs-sm); color:var(--muted); border-left:1px solid var(--border);
    padding-left:var(--s3); text-decoration:none; max-width:420px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .macro-headline:hover { color:var(--ink); text-decoration:underline; }
  .macro-note-dot { color:var(--muted); font-size:var(--fs-sm); cursor:help; opacity:.7; }
  .macro-note-dot:hover { opacity:1; color:var(--ink); }

  /* B3 quotes — market pulse aside the CSO board (v1 #43 → CSO) */
  .b3wrap { padding:var(--s3) var(--s4); display:flex; flex-wrap:wrap; gap:var(--s2) var(--s5); }
  .b3q { display:inline-flex; align-items:baseline; gap:6px; min-width:148px; }
  .b3q .sym { font-weight:600; color:var(--ink); font-size:var(--fs-sm); }
  .b3q .px { font-variant-numeric:tabular-nums; color:var(--ink-2); font-size:var(--fs-sm); }
  .b3q .ch { font-variant-numeric:tabular-nums; font-size:var(--fs-micro); min-width:52px; }
  .b3q .ch.up { color:var(--ok); } .b3q .ch.down { color:var(--t-crit); }

  /* Threat timeline — per-competitor ameaça trajectory (v1 → CSO) */
  .tl { padding:2px 0; }
  .tlrow { display:grid; grid-template-columns:150px 1fr 54px; align-items:center; gap:var(--s3);
    padding:5px var(--s4); border-bottom:1px solid var(--border); }
  .tlrow:last-child { border-bottom:0; }
  .tlent { font-weight:600; color:var(--ink); font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spark { width:100%; height:28px; display:block; }
  .spark--empty { color:var(--muted); font-size:var(--fs-micro); padding-left:var(--s2); }
  .spark-macro { stroke:var(--muted); stroke-width:1; stroke-dasharray:2,2; opacity:.55; }
  .tlnow { text-align:right; }

  /* Control network — commonly-controlled competitor clusters (v1 grafo → CSO) */
  .cnet { padding:2px 0; }
  .cnrow { padding:var(--s3) var(--s4); border-bottom:1px solid var(--border); }
  .cnrow:last-child { border-bottom:0; }
  .cnhd { display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; }
  .cnhub { font-weight:700; color:var(--ink); font-size:var(--fs-sm); }
  .cnmeta { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .cnmem { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .cnchip { font-size:var(--fs-micro); color:var(--ink-2); background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--r-pill); padding:2px 8px; }

  /* Perguntar à Onça — officer-scoped RAG (v1 → /exec, global) + auth */
  .authbox { display:flex; align-items:center; gap:var(--s2); }
  .authuser { font-size:var(--fs-micro); color:var(--muted); max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .authbtn { background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-radius:var(--r-sm);
    padding:4px var(--s3); font:inherit; font-size:var(--fs-micro); cursor:pointer; }
  .authbtn:hover { border-color:var(--primary); }
  /* --- Perguntar à Onça: launcher + chat panel (docs/2026-10-16-ask-chat-requirements.md) --- */
  .ask-band { margin:0 0 var(--s4); }
  .asklaunch { display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left; cursor:pointer; font:inherit;
    background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--shadow-1); padding:var(--s3) var(--s4); transition:border-color .15s, box-shadow .15s; }
  .asklaunch:hover { border-color:var(--primary); box-shadow:var(--shadow-2); }
  .asklaunch:focus-visible { outline:none; box-shadow:var(--focus); border-color:var(--primary); }
  .asklaunch__ic { display:grid; place-items:center; width:36px; height:36px; flex:none; border-radius:50%;
    background:var(--primary-weak); color:var(--primary); }
  .asklaunch__t { display:flex; flex-direction:column; min-width:0; flex:1; }
  .asklaunch__t b { font-size:1rem; }
  .asklaunch__t span { font-size:var(--fs-micro); color:var(--muted); }
  .asklaunch__k { flex:none; font:600 var(--fs-micro)/1 var(--f-mono); color:var(--muted); border:1px solid var(--border-2);
    border-bottom-width:2px; border-radius:5px; padding:3px 7px; }
  .askfab { display:none; }
  /* the panel: docked on the right on desktop so the board stays readable beside it */
  .chat { position:fixed; top:0; right:0; bottom:0; width:min(440px, 100vw); z-index:50; display:flex; flex-direction:column;
    background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-2); }
  .chat[hidden] { display:none; }   /* closed = out of layout (an off-screen fixed box widens the page, #128) */
  .chat__hd { display:flex; align-items:center; gap:var(--s2); padding:var(--s3) var(--s3) var(--s3) var(--s4); border-bottom:1px solid var(--border); }
  .chat__ttl { flex:1; min-width:0; }
  .chat__ttl h2 { font-size:1rem; margin:0; color:var(--ink); }
  .chat__ttl .sub { font-size:var(--fs-micro); color:var(--muted); }
  .chat__x { display:grid; place-items:center; width:36px; height:36px; border:0; border-radius:50%; background:none; color:var(--ink-2); cursor:pointer; }
  .chat__x:hover { background:var(--surface-2); }
  .chat__log { flex:1; overflow-y:auto; padding:var(--s4); display:flex; flex-direction:column; gap:var(--s3); overscroll-behavior:contain; }
  .chat__empty { color:var(--ink-2); font-size:var(--fs-sm); line-height:1.5; }
  .chat__empty p { margin:0 0 var(--s3); }
  .msg { max-width:92%; font-size:var(--fs-sm); line-height:1.55; }
  .msg__txt { white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg--q { align-self:flex-end; background:var(--primary); color:var(--on-primary); border-radius:14px 14px 4px 14px; padding:8px 12px; }
  .msg--a { align-self:flex-start; background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-radius:14px 14px 14px 4px; padding:10px 12px; }
  .msg--refused, .msg--err { color:var(--muted); }
  .msg .cites { margin-top:var(--s2); display:flex; flex-wrap:wrap; gap:6px; }
  .msg .cite { font-size:var(--fs-micro); color:var(--ink-2); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill); padding:2px 8px; text-decoration:none; }
  .msg a.cite:hover { border-color:var(--primary); color:var(--ink); }
  .msg .cites__none { font-size:var(--fs-micro); color:var(--muted); }
  .msg .cref { color:var(--primary); font-weight:600; }
  .msg .md-h { display:inline-block; margin-top:4px; color:var(--ink); }
  .chat__in { border-top:1px solid var(--border); padding:var(--s3) var(--s4) var(--s3); background:var(--surface); }
  .chat__row { display:flex; gap:var(--s2); align-items:flex-end; }
  #askInput { flex:1; min-width:0; resize:none; max-height:160px; background:var(--surface-2); color:var(--ink); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:9px var(--s3); font:inherit; font-size:var(--fs-sm); line-height:1.4; }
  #askInput:focus { outline:none; border-color:var(--primary); box-shadow:var(--focus); }
  #askInput:disabled { opacity:.55; }
  .chat__foot { margin-top:6px; font-size:var(--fs-micro); color:var(--muted); }
  .linkbtn { background:none; border:0; padding:0; font:inherit; color:var(--primary); cursor:pointer; text-decoration:underline; }
  /* #244: --on-primary, not #fff — white on the dark-theme mint was 2.2:1 */
  .askbtn { background:var(--primary); color:var(--on-primary); border:0; border-radius:var(--r-sm); padding:9px var(--s4);
    font:inherit; font-weight:600; font-size:var(--fs-sm); cursor:pointer; white-space:nowrap; }
  .askbtn:disabled { opacity:.5; cursor:default; }
  .askex { display:flex; flex-wrap:wrap; gap:6px; }
  .askex .chip { font:inherit; font-size:var(--fs-micro); color:var(--ink-2); background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--r-pill); padding:4px 10px; cursor:pointer; text-align:left; }
  .askex .chip:hover:not(:disabled) { border-color:var(--primary); color:var(--ink); }
  .askex .chip:disabled { opacity:.55; cursor:default; }
  .askhint { font-size:var(--fs-micro); color:var(--muted); margin-bottom:var(--s2); }
  .askhint[hidden] { display:none; }
  .thinking { color:var(--muted); }
  /* Reportar: a quiet per-answer control + inline defect/suggestion form (no modal over the board) */
  .rptslot { display:contents; }
  .rptbar { align-self:flex-start; display:flex; flex-wrap:wrap; align-items:center; gap:2px var(--s2); margin-top:calc(-1 * var(--s2));
    font-size:var(--fs-micro); color:var(--muted); }
  .rptbtn { display:inline-flex; align-items:center; gap:5px; background:none; border:0; border-radius:var(--r-sm); padding:4px 6px;
    font:inherit; font-size:var(--fs-micro); font-weight:600; color:var(--muted); cursor:pointer; }
  .rptbtn:hover { color:var(--ink); background:var(--surface-2); }
  .rptbtn:focus-visible, .rpt button:focus-visible, .rpt textarea:focus-visible { outline:none; box-shadow:var(--focus); }
  .rptcue { color:var(--ink-2); }
  .rptcue + .rptbtn { color:var(--primary); text-decoration:underline; }
  .rpt { align-self:stretch; display:flex; flex-direction:column; gap:var(--s2); background:var(--surface); color:var(--ink);
    border:1px solid var(--border-2); border-radius:var(--r-lg); padding:var(--s3); font-size:var(--fs-sm); line-height:1.45; }
  .rpt__hd { font-weight:700; font-size:var(--fs-sm); }
  .rpt__kinds { display:flex; gap:var(--s2); }
  .rpt__kind { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font:inherit; font-size:var(--fs-sm); font-weight:600;
    color:var(--ink-2); background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r-sm); padding:6px var(--s3); cursor:pointer; }
  .rpt__kind::before { content:""; width:12px; height:12px; flex:none; border-radius:50%; border:1.5px solid var(--muted); }
  .rpt__kind[aria-pressed="true"] { color:var(--ink); background:var(--primary-weak); border-color:var(--primary); }
  .rpt__kind[aria-pressed="true"]::before { border-color:var(--primary); background:radial-gradient(circle, var(--primary) 0 3px, transparent 3.5px); }
  .rpt textarea { width:100%; box-sizing:border-box; min-height:84px; resize:vertical; background:var(--surface-2); color:var(--ink);
    border:1px solid var(--border); border-radius:var(--r-sm); padding:9px var(--s3); font:inherit; font-size:var(--fs-sm); line-height:1.4; }
  .rpt textarea:focus { outline:none; border-color:var(--primary); box-shadow:var(--focus); }
  .rpt__note { margin:0; font-size:var(--fs-micro); color:var(--muted); }
  .rpt__acts { display:flex; flex-wrap:wrap; gap:var(--s2); }
  .rpt__msg { margin:0; font-size:var(--fs-micro); }
  .rpt__msg:empty { display:none; }
  .rpt__msg--err { color:var(--warn); font-weight:600; }
  .rpt--done { flex-direction:row; align-items:flex-start; gap:var(--s2); }
  .rpt--done:focus { outline:none; box-shadow:var(--focus); }
  .rpt--done .rpt__ic { color:var(--primary); font-weight:700; }
  /* desktop: the board makes room for the docked panel instead of hiding under it */
  @media (min-width: 1100px) { body.chat-open main.wrap { margin-right:440px; } }

  /* coverage */
  .cov { display:flex; gap:var(--s2); align-items:center; padding:7px var(--s4); border-bottom:1px solid var(--border); }
  .cov:last-child { border-bottom:0; }
  .cov .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .cov .dot.ok { background:var(--ok); } .cov .dot.warn { background:var(--warn); } .cov .dot.gap { background:var(--t-crit); }
  .cov .ent { font-weight:600; min-width:150px; max-width:46%; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* provenance radar — stat tiles */
  .radarwrap { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:var(--s3); padding:var(--s4); }
  .radarwrap .rt { text-align:center; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s3); }
  .radarwrap .rt b { font-size:var(--fs-stat); font-weight:700; display:block; line-height:1; color:var(--ink); }
  .radarwrap .rt span { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }

  /* recommendations + capture */
  .horizons { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s4); }
  .hz h3 { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 var(--s2);
    padding-bottom:var(--s1); border-bottom:1px solid var(--border); }
  .rec { padding:var(--s3); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:var(--s2); }
  .rec .rec-t { font-weight:600; font-size:var(--fs-sm); color:var(--ink); line-height:1.35; }
  .rec .rec-a { font-size:var(--fs-micro); color:var(--muted); margin-top:var(--s1); font-family:var(--f-mono); }
  .rec .cap { margin-top:var(--s2); display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; }
  .weekly-headline { font-size:var(--fs-md); font-weight:600; color:var(--ink); line-height:1.4; }
  .weekly-chips { margin-top:var(--s3); display:flex; flex-wrap:wrap; gap:0; }
  .rec .cap button { font:inherit; font-size:var(--fs-micro); font-weight:600; padding:4px var(--s3); border-radius:var(--r-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .rec .cap button:hover { border-color:var(--border-2); color:var(--ink); }
  .rec .cap button[data-v="aprovado"]:hover { border-color:var(--ok); color:var(--ok); }
  .rec .cap button[data-v="rejeitado"]:hover { border-color:var(--t-high); color:var(--t-high); }
  .rec .cap button:disabled { opacity:.45; cursor:default; }
  .rec .cap .done { font-size:var(--fs-micro); color:var(--ok); font-weight:600; }
  .rec .cap .ocsel { font:inherit; font-size:var(--fs-micro); background:var(--surface); color:var(--ink);
    border:1px solid var(--border); border-radius:var(--r-sm); padding:3px var(--s2); }
  .sl-warn { color:var(--t-high); font-weight:600; font-variant-numeric:tabular-nums; }
  .sl-ok { color:var(--muted); font-variant-numeric:tabular-nums; }
  .tone-src { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .brd { font-size:var(--fs-micro); color:var(--muted); display:inline-flex; align-items:center; gap:3px; cursor:pointer; }
  .brd.on { color:var(--primary); font-weight:600; }
  .hz-empty { color:var(--muted); font-size:var(--fs-micro); padding:var(--s2) 0; }

  /* Executive Flow — incident → decision trajectory cards */
  .trajs { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr)); gap:var(--s3); padding:var(--s3); }
  .traj { background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--border-2);
    border-radius:var(--r-md); padding:var(--s3); }
  .traj[data-sev="crit"] { border-left-color:var(--t-crit); }
  .traj[data-sev="high"] { border-left-color:var(--t-high); }
  .traj[data-sev="med"]  { border-left-color:var(--warn); }
  .traj-hd { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); }
  /* #219: a long provenance badge in a band header ("Telemetria bruta por fonte · erro/defasagem…",
     operator view) pushed the page 34px wider at 1280 — wrap at every width, not only on phones. */
  .band > .band-hd { flex-wrap: wrap; row-gap: 4px; }
  .band > .band-hd .badge { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
  .traj-t { font-weight:600; font-size:var(--fs-sm); color:var(--ink); flex:1; line-height:1.3; }
  .traj-b { font-size:var(--fs-meta); color:var(--ink-2); line-height:1.45; }
  .traj-f { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3); font-size:var(--fs-micro); flex-wrap:wrap; }
  .traj-f button { font:inherit; font-size:var(--fs-micro); font-weight:600; padding:3px var(--s2); border-radius:var(--r-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .traj-f button[data-tv="aprovado"]:hover { border-color:var(--ok); color:var(--ok); }
  .traj-f button[data-tv="rejeitado"]:hover { border-color:var(--t-high); color:var(--t-high); }
  .traj-f button:disabled { opacity:.45; cursor:default; }
  .traj-f .done { color:var(--ok); font-weight:600; }

  /* CPO charts (inline, token-based, dual-theme) */
  .chart { padding:var(--s3) var(--s4); }
  .crow { display:grid; grid-template-columns:150px 1fr 92px; align-items:center; gap:var(--s3); padding:5px 0; }
  /* #210: a value + badge wider than the 92px column ("R$1191bi" + "N emissor(es)") wraps to
     two lines inside it instead of overflowing leftward onto the bar fill. Growing the column
     instead squeezed the bar track to a stub. */
  .crow .cv { flex-wrap: wrap; row-gap: 2px; min-width: 0; }
  /* #210: a side-by-side band no longer stretches a 2-row panel to its tallest neighbour
     (504px for 83px of content), and a panel whose body is only an empty state collapses to a
     one-line "sem dados" strip instead of a 145–504px box. */
  #board .grid { align-items: start; }
  #board .panel .empty:only-child { flex-direction: row; justify-content: flex-start; gap: var(--s2);
    padding: var(--s2) var(--s4); text-align: left; flex-wrap: wrap; }
  #board .panel .empty:only-child .em-ico { font-size: 14px; }
  #board .panel .empty:only-child .em-d::before { content: "· "; }
  .crow .cl { font-size:var(--fs-sm); color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .cv { text-align:right; font-variant-numeric:tabular-nums; font-size:var(--fs-meta); color:var(--ink-2); display:flex; gap:var(--s2); justify-content:flex-end; align-items:center; }
  .bar { height:14px; border-radius:var(--r-sm); background:var(--surface-3); overflow:hidden; }
  .bar > i { height:100%; display:block; border-radius:var(--r-sm); }
  .stack { height:14px; border-radius:var(--r-sm); overflow:hidden; display:flex; background:var(--surface-3); }
  .stack > i { height:100%; }
  .legend { display:flex; gap:var(--s4); flex-wrap:wrap; padding:0 var(--s4) var(--s3); font-size:var(--fs-micro); color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* Reference / playbook */
  .refwrap { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:var(--s4); }
  .ref-col h4 { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin:0 0 var(--s2); padding-bottom:var(--s1); border-bottom:1px solid var(--border); }
  .ref-col ul { margin:0; padding-left:var(--s4); }
  .ref-col li { font-size:var(--fs-meta); color:var(--ink-2); line-height:1.6; }

  /* ============================ responsive (#125) ========================
     /exec's every panel band is a hardcoded multi-column CSS grid (the grid()
     helper below emits an inline grid-template-columns, so overriding it needs
     !important) plus several fixed-px label columns (.mom/.tlrow/.crow) that
     don't fit a phone. Two tiers: tablet collapses side-by-side panels to one
     column; phone additionally stacks each row's label above its value. */
  @media (max-width: 860px) {
    .wrap .grid { grid-template-columns: 1fr !important; }
    .readout { grid-template-columns: 1fr; }
    .horizons { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .horizons { grid-template-columns: 1fr; }
    /* .mom/.tlrow/.crow are all "label | middle | value" 3-column grids — put
       the label (always the first child) on its own full-width row, then let
       the middle content and value share a second, narrower-value row. */
    .mom, .tlrow, .crow { grid-template-columns: 1fr 56px; row-gap: 4px; }
    .mom > :first-child, .tlrow > :first-child, .crow > :first-child {
      grid-column: 1 / -1; white-space: normal; }
    .exrow .ent { min-width: 76px; }
    /* #159 radar rows carry a source badge + links: wrap so the reason and the
       sources each get a full-width line instead of pushing past the viewport. */
    /* band headers carry a long provenance badge (and the silence rows a long briefing):
       wrap them instead of pushing the page wider than the phone (#177 check, 390px). */
    .band > .band-hd { flex-wrap: wrap; row-gap: 4px; }
    /* overflow-wrap: the CCO PESTLE badge is words joined by middots with no spaces
       ("político·econômico·social·…"), one unbreakable run that made the page 459px wide. */
    .band > .band-hd .badge { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
    .silrow { flex-wrap: wrap; }
    /* "Sinais prospectivos": the hub meta ("hub BTG PACTUAL SERVIÇOS FINANCEIROS S/A DTVM ·
       12 expostos") is inline nowrap, so it scrolled its panel sideways at 390px. */
    .exrow--axis { flex-wrap: wrap; row-gap: 2px; }
    .exrow--axis .axis-meta { flex-basis: 100%; white-space: normal !important; overflow-wrap: anywhere; }
    .exrow--axis > span, .exrow--axis > b { overflow-wrap: anywhere; }
    .exrow--radar, .exrow--sector { flex-wrap: wrap; row-gap: 4px; }
    .exrow--radar .ttl, .exrow--radar .meta,
    .exrow--sector .ttl, .exrow--sector .meta { flex-basis: 100%; }
    .exrow--sector .ent { flex: 1; max-width: none; white-space: normal; }
    /* #212: the sector-event meta badge ("ato oficial · 3 veículo(s) · 125 entidades afetadas")
       is nowrap and 319px wide — wrap it inside the 350px panel body. */
    .exrow--sector .meta .badge { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
    /* #219 (operator view at 375): decision-card headers and the outcome-review "due" rows
       (badge · text · verdict · select · checkbox) are single flex lines — wrap them. */
    /* #218 follow-up: panel headers now carry an "N de M" count, which left the long note
       ("penetração·desenvolvimento·diversificação") 3px past a 375px screen — let it shrink/wrap. */
    .panel__hd { flex-wrap: wrap; row-gap: 2px; }
    .panel__hd .hd-note { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
    .traj-hd { flex-wrap: wrap; }
    .traj-hd > * { min-width: 0; overflow-wrap: anywhere; }
    .due-row { flex-wrap: wrap; row-gap: 4px; }
    .due-row > span[style*="flex:1"] { flex-basis: 100% !important; }
    /* #212: single long words inside a row title ("INSTRUMENTAÇÃO", "tom↑vs números↓") overran
       the panel by 3-13px; let them break on a phone. */
    .exrow .ttl { overflow-wrap: anywhere; }
    /* #212: the Ask input's intrinsic min-width (min-width:auto on a flex item) pushed the
       "Perguntar" button 6px past the viewport, so EVERY board scrolled sideways at 375px. */
    #askInput { min-width: 0; }
    /* #193 enforcement rows: the institution name ("Trustee Distribuidora de Títulos e Valores
       Mobiliários Ltda.") and the authority·confidence badge are long — wrap, never overflow. */
    .exrow--enf { flex-wrap: wrap; row-gap: 4px; }
    .exrow--enf .ttl, .exrow--enf .meta { flex-basis: 100%; }
    .exrow--enf .ent { flex: 1; max-width: none; white-space: normal; overflow-wrap: anywhere; }
    .officer-tabs a { padding: 10px var(--s3); }
    .selwrap select, .authbtn { padding: 9px var(--s2); min-height: 44px; }
    /* #163 hard gate: primary actions are at least 44×44 CSS px on a phone */
    .officer-tabs a { min-height: 44px; display: inline-flex; align-items: center; }
    .askbtn, #askInput { min-height: 44px; }
    /* #166: a compact phone header — brand + Hoje/Painel, then ONE scrolling row of officer
       tabs, then sector/account/theme; the long e-mail and the "Setor" label drop */
    .appbar { row-gap: var(--s1); }
    .officer-tabs { order: 5; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch; }
    .officer-tabs::-webkit-scrollbar { display: none; }
    .officer-tabs a { flex: 0 0 auto; white-space: nowrap; }
    .appbar > .spacer { display: none; }
    .selwrap { order: 6; flex: 1 1 auto; }
    .selwrap .hd-note { display: none; }
    .selwrap select { width: 100%; }
    #asof { display: none; }                 /* Hoje shows its own "desde" date */
    .authbox { order: 8; }
    .authbox .sub { display: none; }
    #themeBtn { order: 9; }
    .selwrap { min-width: 0; }
    /* Hoje on a phone: no page title/lede, rows stack (title gets the full width) */
    body.view-hoje .pagehead { display: none; }
    .hoje .exrow { flex-wrap: wrap; row-gap: 2px; }
    .hoje .exrow .ttl { flex: 1 1 100%; order: 5; }
    .hoje .exrow .ent { flex: 1; max-width: none; }
    .hoje-hd { flex-wrap: wrap; }
    /* #169: iOS zooms any input under 16px; chips scroll sideways; answer readable unzoomed */
    #askInput { font-size: 16px; }
    .askex .chip { min-height: 36px; display: inline-flex; align-items: center; }
    .msg { font-size: 16px; }
    .cites .cite { display: inline-flex; min-height: 36px; align-items: center; }
    .rec .cap button, .traj-f button { min-height: 44px; min-width: 88px; padding: 0 var(--s4); }
  }
  /* #166 "Hoje" — the phone-first morning brief */
  /* the Hoje/Painel switch widened the header past 860px (#128 tablet shard: 877/902px) — let
     /exec's app bar wrap below 1180px instead of the shared 780px breakpoint */
  @media (max-width: 1180px) { .appbar { flex-wrap: wrap; row-gap: var(--s1); } }
  .view-tabs a { border-bottom:2px solid transparent; border-radius:0; padding:var(--s2) var(--s3); font-weight:700; }
  .view-tabs a[aria-current="page"] { border-bottom-color:var(--primary); color:var(--ink); }
  body.view-hoje #macroStrip, body.view-hoje #askOpen, body.view-hoje #recsBand { display:none; }
  .hoje { display:flex; flex-direction:column; gap:var(--s3); }
  .hoje-sec { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md, 10px); overflow:hidden; }
  /* #210 follow-up (smoke 10-09): an empty Hoje section ("Decisões pendentes 0") was a 148px box
     while empty Painel panels are one-line strips — same strip here. */
  .hoje-sec > .empty { flex-direction: row; justify-content: flex-start; gap: var(--s2);
    padding: var(--s2) var(--s4); text-align: left; flex-wrap: wrap; }
  .hoje-sec > .empty .em-ico { font-size: 14px; }
  .hoje-sec > .empty .em-d::before { content: "· "; }
  .hoje-hd { display:flex; align-items:baseline; gap:var(--s2); padding:var(--s3) var(--s3) var(--s2); }
  .hoje-hd h2 { font-size:var(--fs-md); margin:0; }
  .hoje-hd .n { font-weight:800; color:var(--primary); }
  .hoje-hd .sub { margin-left:auto; }
  .hoje-rec { display:block; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--border);
    padding:var(--s3); color:var(--ink); font:inherit; cursor:pointer; min-height:44px; }
  .hoje-act { display:inline-flex; align-items:center; gap:var(--s1); min-height:44px; padding:0 var(--s3); }
  /* #168 decision confirm step (second tap) — online only */
  .dconf { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); width:100%; margin-top:var(--s2); }
  .dconf .dnote { flex:1 1 180px; min-height:44px; padding:0 var(--s2); border:1px solid var(--border-2); border-radius:var(--r-sm);
    background:var(--surface); color:var(--ink); font:inherit; }
  .dconf button { min-height:44px; min-width:88px; font:inherit; font-weight:700; border-radius:var(--r-sm); border:1px solid var(--border-2);
    background:var(--surface-2); color:var(--ink); cursor:pointer; }
  .dconf .dok { background:var(--primary); border-color:var(--primary); color:var(--on-primary, #fff); }
  body.is-offline .cap button, body.is-offline .traj-f button, body.is-offline .dconf .dok { pointer-events:none; opacity:.45; }
  .nonet { display:none; color:var(--warn); font-size:var(--fs-micro); font-weight:600; }
  body.is-offline .nonet { display:inline; }
  .trialbar { display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center; justify-content:space-between;
    padding:var(--s2) var(--s4); background:var(--info-fill); border-bottom:1px solid var(--border); font-size:13px; }
  .offline-bar { background: var(--warn-fill); color: var(--warn); border-bottom: 1px solid var(--warn);
    padding: var(--s2) var(--s4); font-size: 13px; text-align: center; }
  [hidden] { display: none !important; }

  /* ===================== shared additions (all widths) ===================== */
  .ot-ic { display:none; }                       /* officer-tab icons: phone tab bar only */
  .acct-btn, .whoami, .more-btn { display:none; }
  .icnbtn svg { display:block; }
  .drawer__close svg { display:block; }
  .h-lbl .badge--infer { margin-left:6px; vertical-align:1px; font-size:10px; padding:0 6px; }
  .rec .rec-a { font-family:inherit; }
  .asof--stale { color:var(--warn) !important; font-weight:600; }
  /* gated (signed out / no sector / feed down): no dead navigation around the gate */
  body.is-gated #officerTabs, body.is-gated #viewTabs, body.is-gated .selwrap,
  body.is-gated #asof, body.is-gated #askPanel, body.is-gated #recsBand, body.is-gated #macroStrip { display:none; }
  .gate .em-ico svg { width:28px; height:28px; }
  .gate-acts { display:flex; flex-wrap:wrap; gap:var(--s2); justify-content:center; }
  /* card detail */
  .dmeta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 var(--s3); }
  .dmeta .hd-note { font-size:var(--fs-meta); }
  .dmeta .dm-date { color:var(--ink-2); font-size:var(--fs-meta); font-variant-numeric:tabular-nums; margin-right:2px; }
  .dsec-h { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.8px; color:var(--muted);
    font-weight:700; margin:var(--s4) 0 var(--s2); }
  .dsrc { display:flex; flex-direction:column; gap:var(--s2); margin:0; padding:0; list-style:none; }
  .dsrc a { display:flex; gap:var(--s2); align-items:baseline; padding:10px var(--s3); border:1px solid var(--border);
    border-radius:var(--r-md); background:var(--surface-2); color:var(--ink); text-decoration:none; min-height:44px; }
  .dsrc a b { color:var(--primary); font-variant-numeric:tabular-nums; }
  .dsrc a span { min-width:0; overflow-wrap:anywhere; }
  .dsrc a small { color:var(--muted); display:block; }
  /* account sheet */
  .acct-hd { display:flex; gap:var(--s3); align-items:center; margin-bottom:var(--s4); }
  .acct-hd .av { width:48px; height:48px; font-size:20px; }
  .acct-hd .em { font-weight:700; font-size:var(--fs-md); overflow-wrap:anywhere; }
  .acct-hd .how { color:var(--muted); font-size:var(--fs-meta); }
  .av { display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; flex:none;
    background:var(--primary-weak); color:var(--primary); font-weight:800; font-size:15px;
    border:1px solid color-mix(in srgb, var(--primary) 45%, transparent); text-transform:uppercase; }
  .acct-secs { display:flex; flex-wrap:wrap; gap:6px; }
  .acct-acts { display:flex; flex-direction:column; gap:var(--s2); margin-top:var(--s5); }
  .acct-acts .btn { justify-content:center; min-height:46px; font-size:var(--fs-sm); }
  .mono { font-family:var(--f-mono); font-size:var(--fs-meta); }
  /* device settings fold at the end of Hoje */
  details.hoje-set { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); }
  details.hoje-set > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--s2);
    padding:var(--s3); min-height:48px; font-weight:600; color:var(--ink); }
  details.hoje-set > summary::-webkit-details-marker { display:none; }
  details.hoje-set > summary .sub { color:var(--muted); font-weight:400; font-size:var(--fs-meta); }
  details.hoje-set > summary::after { content:""; margin-left:auto; width:8px; height:8px; flex:none;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); }
  details.hoje-set[open] > summary::after { transform:rotate(-135deg); }
  details.hoje-set .hoje-sec { border:0; border-top:1px solid var(--border); border-radius:0; }
  .tdr-in { width:84px; }

  /* =====================================================================================
     PHONE + STORE APP (<= 640px). Native-app shell for /exec:
       - top bar: brand + data date scroll away; sector · Hoje|Painel · account stay pinned
       - bottom tab bar: the four officers, icon + label, above the home indicator
       - one column: the officer's hero readout leads, long lists cap at 5 with "Ver todos"
     Safe areas come from --safe-t/--safe-b (env() with viewport-fit=cover). */
  @media (max-width: 640px) {
    :root { --fs-sm:14px; --fs-base:15px; --fs-meta:13px; }
    html { -webkit-text-size-adjust:100%; }
    body { -webkit-tap-highlight-color:transparent;
      padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + var(--s4)); }
    body.is-gated { padding-bottom:calc(var(--safe-b) + var(--s4)); }

    /* --- top bar --------------------------------------------------------------- */
    .appbar { display:grid; grid-template-columns:minmax(0,1fr) auto 44px; grid-template-rows:54px 58px;
      grid-template-areas:"brand view view" "sel sel acct"; column-gap:var(--s2); row-gap:0; align-items:center;
      position:sticky; top:-54px; padding:var(--safe-t) var(--s4) 0; background:var(--bg);
      backdrop-filter:none; border-bottom:1px solid var(--border); }
    .appbar > .brand { grid-area:brand; }
    .brand .mark { font-size:17px; letter-spacing:1.5px; }
    .brand .ctx { background:none; color:var(--muted); padding:0; letter-spacing:.6px; font-weight:600; }
    #asof { display:none; }                 /* the data date lives in the identity strip on a phone */
    .appbar > .spacer { display:none; }
    .selwrap { grid-area:sel; position:relative; min-width:0; order:0; }
    .selwrap .hd-note { display:none; }
    .selwrap select { -webkit-appearance:none; appearance:none; width:100%; min-height:44px; padding:0 32px 0 12px;
      background:var(--surface-2); color:var(--ink); border:1px solid var(--border-2); border-radius:10px;
      font-size:15px; font-weight:600; text-overflow:ellipsis; }
    .selwrap::after { content:""; position:absolute; right:14px; top:50%; width:7px; height:7px; margin-top:-6px;
      border-right:2px solid var(--ink-2); border-bottom:2px solid var(--ink-2); transform:rotate(45deg); pointer-events:none; }
    /* #278: the segment is the tap target — 44px tall (was 38 inside 3px of padding), flush in its track */
    #viewTabs { grid-area:view; justify-self:end; display:inline-flex; gap:0; padding:0; order:0; flex-wrap:nowrap;
      background:var(--surface-2); border:1px solid var(--border-2); border-radius:12px; }
    #viewTabs a { min-height:44px; padding:0 15px; border:0; border-radius:11px; font-size:14px; font-weight:700;
      color:var(--ink-2); display:inline-flex; align-items:center; }
    #viewTabs a[aria-current="page"] { background:var(--primary); color:var(--on-primary); border:0; }
    #authBox { grid-area:acct; order:0; }
    #authBox .btn { min-height:44px; font-size:var(--fs-sm); padding:0 var(--s4); border-radius:10px; }
    body.is-authed #authBox { display:none; }
    .acct-btn:not([hidden]) { grid-area:acct; justify-self:end; display:inline-grid; place-items:center; width:44px; height:44px;
      margin-right:-4px; padding:0; border:0; background:none; cursor:pointer; border-radius:50%; }
    #themeBtn { display:none; }
    body.is-gated .appbar { grid-template-rows:58px; grid-template-areas:"brand brand acct"; top:0; }
    body[data-gate="auth"] .appbar { grid-template-areas:"brand brand brand"; }
    body[data-gate="auth"] #authBox { display:none; }   /* the gate's own Entrar is the one action */
    body.is-gated .appbar > .brand { align-self:center; }

    /* --- bottom tab bar (officers) --------------------------------------------- */
    #officerTabs { position:fixed; left:0; right:0; bottom:0; z-index:40; order:0; flex:none;
      display:grid; grid-template-columns:repeat(4,1fr); gap:0; overflow:visible;
      height:calc(var(--tabbar-h) + var(--safe-b)); padding:4px 4px var(--safe-b);
      background:var(--surface); border-top:1px solid var(--border-2);
      box-shadow:0 -6px 18px rgba(0,0,0,.28); }
    #officerTabs a { flex-direction:column; justify-content:center; align-items:center; gap:2px;
      min-height:50px; padding:2px 0; border:0; border-radius:12px; background:none;
      color:var(--muted); font-size:11.5px; font-weight:600; letter-spacing:.1px; white-space:nowrap; }
    #officerTabs a .ot-k, #officerTabs a .ot-sep { display:none; }
    #officerTabs .ot-ic { display:grid; place-items:center; width:52px; height:28px; border-radius:14px; }
    #officerTabs .ot-ic svg { width:22px; height:22px; }
    #officerTabs a[aria-current="page"] { color:var(--ink); background:none; border:0; }
    #officerTabs a[aria-current="page"] .ot-ic { background:var(--primary-weak); color:var(--primary);
      box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent); }
    #officerTabs a[aria-current="page"] .ot-l { font-weight:800; }

    /* --- identity strip + page head ------------------------------------------- */
    .wrap { padding:var(--s3) var(--s4) var(--s4); display:flex; flex-direction:column; }
    #board { display:contents; }
    .wrap > .whoami { order:-2; }
    .wrap > .pagehead { order:-1; }
    #board > .readout { order:1; }
    #macroStrip { order:2; }
    #askPanel { order:3; }
    #board > * { order:4; }
    #board > .readout { order:1; }
    #recsBand { order:5; }
    /* demoted sections: one-line headers after the actions, tap to open */
    #board > .more-hd { order:6; margin:var(--s2) 0 var(--s3); font-size:var(--fs-micro); text-transform:uppercase;
      letter-spacing:1px; color:var(--muted); font-weight:700; }
    #board > .band--fold { order:7; margin-bottom:var(--s2); }
    .band--fold > .band-hd { cursor:pointer; margin:0; padding:var(--s3) var(--s4); min-height:52px; align-items:center;
      background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); flex-wrap:nowrap; }
    .band--fold > .band-hd .overline { font-size:15px; font-weight:650; flex:1 1 auto; flex-basis:auto; }
    .band--fold > .band-hd::after { content:""; width:8px; height:8px; flex:none; margin-left:auto;
      border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); }
    .band--fold:not(.is-open) > .band-hd .badge { display:none; }
    .band--fold:not(.is-open) > :not(.band-hd) { display:none; }
    .band--fold.is-open > .band-hd { flex-wrap:wrap; border-radius:var(--r-lg) var(--r-lg) 0 0; margin-bottom:var(--s2); }
    .band--fold.is-open > .band-hd::after { transform:rotate(-135deg); position:absolute; right:var(--s4); top:22px; }
    .band--fold { position:relative; }
    .whoami:not([hidden]) { display:flex; align-items:center; gap:var(--s3); width:100%; margin:0 0 var(--s3);
      padding:10px var(--s3); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
      color:var(--ink); font:inherit; text-align:left; cursor:pointer; min-height:56px; }
    .whoami .wi-t { min-width:0; flex:1; }
    .whoami .wi-e { display:block; font-weight:700; font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .whoami .wi-s { display:block; color:var(--muted); font-size:var(--fs-meta); }
    .whoami .wi-go { width:8px; height:8px; flex:none; margin-right:4px; border-right:2px solid var(--muted);
      border-top:2px solid var(--muted); transform:rotate(45deg); }
    body.view-hoje .pagehead { display:none; }
    .pagehead { margin-bottom:var(--s3); gap:var(--s1); }
    .pagehead h1 { font-size:22px; line-height:1.2; }
    .pagehead h1 .pg-dash { display:none; }
    .pagehead h1 .pg-k { display:block; font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:1px;
      color:var(--muted); font-weight:700; margin-bottom:2px; }
    .pagehead .lede { font-size:var(--fs-meta); margin:0; }

    /* --- section / panel hierarchy: section title > card title > row ------------ */
    .band { margin-bottom:var(--s5); }
    .band > .band-hd { margin-bottom:var(--s2); }
    .band > .band-hd .overline { font-size:17px; text-transform:none; letter-spacing:0; font-weight:750;
      color:var(--ink); flex-basis:100%; }
    .band > .band-hd .rule { display:none; }
    .band > .band-hd .badge { font-size:11px; text-transform:none; letter-spacing:0; font-weight:600;
      padding:1px 8px; line-height:1.5; }
    .panel { border-radius:var(--r-lg); }
    .panel__hd { padding:var(--s3) var(--s4) var(--s2); border-bottom-color:transparent; }
    .panel__hd h2 { font-size:12px; color:var(--ink-2); }
    .panel__hd .count { background:var(--surface-3); color:var(--ink); }
    .panel__hd .count--alert { background:var(--t-crit); color:var(--on-primary); }
    .panel__bd--scroll { max-height:none; overflow:visible; }   /* no scroll-inside-scroll on a phone */
    .capped:not(.is-open) > :nth-child(n+6) { display:none; }
    .trajs.capped:not(.is-open) > :nth-child(n+4) { display:none; }
    .more-btn { display:flex; width:calc(100% - 2 * var(--s4)); margin:var(--s1) var(--s4) var(--s3);
      justify-content:center; align-items:center; min-height:44px; font:inherit; font-size:var(--fs-sm); font-weight:700;
      color:var(--primary); background:var(--surface-2); border:1px solid var(--border); border-radius:10px; cursor:pointer; }
    .band > .more-btn { width:100%; margin:var(--s2) 0 0; }

    /* --- hero readout ---------------------------------------------------------- */
    .readout { gap:var(--s3); margin-bottom:var(--s5); }
    .hero { padding:var(--s4); }
    .hero .h-val { font-size:40px; }
    .readout .tiles { grid-template-columns:1fr 1fr; gap:var(--s2); }
    .tile { padding:var(--s3); }
    .tile__n { font-size:24px; overflow-wrap:anywhere; }

    /* --- rows: two lines — meta line (date · who · score), then the headline -------- */
    .exrow { flex-wrap:wrap; row-gap:4px; column-gap:var(--s2); padding:var(--s3) var(--s4); align-items:center; }
    .exrow .ent { min-width:0 !important; max-width:none; flex:1 1 0; white-space:normal;
      overflow-wrap:anywhere; font-size:var(--fs-sm); }
    .exrow .ttl { flex:1 1 100%; order:5; -webkit-line-clamp:3; color:var(--ink-2); }
    .exrow .ttl-more { order:5; }
    .exrow .meta { order:6; flex-basis:100%; }
    .exrow .dt { min-width:0; }
    .exrow:active { background:var(--surface-2); }
    .exrow--reg .ent { flex:1 1 100%; }
    .exrow--axis > b { min-width:0 !important; flex:1 1 100%; }
    .exrow--axis > span[style*="flex:1"] { flex:1 1 100% !important; }
    .silrow { flex-wrap:wrap; row-gap:4px; }
    .silrow { padding:var(--s3) var(--s4) !important; }
    .silrow > b { min-width:0 !important; flex:1 1 0; }
    .silrow > .hd-note { flex:1 1 100% !important; white-space:normal !important; order:5; }
    .silrow > .hd-note:last-child { order:3; color:var(--ink-2); }
    .due-row > span[style*="flex:1"] { flex-basis:100% !important; }

    /* --- macro strip: one swipeable line ---------------------------------------- */
    .macro-strip { margin-bottom:var(--s3); }
    .macro-inner { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
      padding:var(--s2) var(--s3); gap:var(--s3); }
    .macro-inner::-webkit-scrollbar { display:none; }
    .macro-inner > * { flex:none; }
    .macro-headline { display:none; }

    /* --- ask: floating "Perguntar" above the tab bar (like Anteater) → full-screen chat ---- */
    .ask-band { margin:0; }
    #askOpen { display:none; }
    .askfab { display:inline-flex; align-items:center; gap:6px; position:fixed; right:var(--s4); z-index:45;
      bottom:calc(var(--tabbar-h) + var(--safe-b) + var(--s3)); min-height:48px; padding:0 18px; border:0; border-radius:24px;
      background:var(--primary); color:var(--on-primary); font:inherit; font-weight:700; font-size:15px;
      box-shadow:0 6px 18px rgba(0,0,0,.28); cursor:pointer; }
    body.is-gated .askfab { display:none; }
    .chat { width:100vw; border-left:0; z-index:58; padding-top:var(--safe-t); padding-bottom:var(--safe-b); }
    body.chat-open { overflow:hidden; }
    body.chat-open #officerTabs, body.chat-open .askfab { display:none; }

    /* --- flow / decisions ----------------------------------------------------- */
    .trajs { padding:0; gap:var(--s2); }
    .traj { background:var(--surface); }
    .traj-f { justify-content:flex-end; }
    .traj-f .hd-note { flex:1 1 100%; }
    .traj-f > .spacer { display:none; }
    .rec .cap button, .traj-f button { min-width:0; flex:1 1 0; }
    .traj-f button + button { margin-left:0; }

    /* --- recommendations: only horizons that hold something ------------------------ */
    .hz:has(> .hz-empty) { display:none; }
    .horizons { gap:var(--s3); }

    /* --- Hoje ------------------------------------------------------------------- */
    .hoje { gap:var(--s3); }
    .hoje-sec { border-radius:var(--r-lg); }
    .hoje-hd { flex-wrap:wrap; row-gap:2px; padding:var(--s4) var(--s4) var(--s2); align-items:center; }
    .hoje-hd h2 { font-size:17px; }
    .hoje-hd .n { font-size:var(--fs-meta); font-weight:800; color:var(--ink); background:var(--surface-3);
      border-radius:var(--r-pill); padding:1px 9px; }
    .hoje-hd .sub { margin-left:0; flex-basis:100%; }
    .hoje .exrow .ent { flex:1 1 0; }
    #hojeFull { justify-content:center; min-height:48px; font-size:var(--fs-sm); border-radius:12px; }

    /* --- drawer = full-screen sheet ---------------------------------------------- */
    .drawer { width:100vw; border-left:0; padding-top:var(--safe-t); padding-bottom:var(--safe-b); }
    .drawer__hd { padding:var(--s2) var(--s2) var(--s2) var(--s4); top:0; z-index:1; }
    .drawer__hd h3 { flex:1; min-width:0; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .drawer__bd { padding:var(--s4); }
    .drawer .callout { font-size:var(--fs-base); line-height:1.55; }

    /* --- gate ------------------------------------------------------------------- */
    body.is-gated .pagehead, body.is-gated .whoami { display:none; }
    body.is-gated #board > .empty, body.is-gated #board > .gate { min-height:calc(100vh - 220px); justify-content:center;
      gap:var(--s2); padding:var(--s5) var(--s2); }
    .gate .em-ico { color:var(--primary); opacity:1; margin-bottom:var(--s2); }
    .gate .em-ico svg { width:40px; height:40px; }
    .gate .em-t { font-size:21px; line-height:1.3; color:var(--ink); }
    .gate .em-d { font-size:var(--fs-sm); line-height:1.5; max-width:34ch; color:var(--ink-2); }
    .gate .btn { min-height:50px; min-width:240px; justify-content:center; font-size:16px; border-radius:12px; }
    .gate-acts { flex-direction:column; align-items:center; }
    .gate form { width:100%; }
    .gate form label.cvsub { display:flex !important; align-items:center; gap:var(--s3); min-height:48px;
      margin:var(--s2) 0 !important; padding:0 var(--s3); border:1px solid var(--border-2); border-radius:10px;
      background:var(--surface); color:var(--ink); font-size:15px; }
    .gate form label.cvsub:has(input:checked) { border-color:var(--primary); background:var(--primary-weak); }
    .gate form input[type="radio"] { width:20px; height:20px; accent-color:var(--primary); margin:0; }
    .gate form button[type="submit"] { width:100%; min-width:0; }

    /* --- charts ------------------------------------------------------------------ */
    .scatter { padding:var(--s3) var(--s2); }
    .sc-legend { justify-content:flex-start; padding:0 var(--s2); }
  }

  /* #278: on a touch screen every interactive target is >= 44px tall (WCAG 2.5.5 / HIG), like the #245
     rules in /v2/app.css. Small inline links (evidência, the [n] source markers in a row) keep their
     look and get an invisible hit area instead: a ::before that is hit-tested but never painted.
     Desktop (fine pointer) is untouched. */
  @media (pointer: coarse) {
    .traj-f a[data-ev], .rec-a a[data-ev], .exrow .meta a, .exrow .ttl-more { position:relative; }
    .traj-f a[data-ev]::before, .rec-a a[data-ev]::before { content:""; position:absolute; inset:-16px -8px; }
    .exrow .meta a { margin-right:8px; }                          /* keep neighbouring [n] hit areas apart */
    .exrow .meta a::before { content:""; position:absolute; inset:-16px -8px; }
    .exrow .ttl-more::before { content:""; position:absolute; inset:-14px -10px; }
    .cites .cite, .askex .chip { display:inline-flex; align-items:center; min-height:44px; }
    .chat__x { width:44px; height:44px; }
    /* Reportar: 44px hit areas; 16px field text so iOS doesn't zoom on focus */
    .rptbtn, .rpt__kind, .rpt .btn, .rpt .askbtn { min-height:44px; }
    .rptbtn { padding:4px 10px; font-size:var(--fs-sm); }
    .rptbar { font-size:var(--fs-sm); }
    .rpt textarea { font-size:16px; }
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="mark">ON<b>Ç</b>A</span><span class="ctx">Executivo</span></div>
  <nav class="ctxnav view-tabs" id="viewTabs" aria-label="Visão">
    <a href="#hoje" data-view="hoje">Hoje</a><a href="#painel" data-view="painel">Painel</a></nav>
  <nav class="ctxnav officer-tabs" id="officerTabs" aria-label="Oficiais"></nav>
  <span class="spacer"></span>
  <span class="selwrap"><label for="sectorSel" class="hd-note">Setor</label>
    <select id="sectorSel"><option value="__all__">Todos os setores</option></select></span>
  <span class="sub" id="asof">—</span>
  <span class="authbox" id="authBox"></span>
  <button class="acct-btn" id="acctBtn" type="button" hidden aria-label="Sua conta"><span class="av" aria-hidden="true"></span></button>
  <button class="icnbtn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
</header>

<div class="offline-bar" id="offlineBar" role="status" hidden></div>
<div id="trialBar" hidden></div>
<main class="wrap">
  <button class="whoami" id="whoAmI" type="button" hidden></button>
  <div class="pagehead"><h1 id="pgTitle">Sala executiva</h1><p class="lede" id="pgLede"></p></div>
  <div id="macroStrip" class="macro-strip"></div>
  <section id="askPanel" class="ask-band"></section>
  <div id="board"><div class="loading" role="status" aria-live="polite"><span class="ld-c" aria-hidden="true">ç</span><span class="ld-t">Carregando seu painel…</span></div></div>
  <section class="band" id="recsBand">
    <div class="band-hd"><span class="overline">Ações recomendadas</span><span class="rule"></span>
      <span class="badge badge--ghost">captura ativa · decisões registradas no histórico</span></div>
    <div class="panel"><div class="panel__bd" id="recs"><div class="loading" role="status" aria-live="polite"><span class="ld-c" aria-hidden="true">ç</span><span class="ld-t">Carregando…</span></div></div></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drTitle">
  <div class="drawer__hd"><h3 id="drTitle">Inspeção</h3>
    <button class="btn btn--sm drshare" id="drShare" type="button" hidden>Compartilhar</button>
    <button class="drawer__close" id="drClose" aria-label="Fechar"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="drawer__bd" id="drBody"></div>
</aside>

<script src="/v2/app.js"></script>
<script src="/v2/context.js"></script>
<script>
const U = window.OncaUI;
let DATA = {}, EX = {}, OFFICER = "cso", SECTOR = "__all__", BYID = {};
// Operator view (?admin=1&opkey=…, #122) — gates the raw per-source ingestion band (#139):
// clients get the coverage-confidence TILE only, never per-source names/errors.

  // §E intelligence: which entities/sectors draw executive attention (from the engagement rollup).

    : "";

// --- CORS followed-link beacon (§H) — attach a consulted source to a decision
function beacon(did, url, officer) {
  if (!did || !url) return;
  const body = JSON.stringify({ intent: "append_reference", officer, args: { decision_id: did, url, officer } });
  // navigator.sendBeacon cannot set headers, so it cannot carry the SigV4 payload
  // hash the AWS_IAM function URL now requires (WAF Phase 0). fetch(keepalive) keeps
  // the survive-unload guarantee for a body this small and does allow headers.
  try {
    actFetch(body, { keepalive: true }).catch(() => {});
  } catch (e) { /* best-effort — never blocks navigation */ }
}
// §E engagement telemetry — an attention event (headline expand/open), tagged for intelligence.
function engage(kind, action, cardId) {
  const c = cardId ? BYID[cardId] : null;
  const body = JSON.stringify({ intent: "record_engagement", officer: OFFICER, args: {
    kind, action, officer: OFFICER, sector: SECTOR, card_id: cardId,
    entity: c && c.entity, threat_score: c && c.threat_score,
    industries: (c && c.industries) || [], topics: (c && c.topics) || [],
    device: deviceClass(), standalone: isStandalone() } });
  // See beacon() above: sendBeacon cannot sign, fetch(keepalive) can.
  try {
    actFetch(body, { keepalive: true }).catch(() => {});
  } catch (e) { /* best-effort */ }
}
function evUrl(evId) { const c = BYID[evId]; return (c && (c.citations || [])[0] && c.citations[0].url) || ("card:" + evId); }
function onEvidence(a) {
  const evId = a.getAttribute("data-ev");
  const host = a.closest(".traj") || a.closest(".rec");
  if (host && host.dataset.did) beacon(host.dataset.did, evUrl(evId), host.dataset.off || OFFICER);
  inspect(evId);
}

// Phone: a long list shows its first rows and a "Ver todos (N)" button instead of a 460px box that
// scrolls inside the page (a scroll trap on touch). Desktop CSS ignores .capped and the button.
function capLists(root) {
  const cap = (host, n, after) => {
    const total = host.children.length;
    if (total <= n + 1) return;
    host.classList.add("capped");
    after.insertAdjacentHTML("afterend", `<button class="more-btn" type="button">Ver todos (${total})</button>`);
    const b = after.nextElementSibling;
    b.addEventListener("click", () => { host.classList.add("is-open"); b.remove(); });
  };
  root.querySelectorAll(".panel__bd--scroll").forEach(bd => {
    const one = bd.children.length === 1 ? bd.firstElementChild : null;
    cap(one && one.children.length > 1 ? one : bd, 5, bd);
  });
  root.querySelectorAll(".trajs[data-cap]").forEach(t => cap(t, Number(t.getAttribute("data-cap")) || 3, t));
}

  cro: ["Fluxo executivo", "Eventos setoriais", "Calendário de conformidade", "Impacto & alcance", "Solidez prudencial"],

    const hd = b.querySelector(":scope > .band-hd"), ov = hd && hd.querySelector(".overline");

// --- #167 content-free push: opt-in per device, per alert type ------------------------------
// The notification never carries a finding ("Novo alerta no seu painel Onça" + a count); the
// finding shows only after the app opens. iOS needs 16.4+ AND the app installed to the home screen.
const PUSH_TYPE_PT = { radar: "radar de produto (instabilidade/reclamações)", distress: "estresse financeiro / RJ",
                       regulatory: "mudança regulatória material" };
const PUSH_DEFAULT = { cso: ["radar", "distress", "regulatory"], cpo: ["radar"], cco: ["distress"], cro: ["regulatory"] };
function pushSupported() {
  if (Ctx.inApp()) return true;   // #256: the store app pushes natively (APNs/FCM via the shell)
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
// #256: in the store app the device's Expo push token is the subscription "endpoint"; the shell
// asks the OS for permission only when `request` is true. Same shape as a web PushSubscription.
async function nativeSub(request) {
  const r = await Ctx.askShell("push:token", { request: !!request });
  if (!r || !r.token) return request ? Promise.reject(new Error((r && r.reason) || "permissão negada no aparelho")) : null;
  const endpoint = "expo:" + r.token;
  return { endpoint, toJSON: () => ({ endpoint }), unsubscribe: async () => true };
}
function b64uBytes(s) {
  const b = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function pushSub() {
  if (Ctx.inApp()) return nativeSub(false);
  const reg = await navigator.serviceWorker.getRegistration("/exec");
  return reg ? reg.pushManager.getSubscription() : null;
}
async function pushApi(path, body, method) {
  await Ctx.ensureSession();
  const r = await fetch(path, { method: method || "POST", cache: "no-store",
    headers: { "content-type": "application/json", authorization: `Bearer ${Ctx.getIdToken() || ""}` },
    body: body ? JSON.stringify(body) : undefined });
  return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status));
}
async function renderPushBox(note) {
  const box = document.getElementById("pushBox"); if (!box || ADMIN) { if (box) box.innerHTML = ""; return; }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (!pushSupported()) {
    box.innerHTML = `<p class="hd-note">${ios && !isStandalone() ? "No iPhone, instale o app (Compartilhar → Adicionar à Tela de Início) para receber alertas." : "Este navegador não suporta alertas."}</p>`;
    return;
  }
  const sub = await pushSub().catch(() => null);
  let state = null;
  if (sub) { try { state = await pushApi(`/api/me/push?endpoint=${encodeURIComponent(sub.endpoint)}`, null, "GET"); } catch (e) {} }
  // #217: same race as renderDigestBox (9ba0e41) — a view/officer switch during the awaits
  // detaches this box; the fresh render has its own call.
  if (!box.isConnected) return;
  const on = !!(sub && state && state.subscribed);
  const types = (on && state.prefs && state.prefs.types) || PUSH_DEFAULT[OFFICER] || PUSH_DEFAULT.cso;
  box.innerHTML = `<div style="padding:0 var(--s3) var(--s3)">
    ${Object.keys(PUSH_TYPE_PT).map(t => `<label class="cvsub" style="display:flex;gap:var(--s2);align-items:center;min-height:44px">
      <input type="checkbox" class="ptype" value="${t}" ${types.indexOf(t) !== -1 ? "checked" : ""}> ${U.esc(PUSH_TYPE_PT[t])}</label>`).join("")}
    <p class="hd-note">Silêncio 21h–7h · no máximo 3 por dia (o excedente vira um só aviso).</p>
    <button class="btn ${on ? "" : "btn--primary"} hoje-act" id="pushToggle" type="button">${on ? "Desativar alertas neste aparelho" : "Ativar alertas neste aparelho"}</button>
    ${on ? `<button class="btn hoje-act" id="pushSave" type="button">Salvar tipos</button>` : ""}
    <span class="hd-note" id="pushMsg">${U.esc(note || "")}</span></div>`;
  const msg = (t) => { const e = box.querySelector("#pushMsg"); if (e) e.textContent = t; };
  const chosen = () => [...box.querySelectorAll(".ptype:checked")].map(x => x.value);
  box.querySelector("#pushToggle").onclick = async () => {
    let note = "";
    try {
      if (on) { await disablePush(); note = "alertas desativados"; }
      else {
        let ps;
        if (Ctx.inApp()) ps = await nativeSub(true);
        else {
          if (await Notification.requestPermission() !== "granted") { msg("permissão negada no aparelho"); return; }
          const reg = await navigator.serviceWorker.ready;
          const cfg = await pushApi("/api/me/push", null, "GET");
          ps = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(cfg.public_key) });
        }
        await pushApi("/api/me/push/subscribe", { subscription: ps.toJSON(), officer: OFFICER, prefs: { types: chosen() } });
        engage("push", "open", null);
        note = "alertas ativados";
      }
    } catch (e) { note = "não foi possível ativar neste navegador (" + (e.message || e) + ")"; }
    renderPushBox(note);
  };
  const save = box.querySelector("#pushSave");
  if (save) save.onclick = async () => {
    try { await pushApi("/api/me/push/subscribe", { subscription: sub.toJSON(), officer: OFFICER, prefs: { types: chosen() } }); msg("tipos salvos"); }
    catch (e) { msg("falha ao salvar"); }
  };
}

// --- #168 decisions from the phone: a second tap + optional note, idempotent, online-only ---
// A decision is append-only (irreversible), so every Aprovar/Rejeitar asks for confirmation. The
// idempotency key is minted at the FIRST tap and reused by every retry of that same choice, so a
// double tap or a retry after a timeout records ONCE. Offline, nothing is queued: the buttons are
// disabled ("sem conexão") — a decision must never land hours later.
function newIdem() {
  try { return crypto.randomUUID(); } catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
}
function askConfirm(btn, doCapture) {
  if (!navigator.onLine || OFFLINE) { syncOnline(); return; }
  const verdict = btn.getAttribute("data-tv") || btn.getAttribute("data-v");
  const holder = btn.parentElement;
  const idem = newIdem();
  const prev = holder.innerHTML;
  const word = verdict === "aprovado" ? "aprovação" : "rejeição";
  holder.insertAdjacentHTML("beforeend", `<div class="dconf"><span>Confirmar <b>${word}</b>?</span>
    <input class="dnote" maxlength="280" placeholder="nota (opcional)" aria-label="Nota da decisão">
    <button class="dok">Confirmar</button><button class="dcancel">Cancelar</button><span class="nonet">sem conexão</span></div>`);
  holder.querySelectorAll("button[data-tv],button[data-v]").forEach(b => { b.hidden = true; });
  const conf = holder.querySelector(".dconf");
  conf.querySelector(".dcancel").onclick = () => { holder.innerHTML = prev; rewire(holder, doCapture); };
  conf.querySelector(".dok").onclick = async () => {
    if (!navigator.onLine || OFFLINE) { syncOnline(); return; }
    const ok = conf.querySelector(".dok"); ok.disabled = true; ok.textContent = "Registrando…";
    const note = (conf.querySelector(".dnote").value || "").trim();
    const done = await doCapture(btn, { idem, note });
    if (done === false) { ok.disabled = false; ok.textContent = "Tentar de novo"; }   // same idem on retry
  };
}
function rewire(holder, doCapture) {
  holder.querySelectorAll("button[data-tv],button[data-v]").forEach(b => b.addEventListener("click", () => askConfirm(b, doCapture)));
}
