  const industry = SECTOR !== "__all__" ? SECTOR : (r.industries && r.industries[0]) || null;
  const res = await postAct({ intent: "record_decision", officer: OFFICER, idempotency_key: x.idem,
    args: { officer: OFFICER, recommendation: r.text, verdict, industry, action_ref: r.action, evidence_id: r.evidence_id,
            context_id: r.horizon, started_at: SEEN["rec:" + r.horizon + ":" + r.text], rationale: x.note || null } });
  if (!res || !res.decision_id) return false;
  const rcard = cap.closest(".rec"); if (rcard) { rcard.dataset.did = res.decision_id; rcard.dataset.off = OFFICER; }
  cap.innerHTML = `<span class="done">✓ ${verdict}</span><span class="hd-note">resultado:</span>
    <select data-did="${res.decision_id}" class="ocsel"><option value="pendente">pendente</option>
      <option value="favoravel">favorável</option><option value="desfavoravel">desfavorável</option><option value="neutro">neutro</option></select>${boardHtml()}`;
  cap.querySelector(".ocsel").addEventListener("change", (e) => setOutcome(res.decision_id, e.target.value, e.target));
  wireBoard(cap, res.decision_id);
}
async function setOutcome(did, outcome, sel) {
  sel.disabled = true; const res = await postAct({ intent: "set_outcome", officer: OFFICER, args: { decision_id: did, outcome } });
  sel.disabled = false; if (res && res.decision_outcome) sel.title = "resultado registrado";
}
async function postAct(body) {
  if (body && body.intent === "record_decision" && body.args) body.args.device = deviceClass();
  try { if (!ADMIN) await Ctx.ensureSession();
    const r = await actFetch(JSON.stringify(body)); return await r.json(); }
  catch (e) { console.error("act failed", e); return null; }
}

// --- drill-down ------------------------------------------------------------
function inspectSectorEvent(id) {
  const r = (((EX.cro || {}).panels || {}).sector_events || []).find(x => x.id === id);
  if (!r) return false;
  const src = (r.sources || []).map(s => `<li><a href="${U.esc(s.url)}" target="_blank" rel="noopener">${U.esc(s.title || s.url)}</a>` +
    ` <span class="hd-note">${U.esc(s.kind === "official" ? "ato oficial" : "imprensa")} · ${U.esc(s.label || "")}${s.via ? " · via " + U.esc(s.via) : ""}` +
    `${s.section ? " · " + U.esc(s.section) : ""} · ${U.esc(s.date || "")}</span></li>`).join("");
  document.getElementById("drTitle").textContent = "Evento setorial — " + (r.change_label || "mudança regulatória");
  document.getElementById("drBody").innerHTML = `<div class="callout"><p><b>${U.esc(r.title || "")}</b></p>` +
    (r.summary ? `<p>${U.esc(r.summary)}</p>` : "") +
    `<p class="hd-note">Severidade ${U.esc(SECTOR_SEV_PT[r.severity] || r.severity || "—")} · ${U.esc(SECTOR_CONF_PT[r.confidence] || r.confidence || "")}` +
    ` · ${r.n_affected || 0} ${(r.n_affected || 0) === 1 ? "entidade do setor afetada" : "entidades do setor afetadas"}</p><ol>${src}</ol></div>`;
  openDrawer(id);
  return true;
}
function inspectEnforcement(id) {
  const r = (((EX.cco || {}).panels || {}).enforcement || []).find(x => x.id === id);
  if (!r) return false;
  const KIND = { official: "ato oficial", registry: "cadastro oficial", news: "imprensa" };
  const src = (r.sources || []).map(s => `<li><a href="${U.esc(s.url)}" target="_blank" rel="noopener">${U.esc(s.title || s.url)}</a>` +
    ` <span class="hd-note">${U.esc(KIND[s.kind] || s.kind || "")} · ${U.esc(s.label || "")} · ${U.esc(s.date || "")}</span></li>`).join("");
  document.getElementById("drTitle").textContent = "Medida de supervisão — " + (r.kind_label || r.kind || "");
  document.getElementById("drBody").innerHTML = `<div class="callout"><p><b>${U.esc(r.label || r.target || "—")}</b></p>` +
    `<p>${U.esc(r.title || "")}</p>` + (r.summary && r.summary !== r.title ? `<p>${U.esc(r.summary)}</p>` : "") +
    `<p class="hd-note">${U.esc(r.authority || "")} · severidade ${U.esc(SECTOR_SEV_PT[r.severity] || r.severity || "—")} · ` +
    `${U.esc(ENF_CONF_PT[r.confidence] || r.confidence || "")}${r.entity ? "" : " · instituição fora do roster"}</p><ol>${src}</ol></div>`;
  openDrawer(id);
  return true;
}
// #239/#240: one binding for every row, Painel and Hoje alike. The target is resolved up front so
// a row that opens nothing never looks (or tabs as) clickable; rows that do open something get
// mouse AND keyboard activation (Enter/Space), tabindex and a role.
function inspectTarget(id) {
  id = String(id || "");
  if (!id) return null;
  if (BYID[id] || id.indexOf("sector_event:") === 0 || id.indexOf("enf:") === 0) return id;
  // a Hoje trajectory keyed by ENTITY ("Inadimplência elevada — Crefisa"): its latest card
  const cs = Object.values(BYID).filter(c => c.entity === id)
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  return cs.length ? cs[0].id : null;
}
function activateRow(row, fn, role) {
  row.setAttribute("tabindex", "0"); row.setAttribute("role", role);
  row.addEventListener("click", fn);
  row.addEventListener("keydown", (e) => {
    if (e.target !== row || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault(); fn();
  });
}
// #283: a click anywhere on a row opens its sources drawer (bindRows), headline included. A headline
// the 3-line clamp actually cuts gets an explicit "ver mais"/"ver menos" button after it (a real <button>:
// Enter/Space work, and the row's own Enter/Space handler ignores keys from children). Expanding is an
// attention event (§E engagement telemetry) tagged with the card's entity/sector/threat.
// A ResizeObserver decides when the button shows, so rows hidden by a fold or a "Ver todos" cap get theirs
// the moment they are revealed, and a rotation/resize re-checks the clamp.
let TTL_RO = null;
function syncMore(t) {
  const b = t.nextElementSibling;
  if (!b || !b.classList.contains("ttl-more")) return;
  b.hidden = !(t.classList.contains("is-expanded") || t.scrollHeight > t.clientHeight + 1);
}
function wireHeadlines(el) {
  if (TTL_RO) TTL_RO.disconnect();
  else if ("ResizeObserver" in window) TTL_RO = new ResizeObserver(es => es.forEach(en => syncMore(en.target)));
  el.querySelectorAll(".exrow .ttl").forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "ttl-more"; b.hidden = true; b.textContent = "ver mais";
    b.setAttribute("aria-expanded", "false");
    b.addEventListener("click", (e) => {
      e.stopPropagation();   // the control expands the headline; it does not open the drawer
      const expanded = t.classList.toggle("is-expanded");
      b.textContent = expanded ? "ver menos" : "ver mais"; b.setAttribute("aria-expanded", String(expanded));
      const row = t.closest(".exrow");
      engage("headline", expanded ? "expand" : "collapse", row && row.getAttribute("data-id"));
    });
    t.after(b);
    if (TTL_RO) TTL_RO.observe(t); else syncMore(t);
  });
}
function bindRows(el) {
  el.querySelectorAll(".exrow[data-id]").forEach(row => {
    const t = inspectTarget(row.getAttribute("data-id"));
    if (t) activateRow(row, () => inspect(t), "button");
  });
  el.querySelectorAll(".exrow[data-url],.exrow[data-href]").forEach(row => {
    const u = row.getAttribute("data-url") || row.getAttribute("data-href");
    if (u) activateRow(row, () => window.open(u, "_blank", "noopener"), "link");
  });
}
// Card detail: WHEN (date), WHERE (sectors), HOW SERIOUS (ameaça, labelled as inference), WHAT
// KIND (lens) and — the moat — WHERE IT COMES FROM: every source as a tappable row. A card with no
// http citation says "sem fonte citada" instead of looking like a sourced fact.
const LENS_LABEL = { regulatory: "regulatório", news: "imprensa", market: "mercado", pricing: "preço", ofertas: "ofertas",
  entrants: "novos entrantes", fatos: "fato relevante", funds: "fundos", dou: "Diário Oficial", sanctions: "sanções",
  antitrust: "antitruste", distress: "insolvência", reputation: "reputação", product: "produto", pix: "Pix", juros: "juros" };
function cardDetail(c) {
  const model = U.citationModel(c);
  const body = U.linkifyNarrative(c.narrative || "", model);   // also registers inline URLs as sources
  const secs = (c.industries || []).map(s => `<span class="chip">${U.esc(Ctx.indLabel(s))}</span>`).join("");
  const lenses = (c.lenses || []).map(l => LENS_LABEL[l] || humanize(l)).slice(0, 3);
  const thr = c.threat_score != null ? threatChip(c.threat_score) : "";
  const meta = `<div class="dmeta">${c.date ? `<span class="dm-date" title="${U.esc(U.fmtDate(c.date))}">${U.esc(dShort(c.date))}${
      c.date && String(c.date).slice(0, 4) === String(new Date().getFullYear()) ? " " + String(c.date).slice(0, 4) : ""}</span>` : ""}` +
    (thr ? `<span class="badge badge--infer" title="índice 0–100 calculado pela Onça">ameaça · inferência</span>${thr}` : "") +
    (c.is_inference ? `<span class="badge badge--infer">inferência</span>` : "") +
    (!model.entries.length ? `<span class="badge badge--warn">sem fonte citada</span>` : "") +
    `${secs}${lenses.length ? `<span class="hd-note">· ${U.esc(lenses.join(" · "))}</span>` : ""}</div>`;
  const src = model.entries.length
    ? `<div class="dsec-h">${pl(model.entries.length, "fonte", "fontes")}</div><ol class="dsrc">` + model.entries.map(e =>
        `<li><a href="${U.esc(e.url)}" target="_blank" rel="noopener"><b>[${e.n}]</b><span>${U.esc(e.label)}` +
        `<small>${U.esc(U.hostOf(e.url))}${e.via ? " · via " + U.esc(e.via) : ""}</small></span></a></li>`).join("") + `</ol>`
    : `<p class="hd-note" style="margin-top:var(--s3)">Este cartão não traz link para a fonte original — trate como não verificado.</p>`;
  return meta + `<div class="callout">${body}</div>` + src;
}
function inspect(id) {
  if (String(id || "").indexOf("sector_event:") === 0 && inspectSectorEvent(id)) return;
  if (String(id || "").indexOf("enf:") === 0 && inspectEnforcement(id)) return;
  const c = BYID[id];
  document.getElementById("drTitle").textContent = (c && (c.entity_label || c.subject_label || c.entity)) || "Detalhe";
  document.getElementById("drBody").innerHTML = c ? cardDetail(c) : U.empty("Sem cartão citável", `id: ${id || "—"}`, "○");
  openDrawer(c ? id : null);
}
// ADR 027 #129 caught this live: these used to toggle a ".on" class that no CSS rule
// anywhere defines (the shared v2/app.css only has `.drawer.open`/`.scrim.open`) — so
// aria-hidden and the drawer's content flipped correctly but the slide-in transform
// never fired; the drawer was functionally open yet stayed fully off-screen. "open" is
// the class the shared component vocabulary actually styles.
// --- #170 share a card without leaking it -----------------------------------------------
// The link is /exec?c=<first 16 hex of SHA-256(card id)> — card ids name entities
// ("cand-ent-itau-unibanco"), so the id itself never goes in the URL. The page's OpenGraph
// tags are generic, the share sheet gets no text, and the recipient must sign in: the hash is
// resolved against THEIR scoped feed, so a card outside their licence is "sem acesso".
let SHARE_ID = null;
async function sha16(v) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(v)));
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}
function shareableIds() {
  const ids = Object.keys(BYID);
  (((EX.cro || {}).panels || {}).sector_events || []).forEach(e => ids.push(e.id));
  (((EX.cco || {}).panels || {}).enforcement || []).forEach(e => e && e.id && ids.push(e.id));
  return ids;
}
async function shareCurrent() {
  if (!SHARE_ID) return;
  const url = `${location.origin}/exec?c=${await sha16(SHARE_ID)}`;
  const btn = document.getElementById("drShare");
  engage("share", "open", BYID[SHARE_ID] ? SHARE_ID : null);   // #165 count
  if (Ctx.inApp()) { Ctx.shareViaShell(url); return; }   // #258: native share sheet in the store app
  try {
    if (navigator.share) { await navigator.share({ title: "Onça — painel executivo", url }); return; }
    await navigator.clipboard.writeText(url);
    btn.textContent = "link copiado ✓"; setTimeout(() => { btn.textContent = "Compartilhar"; }, 2500);
  } catch (e) { /* the user dismissed the share sheet */ }
}
document.getElementById("drShare").addEventListener("click", shareCurrent);
async function resolveSharedLink() {
  const c = new URLSearchParams(location.search).get("c");
  if (!c || !/^[0-9a-f]{16}$/.test(c)) return;
  const url = new URL(location.href); url.searchParams.delete("c");
  history.replaceState({}, "", url.pathname + (url.search || "") + url.hash);
  for (const id of shareableIds()) {
    if (await sha16(id) === c) { if (VIEW === "hoje") { setView("painel"); render(); } inspect(id); return; }
  }
  SHARE_ID = null;
  document.getElementById("drTitle").textContent = "Sem acesso";
  document.getElementById("drBody").innerHTML = U.empty("Sem acesso a este conteúdo",
    "O item compartilhado não está no escopo da sua licença — ou saiu da janela de dados.", "⦸");
  openDrawer(null);
}
// #240: the drawer is a modal dialog for keyboard users too — focus moves in on open (to the
// close button), Tab stays inside, Esc closes, and focus returns to the row that opened it.
let DR_RETURN = null;
function drawerIsOpen() { return document.getElementById("drawer").classList.contains("open"); }
function openDrawer(shareId) {
  if (!drawerIsOpen()) DR_RETURN = document.activeElement;
  SHARE_ID = shareId || null;
  const sb = document.getElementById("drShare"); if (sb) sb.hidden = !SHARE_ID || ADMIN;
  document.getElementById("drawer").setAttribute("aria-hidden", "false");
  document.getElementById("scrim").classList.add("open"); document.getElementById("drawer").classList.add("open");
  document.getElementById("drClose").focus({ preventScroll: true }); }
function closeDrawer() {
  const wasOpen = drawerIsOpen();
  document.getElementById("drawer").setAttribute("aria-hidden", "true");
  document.getElementById("scrim").classList.remove("open"); document.getElementById("drawer").classList.remove("open");
  if (wasOpen && DR_RETURN && document.contains(DR_RETURN)) DR_RETURN.focus({ preventScroll: true });
  DR_RETURN = null;
}
document.addEventListener("keydown", (e) => {
  if (!drawerIsOpen()) return;
  if (e.key === "Escape") { e.preventDefault(); closeDrawer(); return; }
  if (e.key !== "Tab") return;
  const dr = document.getElementById("drawer");
  const f = Array.from(dr.querySelectorAll('a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(x => !x.disabled && !x.hidden && x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!dr.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
