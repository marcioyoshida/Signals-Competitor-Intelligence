<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Onça · Sala Executiva</title>
<link rel="stylesheet" href="/v2/app.css" />
<style>
  /* v3 executive — built on the shared design tokens (dual-theme, no hardcoded hex) */
  .officer-tabs { display:flex; gap:2px; }
  .officer-tabs a { border-bottom:2px solid transparent; border-radius:0; padding:var(--s2) var(--s3); }
  .officer-tabs a[aria-current="page"] { color:var(--ink); background:transparent; border-bottom-color:var(--primary); }
  .selwrap { display:flex; align-items:center; gap:var(--s2); }
  .selwrap select { background:var(--surface-2); color:var(--ink); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:5px var(--s2); font:inherit; font-size:var(--fs-meta); }

  /* Hero readout — the promoted metric that leads every board */
  .readout { display:grid; grid-template-columns:minmax(230px,.85fr) 2fr; gap:var(--s4); margin-bottom:var(--s4); }
  .hero { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:var(--s4) var(--s5); box-shadow:var(--shadow-1); display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .hero .h-lbl { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.9px; color:var(--muted); }
  .hero .h-row { display:flex; align-items:baseline; gap:var(--s3); }
  .hero .h-val { font-size:var(--fs-hero); font-weight:800; line-height:1; letter-spacing:.3px; color:var(--ink); }
  .hero .h-sub { font-size:var(--fs-meta); color:var(--muted); margin-top:2px; }
  .gauge { height:8px; border-radius:var(--r-pill); background:var(--surface-3); overflow:hidden; margin-top:var(--s2); }
  .gauge > i { display:block; height:100%; border-radius:var(--r-pill); }
  .readout .tiles { align-content:center; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
  .tile { position:relative; }
  .tile.is-crit { border-left:3px solid var(--t-crit); } .tile.is-high { border-left:3px solid var(--t-high); }
  .tile.is-warn { border-left:3px solid var(--warn); } .tile.is-ok { border-left:3px solid var(--ok); }

  /* rows */
  .exrow { display:flex; gap:var(--s3); align-items:baseline; padding:var(--s2) var(--s4);
    border-bottom:1px solid var(--border); cursor:pointer; }
  .exrow:last-child { border-bottom:0; }
  .exrow:hover { background:var(--surface-2); }
  .exrow .ent { font-weight:600; min-width:118px; color:var(--ink); }
  .exrow .ttl { flex:1; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-sm); }
  .exrow .dt { color:var(--muted); font-size:var(--fs-micro); min-width:64px; font-variant-numeric:tabular-nums; }
  .exrow .meta { color:var(--muted); font-size:var(--fs-micro); font-variant-numeric:tabular-nums; }

  /* momentum — diverging bar anchored to a center baseline (rising vs receding) */
  .mom { display:grid; grid-template-columns:140px 1fr 66px; align-items:center; gap:var(--s3);
    padding:6px var(--s4); border-bottom:1px solid var(--border); }
  .mom:last-child { border-bottom:0; }
  .mom .lbl { font-weight:600; color:var(--ink); font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mom .track { position:relative; height:12px; }
  .mom .track::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--border-2); }
  .mom .track i { position:absolute; top:1px; bottom:1px; border-radius:var(--r-sm); }
  .mom .track i.up { left:50%; background:color-mix(in srgb,var(--t-high) 72%,transparent); }
  .mom .track i.down { right:50%; background:color-mix(in srgb,var(--ok) 66%,transparent); }
  .mom .val { text-align:right; font-variant-numeric:tabular-nums; font-size:var(--fs-sm); font-weight:600; }
  .mom .val.up { color:var(--t-high); } .mom .val.down { color:var(--ok); }

  /* coverage */
  .cov { display:flex; gap:var(--s2); align-items:center; padding:7px var(--s4); border-bottom:1px solid var(--border); }
  .cov:last-child { border-bottom:0; }
  .cov .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .cov .dot.ok { background:var(--ok); } .cov .dot.warn { background:var(--warn); } .cov .dot.gap { background:var(--t-crit); }
  .cov .ent { font-weight:600; min-width:180px; color:var(--ink); }

  /* provenance radar — stat tiles */
  .radarwrap { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:var(--s3); padding:var(--s4); }
  .radarwrap .rt { text-align:center; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s3); }
  .radarwrap .rt b { font-size:var(--fs-stat); font-weight:700; display:block; line-height:1; color:var(--ink); }
  .radarwrap .rt span { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }

  /* recommendations + capture */
  .horizons { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s4); }
  .hz h3 { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 var(--s2);
    padding-bottom:var(--s1); border-bottom:1px solid var(--border); }
  .rec { padding:var(--s3); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:var(--s2); }
  .rec .rec-t { font-weight:600; font-size:var(--fs-sm); color:var(--ink); line-height:1.35; }
  .rec .rec-a { font-size:var(--fs-micro); color:var(--muted); margin-top:var(--s1); font-family:var(--f-mono); }
  .rec .cap { margin-top:var(--s2); display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; }
  .rec .cap button { font:inherit; font-size:var(--fs-micro); font-weight:600; padding:4px var(--s3); border-radius:var(--r-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .rec .cap button:hover { border-color:var(--border-2); color:var(--ink); }
  .rec .cap button[data-v="aprovado"]:hover { border-color:var(--ok); color:var(--ok); }
  .rec .cap button[data-v="rejeitado"]:hover { border-color:var(--t-high); color:var(--t-high); }
  .rec .cap button:disabled { opacity:.45; cursor:default; }
  .rec .cap .done { font-size:var(--fs-micro); color:var(--ok); font-weight:600; }
  .rec .cap .ocsel { font:inherit; font-size:var(--fs-micro); background:var(--surface); color:var(--ink);
    border:1px solid var(--border); border-radius:var(--r-sm); padding:3px var(--s2); }
  .hz-empty { color:var(--muted); font-size:var(--fs-micro); padding:var(--s2) 0; }

  /* Executive Flow — incident → decision trajectory cards */
  .trajs { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:var(--s3); padding:var(--s3); }
  .traj { background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--border-2);
    border-radius:var(--r-md); padding:var(--s3); }
  .traj[data-sev="crit"] { border-left-color:var(--t-crit); }
  .traj[data-sev="high"] { border-left-color:var(--t-high); }
  .traj[data-sev="med"]  { border-left-color:var(--warn); }
  .traj-hd { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); }
  .traj-t { font-weight:600; font-size:var(--fs-sm); color:var(--ink); flex:1; line-height:1.3; }
  .traj-b { font-size:var(--fs-meta); color:var(--ink-2); line-height:1.45; }
  .traj-f { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3); font-size:var(--fs-micro); flex-wrap:wrap; }
  .traj-f button { font:inherit; font-size:var(--fs-micro); font-weight:600; padding:3px var(--s2); border-radius:var(--r-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .traj-f button[data-tv="aprovado"]:hover { border-color:var(--ok); color:var(--ok); }
  .traj-f button[data-tv="rejeitado"]:hover { border-color:var(--t-high); color:var(--t-high); }
  .traj-f button:disabled { opacity:.45; cursor:default; }
  .traj-f .done { color:var(--ok); font-weight:600; }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="mark">ON<b>Ç</b>A</span><span class="ctx">Executivo</span></div>
  <nav class="ctxnav officer-tabs" id="officerTabs" aria-label="Oficiais"></nav>
  <span class="spacer"></span>
  <span class="selwrap"><label for="sectorSel" class="hd-note">Setor</label>
    <select id="sectorSel"><option value="__all__">Todos os setores</option></select></span>
  <span class="sub" id="asof">—</span>
  <button class="icnbtn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
</header>

<main class="wrap">
  <div class="pagehead"><h1 id="pgTitle">Sala executiva</h1><p class="lede" id="pgLede"></p></div>
  <div id="board"></div>
  <section class="band">
    <div class="band-hd"><span class="overline">Ações recomendadas</span><span class="rule"></span>
      <span class="badge badge--ghost">captura ativa · decisões → OncaDecisionLog</span></div>
    <div class="panel"><div class="panel__bd" id="recs"></div></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drTitle">
  <div class="drawer__hd"><h3 id="drTitle">Inspeção</h3>
    <button class="drawer__close" id="drClose" aria-label="Fechar">×</button></div>
  <div class="drawer__bd" id="drBody"></div>
</aside>

<script src="/v2/app.js"></script>
<script>
const U = window.OncaUI;
let DATA = {}, EX = {}, OFFICER = "cso", SECTOR = "__all__", BYID = {};

const OFFICERS = {
  cso: { label:"CSO · Estratégia", title:"Estrategista-chefe (CSO)",
    lede:"Clima competitivo, riscos e oportunidades, momentum dos concorrentes e ações por horizonte." },
  cro: { label:"CRO · Regulatório", title:"Oficial regulatório (CRO)",
    lede:"O eixo regulatório: linha do tempo consulta→norma→fiscalização, impacto/blast-radius, mudanças e prazos." },
  cco: { label:"CCO · Compliance", title:"Oficial de compliance (CCO)",
    lede:"Integridade, registro de risco (distress/reputação/achados) e triagem de watchlist." },
  cpo: { label:"CPO · Produto", title:"Oficial de produto (CPO)",
    lede:"Cobertura por setor, pontos cegos, propostas de descoberta e a força de proveniência da base." },
};

U.initTheme();
document.getElementById("themeBtn").addEventListener("click", () => { U.toggleTheme(); render(); });
document.getElementById("drClose").addEventListener("click", closeDrawer);
document.getElementById("scrim").addEventListener("click", closeDrawer);
document.getElementById("sectorSel").addEventListener("change", (e) => { SECTOR = e.target.value; render(); });

document.getElementById("officerTabs").innerHTML = Object.entries(OFFICERS)
  .map(([k, o]) => `<a href="#${k}" data-officer="${k}">${o.label}</a>`).join("");
document.querySelectorAll("#officerTabs a").forEach(a => a.addEventListener("click", (e) => {
  e.preventDefault(); OFFICER = a.getAttribute("data-officer"); render();
}));

fetch("/feed.json").then(r => r.json()).then(d => { DATA = d; boot(); })
  .catch(e => { document.getElementById("board").innerHTML =
    U.empty("Feed indisponível", "Não foi possível carregar feed.json.", "!"); console.error(e); });

function boot() {
  EX = DATA.executive || {};
  BYID = {}; (DATA.feed || []).forEach(c => { BYID[c.id] = c; });
  document.getElementById("asof").textContent = DATA.as_of ? `dados de ${U.fmtDate(DATA.as_of)}` : "";
  const sel = document.getElementById("sectorSel");
  (EX.sectors || []).forEach(s => { const o = document.createElement("option"); o.value = s.slug; o.textContent = s.label; sel.appendChild(o); });
  if (!EX.officers || !EX.officers.length) {
    document.getElementById("board").innerHTML =
      U.empty("Bloco executivo ausente", "feed.executive ainda não foi publicado.", "○"); return;
  }
  render();
}

// --- filter + layout helpers -----------------------------------------------
function inSector(item) {
  if (SECTOR === "__all__") return true;
  const inds = item.industries || item.affected_industries || [];
  return inds.length === 0 || inds.indexOf(SECTOR) !== -1;
}
function block() { return EX[OFFICER] || {}; }
function agg() { const bi = block().by_industry || {}; return bi[SECTOR] || bi.__all__ || {}; }

function panel(title, count, note, body) {
  const c = count == null ? "" : `<span class="count${count === 0 ? " count--zero" : ""}">${count}</span>`;
  return `<div class="panel"><div class="panel__hd"><h2>${U.esc(title)}</h2>${c}` +
    `<span class="spacer"></span>${note ? `<span class="hd-note">${U.esc(note)}</span>` : ""}</div>` +
    `<div class="panel__bd panel__bd--flush panel__bd--scroll">${body}</div></div>`;
}
function tile(label, value, sub, cls) {
  return `<div class="tile${cls ? " is-" + cls : ""}"><div class="tile__n">${value == null ? "—" : value}</div>` +
    `<div class="tile__l">${U.esc(label)}${sub ? ` · ${U.esc(sub)}` : ""}</div></div>`;
}
function band(overline, badge, inner) {
  return `<section class="band"><div class="band-hd"><span class="overline">${U.esc(overline)}</span>` +
    `<span class="rule"></span>${badge ? `<span class="badge badge--infer">${U.esc(badge)}</span>` : ""}</div>${inner}</section>`;
}
function grid(cols, panels) { return `<div class="grid" style="grid-template-columns:${cols};gap:var(--s4)">${panels.join("")}</div>`; }

// hero readout: a big promoted metric (gauge for 0–100, plain for counts) + supporting tiles
function heroGauge(label, value, band, fillTok, pct) {
  return `<div class="hero"><div class="h-lbl">${U.esc(label)}</div>
    <div class="h-row"><span class="h-val">${value == null ? "—" : value}</span>${band}</div>
    <div class="gauge"><i style="width:${Math.max(0, Math.min(100, pct))}%;background:var(${fillTok})"></i></div></div>`;
}
function heroCount(label, value, band, sub) {
  return `<div class="hero"><div class="h-lbl">${U.esc(label)}</div>
    <div class="h-row"><span class="h-val">${value == null ? "—" : value}</span>${band}</div>
    <div class="h-sub">${U.esc(sub || "")}</div></div>`;
}
function bandBadge(cls, text) { return `<span class="badge badge--${cls}">${U.esc(text)}</span>`; }
function readout(hero, tiles) { return `<div class="readout">${hero}<div class="tiles">${tiles.join("")}</div></div>`; }

// higher-is-better band (climate, coverage) vs higher-is-worse (threat, risk)
function bandGood(v, hi, mid) { return v >= hi ? ["ok", "Saudável"] : v >= mid ? ["warn", "Atenção"] : ["crit", "Crítico"]; }
function bandThreat(v, hi, mid) { return v >= hi ? ["crit", "Elevada"] : v >= mid ? ["high", "Moderada"] : ["ok", "Baixa"]; }
const SEV = { high: "high", med: "med", low: "low", market: "crit", broad: "high", sector: "high",
  regional: "med", local: "low", medium: "med" };
function sevBadge(x) { return x ? `<span class="badge badge--${SEV[x] || "low"}">${U.esc(x)}</span>` : ""; }

// --- row renderers ---------------------------------------------------------
function rowsCard(list) {
  list = (list || []).filter(inSector);
  if (!list.length) return U.empty("Nada no escopo.", "", "○");
  return list.map(r => `<div class="exrow" data-id="${U.esc(r.id)}">
    <span class="dt">${r.date ? U.fmtDate(r.date) : ""}</span>
    <span class="ent">${U.esc(r.entity_label || r.label || "—")}</span>
    <span class="ttl">${U.esc(r.title || "")}</span>
    ${r.threat_score != null ? U.heat(r.threat_score) : ""}</div>`).join("");
}
function rowsReg(list) {
  list = (list || []).filter(inSector);
  if (!list.length) return U.empty("Sem itens regulatórios no escopo.", "", "○");
  return list.map(r => `<div class="exrow" data-id="${U.esc(r.id)}">
    <span class="ent" style="min-width:160px">${U.esc(r.domain || "Regulação")}</span>
    <span class="ttl">${U.esc(r.change || (r.affected_industries || []).join(", ") || "")}</span>
    ${r.blast_band ? sevBadge(r.blast_band) : `<span class="meta">${r.blast || 0} setor(es)</span>`}
    ${r.difficulty_band ? sevBadge(r.difficulty_band) : ""}
    ${r.days_to_deadline != null ? `<span class="dt">${r.days_to_deadline}d</span>` : ""}
    ${r.threat_score != null ? U.heat(r.threat_score) : ""}</div>`).join("");
}
function rowsMomentum(list) {
  list = (list || []).filter(inSector);
  if (!list.length) return U.empty("Sem momentum na janela.", "", "○");
  const max = Math.max(1, ...list.map(r => Math.abs(r.momentum)));
  return list.slice(0, 25).map(r => {
    const up = r.momentum >= 0, w = Math.round(Math.abs(r.momentum) / max * 48) + 1;
    return `<div class="mom"><span class="lbl">${U.esc(r.label)}</span>
      <span class="track"><i class="${up ? "up" : "down"}" style="width:${w}%"></i></span>
      <span class="val ${up ? "up" : "down"}">${r.momentum > 0 ? "+" : ""}${r.momentum}</span></div>`;
  }).join("");
}
function rowsRisk(list) {
  list = (list || []).filter(inSector);
  if (!list.length) return U.empty("Sem riscos no escopo.", "", "○");
  return list.map(r => `<div class="exrow">${sevBadge(r.severity)}
    <span class="ent" style="min-width:128px">${U.esc(r.label || "—")}</span>
    <span class="ttl">${U.esc(r.detail || "")}</span></div>`).join("");
}
function rowsIntegrity(list) {
  list = (list || []).filter(inSector);
  if (!list.length) return U.empty("Registro íntegro no escopo.", "", "○");
  return list.map(r => `<div class="exrow" ${r.card_id ? `data-id="${U.esc(r.card_id)}"` : ""}>${sevBadge(r.severity)}
    <span class="ent" style="min-width:148px">${U.esc(r.kind)}</span>
    <span class="ttl">${U.esc(r.summary || "")}</span></div>`).join("");
}
function rowsRep(list) {
  list = (list || []).filter(inSector);
  if (!list.length) return U.empty("Sem dados de reputação no escopo.", "", "○");
  return list.map(r => `<div class="exrow" ${r.url ? `data-url="${U.esc(r.url)}"` : ""}>
    <span class="ent" style="min-width:148px">${U.esc(r.label)}</span>
    <span class="ttl">${U.esc(r.category || "")} · ${U.esc(r.period || "")}</span>
    <span class="meta">#${r.rank != null ? r.rank : "—"} · índice ${r.index != null ? r.index : "—"}</span></div>`).join("");
}
function rowsGap(list) {
  if (!(list || []).length) return U.empty("Sem pontos cegos.", "", "○");
  return list.map(r => `<div class="exrow" ${r.issue_url ? `data-href="${U.esc(r.issue_url)}"` : ""}>
    <span class="badge badge--${r.status === "open" ? "high" : "low"}">${U.esc(r.status)}</span>
    <span class="ttl">${U.esc(r.question || "")}</span>
    <span class="meta">${r.count || 0}× · ${U.esc(r.triage || "")}</span></div>`).join("");
}
function rowsDiscovery(list) {
  if (!(list || []).length) return U.empty("Sem propostas de descoberta.", "", "○");
  return list.map(r => `<div class="exrow">
    <span class="ent" style="min-width:148px">${U.esc(r.proposed || "—")}</span>
    <span class="ttl">${U.esc(r.reason || "")} · ${U.esc(r.hint || "")}</span>
    <span class="badge badge--low">${U.esc(r.confidence || "")}</span></div>`).join("");
}
function rowsCoverage(list) {
  list = (list || []).filter(i => SECTOR === "__all__" || i.slug === SECTOR);
  if (!list.length) return U.empty("Sem setores no escopo.", "", "○");
  return list.map(i => { const cls = i.coverage_gap ? "gap" : (i.low_volume ? "warn" : "ok");
    const badge = i.coverage_gap ? bandBadge("high", "lacuna") : (i.low_volume ? bandBadge("warn", "baixo volume") : bandBadge("ok", "ok"));
    return `<div class="cov"><span class="dot ${cls}"></span>
      <span class="ent">${U.esc(i.label)}</span>
      <span class="meta">${i.active_entities || 0} entidades · ${i.narratives || 0} narrativas</span>
      <span class="spacer" style="flex:1"></span>${badge}</div>`; }).join("");
}
function radarBlock(obj) {
  const ent = Object.entries(obj || {});
  if (!ent.length) return U.empty("Sem radar de proveniência.", "", "○");
  const order = { official: 0, structured: 1, registry: 2, identified: 3 };
  ent.sort((a, b) => (order[a[0]] ?? 9) - (order[b[0]] ?? 9));
  return `<div class="radarwrap">` + ent.map(([t, n]) => `<div class="rt"><b>${n}</b><span>${U.esc(t)}</span></div>`).join("") + `</div>`;
}

// --- Executive Flow band (§D) — incident → decision, capture built in --------
let FLOW = [];
function officerShort(k) { return (OFFICERS[k] ? OFFICERS[k].label.split(" ")[0] : (k || "").toUpperCase()); }
function flowBand() {
  // CSO (chief-of-staff) sees every trajectory; each officer sees the ones routed to it or handed to it.
  FLOW = (EX.flow || []).filter(t => (OFFICER === "cso" || t.officer === OFFICER || t.handoff === OFFICER) && inSector(t));
  if (!FLOW.length) return "";
  const cards = FLOW.map((t, i) => `<div class="traj" data-sev="${U.esc(t.severity)}" data-i="${i}">
    <div class="traj-hd"><span class="traj-t">${U.esc(t.title)}</span>
      <span class="badge badge--ghost">${U.esc(officerShort(t.officer))}${t.handoff ? " → " + officerShort(t.handoff) : ""}</span></div>
    <div class="traj-b">${U.esc(t.briefing)}</div>
    <div class="traj-f">${t.evidence_ids && t.evidence_ids.length ? `<a href="#" data-ev="${U.esc(t.evidence_ids[0])}">evidência</a> · ` : ""}
      <span class="hd-note">${U.esc(t.action || "")}</span><span class="spacer" style="flex:1"></span>
      <button data-tv="aprovado" data-i="${i}">Aprovar</button><button data-tv="rejeitado" data-i="${i}">Rejeitar</button></div></div>`).join("");
  return band("Fluxo executivo", "incidente → decisão", `<div class="trajs">${cards}</div>`);
}
async function captureTraj(btn) {
  const t = FLOW[Number(btn.getAttribute("data-i"))]; if (!t) return;
  const verdict = btn.getAttribute("data-tv"), f = btn.closest(".traj-f");
  f.querySelectorAll("button").forEach(x => { x.disabled = true; });
  const industry = SECTOR !== "__all__" ? SECTOR : (t.industries && t.industries[0]) || null;
  const res = await postAct({ intent: "record_decision", officer: t.officer,
    args: { officer: t.officer, recommendation: t.title, verdict, industry, action_ref: t.action_ref,
            evidence_id: (t.evidence_ids || [])[0], context_id: t.id } });
  if (!res || !res.decision_id) { f.insertAdjacentHTML("beforeend", `<span class="done" style="color:var(--t-high)">falha</span>`); return; }
  f.insertAdjacentHTML("beforeend", `<span class="done">✓ ${verdict}</span>
    <select data-did="${res.decision_id}" class="ocsel"><option value="pendente">pendente</option>
      <option value="favoravel">favorável</option><option value="desfavoravel">desfavorável</option><option value="neutro">neutro</option></select>`);
  f.querySelector(".ocsel").addEventListener("change", (e) => setOutcome(res.decision_id, e.target.value, e.target));
}

// --- Decision-Trust metrics band (§E) — honest, only what the log holds ------
function pct(x) { return x == null ? "—" : Math.round(x * 100) + "%"; }
function metricsBand() {
  const m = EX.metrics || {};
  if (m.n_decisions == null) return "";
  const mm = (m.by_officer && m.by_officer[OFFICER]) ? m.by_officer[OFFICER] : m;
  const ets = mm.ets_feedback;
  const [bc, bl] = ets == null ? ["low", "sem dados"] : ets >= 7.6 ? ["ok", "Confiável"] : ets >= 6.1 ? ["warn", "Útil"] : ["high", "Baixa confiança"];
  const hero = heroGauge("ETS · componente Feedback", ets == null ? "—" : ets, bandBadge(bc, bl),
    "--" + (bc === "ok" ? "ok" : bc === "warn" ? "warn" : "t-high"), (ets || 0) * 10);
  const tilesArr = [tile("Decisões", mm.n_decisions, "capturadas"),
    tile("Aprovação", pct(mm.approval_rate), "das decisões"),
    tile("Influência", pct(mm.influence_rate), "com resultado"),
    tile("Favorável", pct(mm.favorable_rate), "dos resolvidos")];
  const note = `<p class="hd-note" style="padding:2px var(--s2) 0;line-height:1.4">ETS composto e TDR: `
    + `${U.esc(m.ets_note || "")} ${U.esc(m.tdr_note || "")}</p>`;
  return band("Confiança & decisão", "ETS parcial · TDR requer baseline", readout(hero, tilesArr) + note);
}

// --- board (per officer) ---------------------------------------------------
function render() {
  document.querySelectorAll("#officerTabs a").forEach(a =>
    a.setAttribute("aria-current", a.getAttribute("data-officer") === OFFICER ? "page" : "false"));
  const meta = OFFICERS[OFFICER];
  document.getElementById("pgTitle").textContent = "Sala executiva — " + meta.title;
  document.getElementById("pgLede").textContent = meta.lede;
  const p = block().panels || {}, a = agg();
  const el = document.getElementById("board");
  let board = "";

  if (OFFICER === "cso") {
    const [bc, bl] = bandGood(a.climate || 0, 70, 45);
    board =
      readout(heroGauge("Clima estratégico", a.climate, bandBadge(bc, bl), "--" + (bc === "crit" ? "t-crit" : bc === "warn" ? "warn" : "ok"), a.climate),
        [tile("Alertas", a.n_alerts, "em aberto", a.n_alerts > 0 ? "high" : "ok"),
         tile("Ameaça média", a.avg_threat, "0–100"),
         tile("Ameaça regulatória", a.reg_threat, "0–100"),
         tile("Movimentos", a.n_moves, "entrada·oferta·M&A")]) +
      band("Situação", "índice de clima · inferência",
        grid("1.4fr .9fr", [panel("Manchetes executivas", null, "maior ameaça · recente", rowsCard(p.headlines)),
                            panel("Sinais emergentes", null, "janela recente", rowsCard(p.emerging))])) +
      band("Riscos & Oportunidades", "", grid("1fr 1fr", [panel("Radar de risco", null, "alertas", rowsCard(p.risks)),
                            panel("Radar de oportunidade", null, "fraqueza do concorrente", rowsCard(p.opportunities))])) +
      band("Inteligência competitiva", "momentum na janela · inferência",
        grid("1fr 1fr", [panel("Momentum do concorrente", null, "↑ ganha · ↓ recua", rowsMomentum(p.momentum)),
                        panel("Movimentos estratégicos", null, "entrada·oferta·M&A", rowsCard(p.moves))])) +
      band("Inteligência regulatória (resumo)", "", panel("Mudanças por alcance", null, "domínio·setores·prazo", rowsReg(p.regulatory)));
  } else if (OFFICER === "cro") {
    const [bc, bl] = bandThreat(a.reg_threat || 0, 65, 40);
    board =
      readout(heroGauge("Ameaça regulatória", a.reg_threat, bandBadge(bc, bl), "--" + (bc === "crit" ? "t-crit" : bc === "high" ? "t-high" : "ok"), a.reg_threat),
        [tile("Cartões regulatórios", a.n_reg, "no escopo"),
         tile("Atos alterados", a.n_changes, "com mudança enumerada"),
         tile("Maior alcance", a.max_blast, "setores", a.max_blast >= 3 ? "high" : null)]) +
      band("Impacto & alcance", "blast-radius · ADR-009", panel("Mudanças por impacto", null, "banda de alcance · dificuldade", rowsReg(p.impact))) +
      band("Linha do tempo regulatória", "", grid("1fr 1fr", [panel("Consulta → norma → fiscalização", null, "recente", rowsReg(p.timeline)),
                            panel("Atos com mudanças enumeradas", null, "amending acts", rowsReg(p.changes))])) +
      band("Calendário de conformidade", "", panel("Prazos", null, "dias até o prazo", rowsReg(p.deadlines)));
  } else if (OFFICER === "cco") {
    const risk = (a.n_high || 0), rc = risk > 3 ? ["crit", "Crítico"] : risk > 0 ? ["high", "Atenção"] : ["ok", "Controlado"];
    board =
      readout(heroCount("Achados graves", a.n_high, bandBadge(rc[0], rc[1]), "severidade alta na auditoria"),
        [tile("Achados de integridade", a.n_integrity, "registro", a.n_integrity > 0 ? "warn" : "ok"),
         tile("Distress (confirmado)", a.n_distress, "insolvência", a.n_distress > 0 ? "crit" : "ok"),
         tile("Reputação", a.n_rep, "rankings BCB")]) +
      band("Registro de risco", "", panel("Distress · reputação · integridade", null, "prioridade", rowsRisk(p.risk_register))) +
      band("Integridade & reputação", "",
        grid("1fr 1fr", [panel("Auditoria de integridade", null, "achados do registro", rowsIntegrity(p.integrity)),
                        panel("Reputação (reclamações)", null, "pior ranking primeiro", rowsRep(p.reputation))]));
  } else if (OFFICER === "cpo") {
    const total = (block().panels.coverage_map || []).length || 1, covered = a.n_covered || 0;
    const covPct = Math.round(covered / total * 100), [bc, bl] = bandGood(covPct, 70, 40);
    board =
      readout(heroGauge("Cobertura de setores", `${covPct}%`, bandBadge(bc, bl), "--" + (bc === "crit" ? "t-crit" : bc === "warn" ? "warn" : "ok"), covPct),
        [tile("Setores cobertos", `${covered}/${total}`, "roster sincronizado"),
         tile("Pontos cegos", a.n_gaps, "perguntas sem resposta", a.n_gaps > 0 ? "high" : "ok"),
         tile("Propostas", a.n_reviews, "descoberta"),
         tile("Lacunas", a.n_coverage_gap, "setores", a.n_coverage_gap > 0 ? "warn" : "ok")]) +
      band("Cobertura por setor", "", panel("Mapa de cobertura", null, "ok · baixo volume · lacuna", rowsCoverage(p.coverage_map))) +
      band("Pontos cegos & descoberta", "",
        grid("1fr 1fr", [panel("Pontos cegos", null, "perguntas sem resposta", rowsGap(p.blind_spots)),
                        panel("Propostas de descoberta", null, "revisão pendente", rowsDiscovery(p.discovery))])) +
      band("Força da base", "", panel("Radar de proveniência", null, "por tier", radarBlock(p.radar)));
  }
  el.innerHTML = flowBand() + board + metricsBand();
  el.querySelectorAll(".exrow[data-id]").forEach(row => row.addEventListener("click", () => inspect(row.getAttribute("data-id"))));
  el.querySelectorAll(".exrow[data-url],.exrow[data-href]").forEach(row => row.addEventListener("click", () => {
    const u = row.getAttribute("data-url") || row.getAttribute("data-href"); if (u) window.open(u, "_blank", "noopener"); }));
  el.querySelectorAll(".traj-f button[data-tv]").forEach(b => b.addEventListener("click", () => captureTraj(b)));
  el.querySelectorAll(".traj-f a[data-ev]").forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); inspect(a.getAttribute("data-ev")); }));
  renderRecs((p.recommendations || []).filter(inSector));
}

// --- recommendations + capture (ADR-021 Step 1) ----------------------------
const HZ = [["imediato", "Imediato"], ["30d", "30 dias"], ["90d", "90 dias"], ["estrategico", "Estratégico"]];
let RECS = [];
function renderRecs(recs) {
  RECS = recs; const el = document.getElementById("recs");
  if (!recs.length) { el.innerHTML = U.empty("Sem ações recomendadas no escopo.", "", "○"); return; }
  el.innerHTML = `<div class="horizons">` + HZ.map(([key, label]) => {
    const items = recs.map((r, i) => [r, i]).filter(([r]) => r.horizon === key);
    return `<div class="hz"><h3>${label}</h3>` + (items.length ? items.map(([r, i]) =>
      `<div class="rec" data-i="${i}"><div class="rec-t">${U.esc(r.text)}</div>
        <div class="rec-a">→ ${U.esc(r.action)}${r.evidence_id ? ` · <a href="#" data-ev="${U.esc(r.evidence_id)}">evidência</a>` : ""}</div>
        <div class="cap"><button data-v="aprovado" data-i="${i}">Aprovar</button><button data-v="rejeitado" data-i="${i}">Rejeitar</button></div></div>`).join("")
      : `<div class="hz-empty">—</div>`) + `</div>`;
  }).join("") + `</div>`;
  el.querySelectorAll("a[data-ev]").forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); inspect(a.getAttribute("data-ev")); }));
  el.querySelectorAll(".cap button[data-v]").forEach(b => b.addEventListener("click", () => capture(b)));
}
async function capture(btn) {
  const r = RECS[Number(btn.getAttribute("data-i"))]; if (!r) return;
  const verdict = btn.getAttribute("data-v"), cap = btn.closest(".cap");
  cap.querySelectorAll("button").forEach(x => { x.disabled = true; });
  const industry = SECTOR !== "__all__" ? SECTOR : (r.industries && r.industries[0]) || null;
  const res = await postAct({ intent: "record_decision", officer: OFFICER,
    args: { officer: OFFICER, recommendation: r.text, verdict, industry, action_ref: r.action, evidence_id: r.evidence_id, context_id: r.horizon } });
  if (!res || !res.decision_id) { cap.innerHTML = `<span class="done" style="color:var(--t-high)">falha ao registrar</span>`; return; }
  cap.innerHTML = `<span class="done">✓ ${verdict}</span><span class="hd-note">resultado:</span>
    <select data-did="${res.decision_id}" class="ocsel"><option value="pendente">pendente</option>
      <option value="favoravel">favorável</option><option value="desfavoravel">desfavorável</option><option value="neutro">neutro</option></select>`;
  cap.querySelector(".ocsel").addEventListener("change", (e) => setOutcome(res.decision_id, e.target.value, e.target));
}
async function setOutcome(did, outcome, sel) {
  sel.disabled = true; const res = await postAct({ intent: "set_outcome", officer: OFFICER, args: { decision_id: did, outcome } });
  sel.disabled = false; if (res && res.decision_outcome) sel.title = "resultado registrado";
}
async function postAct(body) {
  try { const r = await fetch("/api/act", { method: "POST", credentials: "include",
    headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); return await r.json(); }
  catch (e) { console.error("act failed", e); return null; }
}

// --- drill-down ------------------------------------------------------------
function inspect(id) {
  const c = BYID[id];
  document.getElementById("drTitle").textContent = (c && (c.entity_label || c.subject_label || c.entity)) || "Detalhe";
  document.getElementById("drBody").innerHTML = c
    ? `<div class="callout">${U.linkifyNarrative(c.narrative || "", U.citationModel(c))}${U.citationFooter(U.citationModel(c))}</div>`
    : U.empty("Sem cartão citável", `id: ${id || "—"}`, "○");
  openDrawer();
}
function openDrawer() { document.getElementById("drawer").setAttribute("aria-hidden", "false");
  document.getElementById("scrim").classList.add("on"); document.getElementById("drawer").classList.add("on"); }
function closeDrawer() { document.getElementById("drawer").setAttribute("aria-hidden", "true");
  document.getElementById("scrim").classList.remove("on"); document.getElementById("drawer").classList.remove("on"); }
</script>
</body>
