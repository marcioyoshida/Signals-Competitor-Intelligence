<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Onça · Sala Executiva</title>
<!-- #162 installable PWA -->
<link rel="manifest" href="/v3/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/v3/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/v3/icons/icon-192.png" />
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1214" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Onça" />
<!-- #170 link previews are GENERIC by design: a shared card link never previews its finding -->
<meta property="og:title" content="Onça — painel executivo" />
<meta property="og:description" content="Conteúdo disponível apenas para usuários autorizados." />
<meta property="og:image" content="https://onssa.org/v3/og.png" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="/v2/app.css" />
<style>
  /* v3 executive — built on the shared design tokens (dual-theme, no hardcoded hex) */
  .officer-tabs { display:flex; gap:2px; }
  .officer-tabs a { border-bottom:2px solid transparent; border-radius:0; padding:var(--s2) var(--s3); }
  .officer-tabs a[aria-current="page"] { color:var(--ink); background:transparent; border-bottom-color:var(--primary); }
  .selwrap { display:flex; align-items:center; gap:var(--s2); }
  .selwrap select { background:var(--surface-2); color:var(--ink); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:5px var(--s2); font:inherit; font-size:var(--fs-meta); }

  /* Hero readout — the promoted metric that leads every board */
  .readout { display:grid; grid-template-columns:minmax(230px,.85fr) 2fr; gap:var(--s4); margin-bottom:var(--s4); }
  .hero { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:var(--s4) var(--s5); box-shadow:var(--shadow-1); display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .hero .h-lbl { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.9px; color:var(--muted); }
  .hero .h-row { display:flex; align-items:baseline; gap:var(--s3); }
  .hero .h-val { font-size:var(--fs-hero); font-weight:800; line-height:1; letter-spacing:.3px; color:var(--ink); }
  .hero .h-sub { font-size:var(--fs-meta); color:var(--muted); margin-top:2px; }
  .gauge { height:8px; border-radius:var(--r-pill); background:var(--surface-3); overflow:hidden; margin-top:var(--s2); }
  .gauge > i { display:block; height:100%; border-radius:var(--r-pill); }
  .readout .tiles { align-content:center; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
  .tile { position:relative; }
  .tile.is-crit { border-left:3px solid var(--t-crit); } .tile.is-high { border-left:3px solid var(--t-high); }
  .tile.is-warn { border-left:3px solid var(--warn); } .tile.is-ok { border-left:3px solid var(--ok); }

  /* rows */
  .exrow { display:flex; gap:var(--s3); align-items:flex-start; padding:var(--s2) var(--s4);
    border-bottom:1px solid var(--border); cursor:pointer; }
  .exrow:last-child { border-bottom:0; }
  .exrow:hover { background:var(--surface-2); }
  .exrow .ent { font-weight:600; min-width:118px; max-width:36%; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* headline: clamps to 3 lines; CLICK the headline to expand/collapse it inline */
  .exrow .ttl { flex:1; min-width:0; color:var(--ink-2); font-size:var(--fs-sm); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
  .exrow .ttl:hover { color:var(--ink); }
  .exrow .ttl.is-expanded { -webkit-line-clamp:unset; display:block; overflow:visible;
    background:var(--surface-2); border-radius:var(--r-sm); padding:2px 6px; margin:-2px -6px; }
  .exrow .dt, .exrow .meta, .exrow .heat, .exrow .badge { margin-top:1px; }
  .exrow .dt { color:var(--muted); font-size:var(--fs-micro); min-width:64px; font-variant-numeric:tabular-nums; }
  .exrow .meta { color:var(--muted); font-size:var(--fs-micro); font-variant-numeric:tabular-nums; }
  .exrow .badge.enf-src { white-space:normal; overflow-wrap:anywhere; max-width:100%; }

  /* momentum — diverging bar anchored to a center baseline (rising vs receding) */
  .mom { display:grid; grid-template-columns:140px 1fr 66px; align-items:center; gap:var(--s3);
    padding:6px var(--s4); border-bottom:1px solid var(--border); }
  .mom:last-child { border-bottom:0; }
  .mom .lbl { font-weight:600; color:var(--ink); font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mom .track { position:relative; height:12px; }
  .mom .track::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--border-2); }
  .mom .track i { position:absolute; top:1px; bottom:1px; border-radius:var(--r-sm); }
  .mom .track i.up { left:50%; background:color-mix(in srgb,var(--t-high) 72%,transparent); }
  .mom .track i.down { right:50%; background:color-mix(in srgb,var(--ok) 66%,transparent); }
  .mom .val { text-align:right; font-variant-numeric:tabular-nums; font-size:var(--fs-sm); font-weight:600; }
  .mom .val.up { color:var(--t-high); } .mom .val.down { color:var(--ok); }

  /* Mapa Competitivo — ameaça × momentum scatter (v1 flagship → CSO) */
  .scatter { padding:var(--s4); }
  .scatter svg { width:100%; height:auto; display:block; }
  .sc-frame { fill:none; stroke:var(--border); }
  .sc-grid { stroke:var(--border-2); stroke-dasharray:3 3; }
  .sc-danger { fill:color-mix(in srgb,var(--t-crit) 8%,transparent); }
  .sc-dot { stroke:var(--surface); stroke-width:1.2; }
  .sc-dot:hover { stroke:var(--ink); stroke-width:1.6; }
  .sc-dot--nd { stroke:var(--muted); stroke-width:1; stroke-dasharray:2 1.5; }
  .sc-lbl { fill:var(--ink-2); font-size:11px; font-variant-numeric:tabular-nums;
    paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; }
  .sc-lbl-lead { stroke:var(--border-2); stroke-width:1; }
  .sc-whisker { stroke-width:1.75; stroke-linecap:round; }
  .sc-ax  { fill:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .sc-quad { fill:var(--muted); font-size:10px; letter-spacing:.4px; opacity:.7; }
  .sc-legend { margin-top:var(--s2); display:flex; flex-wrap:wrap; align-items:center;
    justify-content:flex-end; gap:var(--s3); font-size:var(--fs-micro); color:var(--muted); }

  /* Macro strip — Copom & Focus, shared across all officers */
  .macro-strip { margin:0 0 var(--s4); }
  .macro-inner { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:var(--s2) var(--s4); box-shadow:var(--shadow-1); }
  .macro-lbl { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.9px; color:var(--muted); margin-right:var(--s2); }
  .mchip { display:inline-flex; align-items:baseline; gap:6px; }
  .mchip + .mchip { border-left:1px solid var(--border); padding-left:var(--s3); }
  .mchip .mk { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .mchip .mv { font-size:var(--fs-sm); font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .mchip .md { font-size:var(--fs-micro); font-variant-numeric:tabular-nums; }
  .md--up { color:var(--t-high); } .md--down { color:var(--ok); } .md--flat { color:var(--muted); }
  .macro-headline { font-size:var(--fs-sm); color:var(--muted); border-left:1px solid var(--border);
    padding-left:var(--s3); text-decoration:none; max-width:420px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .macro-headline:hover { color:var(--ink); text-decoration:underline; }
  .macro-note-dot { color:var(--muted); font-size:var(--fs-sm); cursor:help; opacity:.7; }
  .macro-note-dot:hover { opacity:1; color:var(--ink); }

  /* B3 quotes — market pulse aside the CSO board (v1 #43 → CSO) */
  .b3wrap { padding:var(--s3) var(--s4); display:flex; flex-wrap:wrap; gap:var(--s2) var(--s5); }
  .b3q { display:inline-flex; align-items:baseline; gap:6px; min-width:148px; }
  .b3q .sym { font-weight:600; color:var(--ink); font-size:var(--fs-sm); }
  .b3q .px { font-variant-numeric:tabular-nums; color:var(--ink-2); font-size:var(--fs-sm); }
  .b3q .ch { font-variant-numeric:tabular-nums; font-size:var(--fs-micro); min-width:52px; }
  .b3q .ch.up { color:var(--ok); } .b3q .ch.down { color:var(--t-crit); }

  /* Threat timeline — per-competitor ameaça trajectory (v1 → CSO) */
  .tl { padding:2px 0; }
  .tlrow { display:grid; grid-template-columns:150px 1fr 54px; align-items:center; gap:var(--s3);
    padding:5px var(--s4); border-bottom:1px solid var(--border); }
  .tlrow:last-child { border-bottom:0; }
  .tlent { font-weight:600; color:var(--ink); font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spark { width:100%; height:28px; display:block; }
  .spark--empty { color:var(--muted); font-size:var(--fs-micro); padding-left:var(--s2); }
  .spark-macro { stroke:var(--muted); stroke-width:1; stroke-dasharray:2,2; opacity:.55; }
  .tlnow { text-align:right; }

  /* Control network — commonly-controlled competitor clusters (v1 grafo → CSO) */
  .cnet { padding:2px 0; }
  .cnrow { padding:var(--s3) var(--s4); border-bottom:1px solid var(--border); }
  .cnrow:last-child { border-bottom:0; }
  .cnhd { display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; }
  .cnhub { font-weight:700; color:var(--ink); font-size:var(--fs-sm); }
  .cnmeta { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .cnmem { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .cnchip { font-size:var(--fs-micro); color:var(--ink-2); background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--r-pill); padding:2px 8px; }

  /* Perguntar à Onça — officer-scoped RAG (v1 → /exec, global) + auth */
  .authbox { display:flex; align-items:center; gap:var(--s2); }
  .authuser { font-size:var(--fs-micro); color:var(--muted); max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .authbtn { background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-radius:var(--r-sm);
    padding:4px var(--s3); font:inherit; font-size:var(--fs-micro); cursor:pointer; }
  .authbtn:hover { border-color:var(--primary); }
  .ask-band { margin:0 0 var(--s4); }
  .askwrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-1); padding:var(--s4); }
  .askhd { display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s3); }
  .askhd h2 { font-size:1rem; margin:0; color:var(--ink); }
  .askhd .sub { font-size:var(--fs-micro); color:var(--muted); }
  .askrow { display:flex; gap:var(--s2); }
  .askrow input { flex:1; background:var(--surface-2); color:var(--ink); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:8px var(--s3); font:inherit; font-size:var(--fs-sm); }
  .askrow input:disabled { opacity:.55; }
  .askbtn { background:var(--primary); color:#fff; border:0; border-radius:var(--r-sm); padding:8px var(--s4);
    font:inherit; font-weight:600; font-size:var(--fs-sm); cursor:pointer; white-space:nowrap; }
  .askbtn:disabled { opacity:.5; cursor:default; }
  .askex { display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--s2); }
  .askex .chip { font-size:var(--fs-micro); color:var(--ink-2); background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--r-pill); padding:2px 8px; cursor:pointer; }
  .askex .chip:hover { border-color:var(--primary); color:var(--ink); }
  .askhint { font-size:var(--fs-micro); color:var(--muted); margin-top:var(--s2); }
  .askans { margin-top:var(--s3); font-size:var(--fs-sm); color:var(--ink); line-height:1.55; white-space:pre-wrap; }
  .askans.refused { color:var(--muted); }
  .askans .cites { margin-top:var(--s3); display:flex; flex-wrap:wrap; gap:6px; white-space:normal; }
  .askans .cite { font-size:var(--fs-micro); color:var(--ink-2); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-pill); padding:2px 8px; }
  .askans .cref { color:var(--primary); font-weight:600; }
  .thinking { color:var(--muted); }

  /* coverage */
  .cov { display:flex; gap:var(--s2); align-items:center; padding:7px var(--s4); border-bottom:1px solid var(--border); }
  .cov:last-child { border-bottom:0; }
  .cov .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .cov .dot.ok { background:var(--ok); } .cov .dot.warn { background:var(--warn); } .cov .dot.gap { background:var(--t-crit); }
  .cov .ent { font-weight:600; min-width:150px; max-width:46%; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* provenance radar — stat tiles */
  .radarwrap { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:var(--s3); padding:var(--s4); }
  .radarwrap .rt { text-align:center; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s3); }
  .radarwrap .rt b { font-size:var(--fs-stat); font-weight:700; display:block; line-height:1; color:var(--ink); }
  .radarwrap .rt span { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }

  /* recommendations + capture */
  .horizons { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s4); }
  .hz h3 { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 var(--s2);
    padding-bottom:var(--s1); border-bottom:1px solid var(--border); }
  .rec { padding:var(--s3); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:var(--s2); }
  .rec .rec-t { font-weight:600; font-size:var(--fs-sm); color:var(--ink); line-height:1.35; }
  .rec .rec-a { font-size:var(--fs-micro); color:var(--muted); margin-top:var(--s1); font-family:var(--f-mono); }
  .rec .cap { margin-top:var(--s2); display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; }
  .weekly-headline { font-size:var(--fs-md); font-weight:600; color:var(--ink); line-height:1.4; }
  .weekly-chips { margin-top:var(--s3); display:flex; flex-wrap:wrap; gap:0; }
  .rec .cap button { font:inherit; font-size:var(--fs-micro); font-weight:600; padding:4px var(--s3); border-radius:var(--r-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .rec .cap button:hover { border-color:var(--border-2); color:var(--ink); }
  .rec .cap button[data-v="aprovado"]:hover { border-color:var(--ok); color:var(--ok); }
  .rec .cap button[data-v="rejeitado"]:hover { border-color:var(--t-high); color:var(--t-high); }
  .rec .cap button:disabled { opacity:.45; cursor:default; }
  .rec .cap .done { font-size:var(--fs-micro); color:var(--ok); font-weight:600; }
  .rec .cap .ocsel { font:inherit; font-size:var(--fs-micro); background:var(--surface); color:var(--ink);
    border:1px solid var(--border); border-radius:var(--r-sm); padding:3px var(--s2); }
  .sl-warn { color:var(--t-high); font-weight:600; font-variant-numeric:tabular-nums; }
  .sl-ok { color:var(--muted); font-variant-numeric:tabular-nums; }
  .tone-src { font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .brd { font-size:var(--fs-micro); color:var(--muted); display:inline-flex; align-items:center; gap:3px; cursor:pointer; }
  .brd.on { color:var(--primary); font-weight:600; }
  .hz-empty { color:var(--muted); font-size:var(--fs-micro); padding:var(--s2) 0; }

  /* Executive Flow — incident → decision trajectory cards */
  .trajs { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr)); gap:var(--s3); padding:var(--s3); }
  .traj { background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--border-2);
    border-radius:var(--r-md); padding:var(--s3); }
  .traj[data-sev="crit"] { border-left-color:var(--t-crit); }
  .traj[data-sev="high"] { border-left-color:var(--t-high); }
  .traj[data-sev="med"]  { border-left-color:var(--warn); }
  .traj-hd { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); }
  .traj-t { font-weight:600; font-size:var(--fs-sm); color:var(--ink); flex:1; line-height:1.3; }
  .traj-b { font-size:var(--fs-meta); color:var(--ink-2); line-height:1.45; }
  .traj-f { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3); font-size:var(--fs-micro); flex-wrap:wrap; }
  .traj-f button { font:inherit; font-size:var(--fs-micro); font-weight:600; padding:3px var(--s2); border-radius:var(--r-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .traj-f button[data-tv="aprovado"]:hover { border-color:var(--ok); color:var(--ok); }
  .traj-f button[data-tv="rejeitado"]:hover { border-color:var(--t-high); color:var(--t-high); }
  .traj-f button:disabled { opacity:.45; cursor:default; }
  .traj-f .done { color:var(--ok); font-weight:600; }

  /* CPO charts (inline, token-based, dual-theme) */
  .chart { padding:var(--s3) var(--s4); }
  .crow { display:grid; grid-template-columns:150px 1fr 92px; align-items:center; gap:var(--s3); padding:5px 0; }
  .crow .cl { font-size:var(--fs-sm); color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .cv { text-align:right; font-variant-numeric:tabular-nums; font-size:var(--fs-meta); color:var(--ink-2); display:flex; gap:var(--s2); justify-content:flex-end; align-items:center; }
  .bar { height:14px; border-radius:var(--r-sm); background:var(--surface-3); overflow:hidden; }
  .bar > i { height:100%; display:block; border-radius:var(--r-sm); }
  .stack { height:14px; border-radius:var(--r-sm); overflow:hidden; display:flex; background:var(--surface-3); }
  .stack > i { height:100%; }
  .legend { display:flex; gap:var(--s4); flex-wrap:wrap; padding:0 var(--s4) var(--s3); font-size:var(--fs-micro); color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* Reference / playbook */
  .refwrap { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:var(--s4); }
  .ref-col h4 { font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin:0 0 var(--s2); padding-bottom:var(--s1); border-bottom:1px solid var(--border); }
  .ref-col ul { margin:0; padding-left:var(--s4); }
  .ref-col li { font-size:var(--fs-meta); color:var(--ink-2); line-height:1.6; }

  /* ============================ responsive (#125) ========================
     /exec's every panel band is a hardcoded multi-column CSS grid (the grid()
     helper below emits an inline grid-template-columns, so overriding it needs
     !important) plus several fixed-px label columns (.mom/.tlrow/.crow) that
     don't fit a phone. Two tiers: tablet collapses side-by-side panels to one
     column; phone additionally stacks each row's label above its value. */
  @media (max-width: 860px) {
    .wrap .grid { grid-template-columns: 1fr !important; }
    .readout { grid-template-columns: 1fr; }
    .horizons { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .horizons { grid-template-columns: 1fr; }
    /* .mom/.tlrow/.crow are all "label | middle | value" 3-column grids — put
       the label (always the first child) on its own full-width row, then let
       the middle content and value share a second, narrower-value row. */
    .mom, .tlrow, .crow { grid-template-columns: 1fr 56px; row-gap: 4px; }
    .mom > :first-child, .tlrow > :first-child, .crow > :first-child {
      grid-column: 1 / -1; white-space: normal; }
    .exrow .ent { min-width: 76px; }
    /* #159 radar rows carry a source badge + links: wrap so the reason and the
       sources each get a full-width line instead of pushing past the viewport. */
    /* band headers carry a long provenance badge (and the silence rows a long briefing):
       wrap them instead of pushing the page wider than the phone (#177 check, 390px). */
    .band > .band-hd { flex-wrap: wrap; row-gap: 4px; }
    /* overflow-wrap: the CCO PESTLE badge is words joined by middots with no spaces
       ("político·econômico·social·…"), one unbreakable run that made the page 459px wide. */
    .band > .band-hd .badge { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
    .silrow { flex-wrap: wrap; }
    /* "Sinais prospectivos": the hub meta ("hub BTG PACTUAL SERVIÇOS FINANCEIROS S/A DTVM ·
       12 expostos") is inline nowrap, so it scrolled its panel sideways at 390px. */
    .exrow--axis { flex-wrap: wrap; row-gap: 2px; }
    .exrow--axis .axis-meta { flex-basis: 100%; white-space: normal !important; overflow-wrap: anywhere; }
    .exrow--axis > span, .exrow--axis > b { overflow-wrap: anywhere; }
    .exrow--radar, .exrow--sector { flex-wrap: wrap; row-gap: 4px; }
    .exrow--radar .ttl, .exrow--radar .meta,
    .exrow--sector .ttl, .exrow--sector .meta { flex-basis: 100%; }
    .exrow--sector .ent { flex: 1; max-width: none; white-space: normal; }
    /* #193 enforcement rows: the institution name ("Trustee Distribuidora de Títulos e Valores
       Mobiliários Ltda.") and the authority·confidence badge are long — wrap, never overflow. */
    .exrow--enf { flex-wrap: wrap; row-gap: 4px; }
    .exrow--enf .ttl, .exrow--enf .meta { flex-basis: 100%; }
    .exrow--enf .ent { flex: 1; max-width: none; white-space: normal; overflow-wrap: anywhere; }
    .officer-tabs a { padding: 10px var(--s3); }
    .selwrap select, .authbtn { padding: 9px var(--s2); min-height: 40px; }
    /* #163 hard gate: primary actions are at least 44×44 CSS px on a phone */
    .officer-tabs a { min-height: 44px; display: inline-flex; align-items: center; }
    .askbtn, .askrow input { min-height: 44px; }
    /* #166: a compact phone header — brand + Hoje/Painel, then ONE scrolling row of officer
       tabs, then sector/account/theme; the long e-mail and the "Setor" label drop */
    .appbar { row-gap: var(--s1); }
    .officer-tabs { order: 5; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch; }
    .officer-tabs::-webkit-scrollbar { display: none; }
    .officer-tabs a { flex: 0 0 auto; white-space: nowrap; }
    .appbar > .spacer { display: none; }
    .selwrap { order: 6; flex: 1 1 auto; }
    .selwrap .hd-note { display: none; }
    .selwrap select { width: 100%; }
    #asof { display: none; }                 /* Hoje shows its own "desde" date */
    .authbox { order: 8; }
    .authbox .sub { display: none; }
    #themeBtn { order: 9; }
    .selwrap { min-width: 0; }
    /* Hoje on a phone: no page title/lede, rows stack (title gets the full width) */
    body.view-hoje .pagehead { display: none; }
    .hoje .exrow { flex-wrap: wrap; row-gap: 2px; }
    .hoje .exrow .ttl { flex: 1 1 100%; order: 5; }
    .hoje .exrow .ent { flex: 1; max-width: none; }
    .hoje-hd { flex-wrap: wrap; }
    /* #169: iOS zooms any input under 16px; chips scroll sideways; answer readable unzoomed */
    .askrow input { font-size: 16px; }
    .askex { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: var(--s2); padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .askex .chip { flex: 0 0 auto; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; }
    .askans { font-size: 16px; line-height: 1.55; }
    .cites .cite { display: inline-flex; min-height: 36px; align-items: center; }
    .rec .cap button, .traj-f button { min-height: 44px; min-width: 88px; padding: 0 var(--s4); }
  }
  /* #166 "Hoje" — the phone-first morning brief */
  /* the Hoje/Painel switch widened the header past 860px (#128 tablet shard: 877/902px) — let
     /exec's app bar wrap below 1180px instead of the shared 780px breakpoint */
  @media (max-width: 1180px) { .appbar { flex-wrap: wrap; row-gap: var(--s1); } }
  .view-tabs a { border-bottom:2px solid transparent; border-radius:0; padding:var(--s2) var(--s3); font-weight:700; }
  .view-tabs a[aria-current="page"] { border-bottom-color:var(--primary); color:var(--ink); }
  body.view-hoje #macroStrip, body.view-hoje #askPanel, body.view-hoje #recsBand { display:none; }
  .hoje { display:flex; flex-direction:column; gap:var(--s3); }
  .hoje-sec { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md, 10px); overflow:hidden; }
  .hoje-hd { display:flex; align-items:baseline; gap:var(--s2); padding:var(--s3) var(--s3) var(--s2); }
  .hoje-hd h2 { font-size:var(--fs-md); margin:0; }
  .hoje-hd .n { font-weight:800; color:var(--primary); }
  .hoje-hd .sub { margin-left:auto; }
  .hoje-rec { display:block; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--border);
    padding:var(--s3); color:var(--ink); font:inherit; cursor:pointer; min-height:44px; }
  .hoje-act { display:inline-flex; align-items:center; gap:var(--s1); min-height:44px; padding:0 var(--s3); }
  /* #168 decision confirm step (second tap) — online only */
  .dconf { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); width:100%; margin-top:var(--s2); }
  .dconf .dnote { flex:1 1 180px; min-height:44px; padding:0 var(--s2); border:1px solid var(--border-2); border-radius:var(--r-sm);
    background:var(--surface); color:var(--ink); font:inherit; }
  .dconf button { min-height:44px; min-width:88px; font:inherit; font-weight:700; border-radius:var(--r-sm); border:1px solid var(--border-2);
    background:var(--surface-2); color:var(--ink); cursor:pointer; }
  .dconf .dok { background:var(--primary); border-color:var(--primary); color:var(--on-primary, #fff); }
  body.is-offline .cap button, body.is-offline .traj-f button, body.is-offline .dconf .dok { pointer-events:none; opacity:.45; }
  .nonet { display:none; color:var(--warn); font-size:var(--fs-micro); font-weight:600; }
  body.is-offline .nonet { display:inline; }
  .trialbar { display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center; justify-content:space-between;
    padding:var(--s2) var(--s4); background:var(--info-fill); border-bottom:1px solid var(--border); font-size:13px; }
  .offline-bar { background: var(--warn-fill); color: var(--warn); border-bottom: 1px solid var(--warn);
    padding: var(--s2) var(--s4); font-size: 13px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="mark">ON<b>Ç</b>A</span><span class="ctx">Executivo</span></div>
  <nav class="ctxnav view-tabs" id="viewTabs" aria-label="Visão">
    <a href="#hoje" data-view="hoje">Hoje</a><a href="#painel" data-view="painel">Painel</a></nav>
  <nav class="ctxnav officer-tabs" id="officerTabs" aria-label="Oficiais"></nav>
  <span class="spacer"></span>
  <span class="selwrap"><label for="sectorSel" class="hd-note">Setor</label>
    <select id="sectorSel"><option value="__all__">Todos os setores</option></select></span>
  <span class="sub" id="asof">—</span>
  <span class="authbox" id="authBox"></span>
  <button class="icnbtn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
</header>

<div class="offline-bar" id="offlineBar" role="status" hidden></div>
<div id="trialBar" hidden></div>
<main class="wrap">
  <div class="pagehead"><h1 id="pgTitle">Sala executiva</h1><p class="lede" id="pgLede"></p></div>
  <div id="macroStrip" class="macro-strip"></div>
  <section id="askPanel" class="ask-band"></section>
  <div id="board"></div>
  <section class="band" id="recsBand">
    <div class="band-hd"><span class="overline">Ações recomendadas</span><span class="rule"></span>
      <span class="badge badge--ghost">captura ativa · decisões → OncaDecisionLog</span></div>
    <div class="panel"><div class="panel__bd" id="recs"></div></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drTitle">
  <div class="drawer__hd"><h3 id="drTitle">Inspeção</h3>
    <button class="btn btn--sm drshare" id="drShare" type="button" hidden>Compartilhar</button>
    <button class="drawer__close" id="drClose" aria-label="Fechar">×</button></div>
  <div class="drawer__bd" id="drBody"></div>
</aside>

<script src="/v2/app.js"></script>
<script src="/v2/context.js"></script>
<script>
const U = window.OncaUI;
let DATA = {}, EX = {}, OFFICER = "cso", SECTOR = "__all__", BYID = {};
// Operator view (?admin=1&opkey=…, #122) — gates the raw per-source ingestion band (#139):
// clients get the coverage-confidence TILE only, never per-source names/errors.
let ADMIN = false;
// §E TDR: first-surfaced timestamp per item — the "start" of the executive's deliberation
// (first render → decision = the real time-to-decide, measured client-side).
const SEEN = {};
function markSeen(k) { if (k && !SEEN[k]) SEEN[k] = new Date().toISOString(); }

const OFFICERS = {
  cso: { label:"CSO · Estratégia", title:"Estrategista-chefe (CSO)",
    lede:"Clima competitivo, riscos e oportunidades, momentum dos concorrentes e ações por horizonte." },
  cro: { label:"CRO · Regulatório", title:"Oficial regulatório (CRO)",
    lede:"O eixo regulatório: linha do tempo consulta→norma→fiscalização, impacto/blast-radius, mudanças e prazos." },
  cco: { label:"CCO · Compliance", title:"Oficial de compliance (CCO)",
    lede:"Integridade, registro de risco (distress/reputação/achados) e triagem de watchlist." },
  cpo: { label:"CPO · Produto", title:"Oficial de produto (CPO)",
    lede:"Cobertura por setor, pontos cegos, propostas de descoberta e a força de proveniência da base." },
};

U.initTheme();
document.getElementById("themeBtn").addEventListener("click", () => { U.toggleTheme(); render(); });
document.getElementById("drClose").addEventListener("click", closeDrawer);
document.getElementById("scrim").addEventListener("click", closeDrawer);
// Sector choice persists in location.hash (same pattern as /app's activeSlug) so a
// reload — or a bookmarked/shared link — lands back on the same sector instead of
// resetting to "todos". hashchange (not just the <select> handler) covers back/forward.
function activeSector() {
  const h = (location.hash || "").replace(/^#/, "").toLowerCase();
  if (h === "__all__" || (h && LICENSED.indexOf(h) !== -1)) return h;
  // #166: #hoje[-section] / #painel pick the VIEW and keep the current sector
  if (/^(hoje|painel)/.test(h)) return SECTOR || "__all__";
  return "__all__";
}
// #166 view: "hoje" (phone-first brief) | "painel" (the full board). Phones default to Hoje;
// a #hoje-<section> deep link (digest e-mails, push taps) always opens it.
let VIEW = null;
function initialView() {
  const h = (location.hash || "").toLowerCase();
  if (h.indexOf("#hoje") === 0) return "hoje";
  if (h === "#painel") return "painel";
  return deviceClass() === "phone" ? "hoje" : "painel";
}
function setView(v) {
  VIEW = v;
  document.body.classList.toggle("view-hoje", v === "hoje");
  document.querySelectorAll("#viewTabs a").forEach(a =>
    a.setAttribute("aria-current", a.getAttribute("data-view") === v ? "page" : "false"));
}
document.querySelectorAll("#viewTabs a").forEach(a => a.addEventListener("click", (e) => {
  e.preventDefault(); setView(a.getAttribute("data-view")); render(); window.scrollTo(0, 0);
}));
function syncOnline() { document.body.classList.toggle("is-offline", !navigator.onLine || OFFLINE); }
window.addEventListener("online", syncOnline); window.addEventListener("offline", syncOnline);
document.getElementById("sectorSel").addEventListener("change", (e) => { location.hash = e.target.value; });
window.addEventListener("hashchange", () => {
  if ((location.hash || "").toLowerCase().indexOf("#hoje") === 0 && VIEW !== "hoje") setView("hoje");
  SECTOR = activeSector();
  const sel = document.getElementById("sectorSel");
  if (sel.value !== SECTOR) sel.value = SECTOR;
  render();
});

document.getElementById("officerTabs").innerHTML = Object.entries(OFFICERS)
  .map(([k, o]) => `<a href="#${k}" data-officer="${k}">${o.label}</a>`).join("");
document.querySelectorAll("#officerTabs a").forEach(a => a.addEventListener("click", (e) => {
  e.preventDefault(); OFFICER = a.getAttribute("data-officer"); render();
}));

// --- Perguntar à Onça: officer-scoped grounded Q&A (v1 → /exec) ---------------
// Same PKCE Hosted-UI flow + same-origin /api/ask (Cognito-JWT HTTP API) as v1; the
// only /exec-specific bit is passing `officer: OFFICER` so the agent scopes grounding +
// its own-decision KB precedents to the active officer (agent_ask already supports this).
// Auth + scoped-feed loading is /v2/context.js's OncaCtx (Ctx) — the SAME implementation
// `/app` and the SaaS context screens use, not a second parallel one (issue: /exec used to
// duplicate this and fetch the raw unscoped /feed.json regardless of login — see the
// 2026-09-12 sector-scoped-sessions plan).
const Ctx = window.OncaCtx;
// #165: a device CLASS only (viewport width + pointer), never a user-agent string.
function deviceClass() {
  const w = Math.min(window.innerWidth || 0, (screen && screen.width) || 99999);
  const coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
  return w < 600 && coarse ? "phone" : (w < 1024 && coarse ? "tablet" : "desktop");
}
function isStandalone() {
  return !!((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone);
}
// #161: writes go to /api/me/act with the officer's own Cognito token (no shared basic
// auth on the phone). The operator preview (?admin=1&opkey=) keeps the origin-secret path.
function actFetch(body, extra) {
  if (ADMIN) {
    return U.oacFetch("/api/act", Object.assign({ method: "POST", credentials: "include",
      headers: { "content-type": "application/json" }, body }, extra || {}));
  }
  const tok = Ctx.getIdToken();
  if (!tok) return Promise.reject(new Error("sem sessão"));
  return fetch("/api/me/act", Object.assign({ method: "POST",
    headers: { "content-type": "application/json", authorization: `Bearer ${tok}` }, body }, extra || {}));
}
function renderAuthUI() {
  Ctx.renderAuthBox("authBox", () => renderAskLoginState());
}
const ASK_EXAMPLES = ["O que mudou esta semana no meu escopo?", "Quem está em alerta agora?",
  "Qual mudança regulatória tem maior alcance?", "Onde há maior risco prudencial?"];
function renderAskPanel() {
  const el = document.getElementById("askPanel");
  if (!el) return;
  el.innerHTML = `<div class="askwrap">
    <div class="askhd"><h2>Perguntar à Onça</h2>
      <span class="sub">resposta fundamentada só nos dados · escopo: <b id="askScope">—</b></span></div>
    <div class="askrow"><input id="askInput" type="text" placeholder="Entre para perguntar à Onça" disabled
      enterkeyhint="send" autocapitalize="sentences" autocomplete="off">
      <button class="askbtn" id="askBtn" disabled>Perguntar</button></div>
    <div class="askex" id="askEx"></div>
    <div class="askhint" id="askAuthHint" style="display:none">Entre com sua conta para perguntar à Onça.</div>
    <div class="askans" id="askAns" style="display:none"></div></div>`;
  document.getElementById("askEx").innerHTML = ASK_EXAMPLES.map(q => `<span class="chip">${U.esc(q)}</span>`).join("");
  document.querySelectorAll("#askEx .chip").forEach(c => c.onclick = () => { document.getElementById("askInput").value = c.textContent; askOnca(); });
  document.getElementById("askBtn").onclick = askOnca;
  const inp = document.getElementById("askInput");
  inp.addEventListener("keydown", e => { if (e.key === "Enter") askOnca(); });
  // #169: on a phone the on-screen keyboard covers the lower half — keep the input in view
  inp.addEventListener("focus", () => { if (deviceClass() !== "desktop") setTimeout(() => inp.scrollIntoView({ block: "center" }), 250); });
}
function renderAskLoginState() {
  const hint = document.getElementById("askAuthHint"), input = document.getElementById("askInput"), btn = document.getElementById("askBtn");
  if (!hint || !input || !btn) return;
  const logged = Ctx.isLoggedIn();
  hint.style.display = logged ? "none" : "";
  input.disabled = !logged; btn.disabled = !logged;
  input.placeholder = logged ? "Ex.: o que mudou no meu setor esta semana?" : "Entre para perguntar à Onça";
}
function updateAskScope() { const s = document.getElementById("askScope"); if (s) s.textContent = (OFFICERS[OFFICER] || {}).label || OFFICER; }
function renderAnswer(res) {
  const box = document.getElementById("askAns"); if (!box) return;
  box.style.display = "block";
  if (res.refused || !res.answer) { box.className = "askans refused"; box.textContent = res.answer || "Não consegui responder."; return; }
  box.className = "askans";
  const cites = res.citations || [], byId = {}; cites.forEach((c, i) => byId[c.id] = i + 1);
  const citeUrl = (c) => { const s0 = (c.sources || [])[0]; return c.url || (s0 && (s0.url || (typeof s0 === "string" ? s0 : ""))) || ""; };
  const body = (txt) => U.esc(txt).replace(/\[([A-Za-z0-9:_\-]+)\]/g, (m, id) => byId[id] ? `<sup class="cref" title="${U.esc(id)}">[${byId[id]}]</sup>` : "");
  // #169: a long answer leads with a short summary; the full text is one tap away
  const full = String(res.answer), LIM = 420;
  let html;
  if (full.length > LIM + 120) {
    const cut = full.lastIndexOf(". ", LIM) > 200 ? full.lastIndexOf(". ", LIM) + 1 : LIM;
    html = `<div class="ans-sum">${body(full.slice(0, cut))}…</div><div class="ans-full" hidden>${body(full)}</div>` +
      `<button class="btn btn--sm ans-more" type="button">ver resposta completa</button>`;
  } else {
    html = body(full);
  }
  // citations are LINKS to their first-party source (new tab — the answer stays put)
  html += cites.length
    ? `<div class="cites">` + cites.map((c, i) => {
        const u = citeUrl(c), label = U.esc(c.entity_label || c.entity || (c.kb ? "base de conhecimento" : c.id));
        return u ? `<a class="cite" href="${U.esc(u)}" target="_blank" rel="noopener">[${i + 1}] ${label} ↗</a>`
                 : `<span class="cite">[${i + 1}] ${label}</span>`;
      }).join("") + `</div>`
    : `<div class="cites"><span style="color:var(--muted)">Sem fontes citadas — trate com cautela.</span></div>`;
  box.innerHTML = html;
  const more = box.querySelector(".ans-more");
  if (more) more.onclick = () => { box.querySelector(".ans-sum").hidden = true; box.querySelector(".ans-full").hidden = false; more.remove(); };
}
let askBusy = false;
async function askOnca() {
  if (askBusy) return;
  if (!Ctx.isLoggedIn()) { renderAskLoginState(); return; }
  const input = document.getElementById("askInput"), q = (input.value || "").trim();
  if (!q) return;
  askBusy = true;
  engage("ask", "open", null);   // #165 (the question text is never sent with it)
  const btn = document.getElementById("askBtn"), prev = btn.textContent; btn.disabled = true; btn.textContent = "Pensando…";
  const box = document.getElementById("askAns"); box.style.display = "block"; box.className = "askans";
  // #169: visible progress, and a timeout that keeps the question for a one-tap retry
  const t0 = Date.now();
  box.innerHTML = `<span class="thinking">Consultando a base da Onça… <span id="askSecs">0s</span></span>`;
  const tick = setInterval(() => { const e = document.getElementById("askSecs"); if (e) e.textContent = Math.round((Date.now() - t0) / 1000) + "s"; }, 1000);
  const ctl = ("AbortController" in window) ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), ASK_TIMEOUT_MS);
  const scope = {}; if (SECTOR && SECTOR !== "__all__") scope.industry = SECTOR;
  try {
    const call = () => fetch("/api/ask", { method: "POST", signal: ctl ? ctl.signal : undefined,
      headers: { "content-type": "application/json", "authorization": `Bearer ${Ctx.getIdToken()}` },
      body: JSON.stringify({ q, scope, officer: OFFICER }) });
    await Ctx.ensureSession();
    let r = await call();
    if (r.status === 401) {
      try { sessionStorage.removeItem("onca_id_token"); } catch (e) {}
      if (await Ctx.ensureSession() === "ok") r = await call();
    }
    if (r.status === 401) {
      try { sessionStorage.removeItem("onca_id_token"); } catch (e) {}
      renderAuthUI(); renderAnswer({ refused: true, answer: "Sessão expirada. Entre novamente para perguntar." }); return;
    }
    const j = await r.json();
    renderAnswer(r.ok ? j : { refused: true, answer: "Falha ao consultar. Tente novamente." });
  } catch (e) {
    const timedOut = e && e.name === "AbortError";
    box.className = "askans refused";
    box.innerHTML = `${timedOut ? "A resposta demorou demais." : "Falha de rede ao consultar."} ` +
      `<button class="btn btn--sm" id="askRetry" type="button">Tentar de novo</button>`;
    document.getElementById("askRetry").onclick = () => askOnca();   // the input still holds the question
  }
  finally { clearInterval(tick); clearTimeout(timer); btn.disabled = false; btn.textContent = prev; askBusy = false; }
}
const ASK_TIMEOUT_MS = 60000;
renderAskPanel();
Ctx.handleAuthCallback().then(() => Ctx.ensureSession()).then(renderAuthUI).then(loadFeed);
window.addEventListener("appinstalled", () => { if (!ADMIN) engage("install", "open", null); });  // #165
// #162: the /exec service worker (shell cache + content-free push). Never on the operator
// preview — an ?opkey page must not leave anything behind on the device.
if ("serviceWorker" in navigator && !new URLSearchParams(location.search).get("opkey")) {
  navigator.serviceWorker.register("/exec-sw.js", { scope: "/exec" }).catch((e) => console.warn("sw", e));
}

// The tenant's licensed industry slugs, from the SERVER-SCOPED feed's `scoped_modules`
// (never derived from a superset) — same rule as /v2/industries.js `licensedIndustries`,
// duplicated here (not imported) because industries.js's renderDashboard/PANEL machinery
// is v2's own renderer and would collide with /exec's own board renderer.
let LICENSED = [];
function licensedIndustries(D) {
  const mods = (D && D.scoped_modules) || [];
  if (mods.length) return mods.map(m => String(m).toLowerCase());
  return ((D && D.industries) || []).map(i => String(i.slug || i).toLowerCase());
}

async function loadFeed() {
  const admin = new URLSearchParams(location.search).get("admin") === "1";
  ADMIN = admin;
  if (admin) {
    // Operator/curator preview (SAME bypass convention as /app?admin=1): every industry,
    // from the full feed. #122: the shared basic-auth password is NOT an operator
    // credential (every tenant has it too) — a second secret is required (?opkey=).
    const opkey = new URLSearchParams(location.search).get("opkey") || "";
    try {
      DATA = await fetch(`/feed.json?opkey=${encodeURIComponent(opkey)}`, { cache: "no-store" }).then(r => r.json());
      LICENSED = (DATA.industries || []).map(i => String(i.slug || i).toLowerCase());
      boot();
    } catch (e) {
      document.getElementById("board").innerHTML = U.empty("Feed indisponível", "Não foi possível carregar feed.json (verifique ?opkey=).", "!");
      console.error(e);
    }
    return;
  }
  // #166 warm launch: paint THIS user's last feed at once (same per-user cache as the offline
  // copy — only while their session is valid), then refresh from /api/feed and re-render. The

    // #187: no entitlement (e.g. a trial that ended) is a paywall, not a half-live page. Hide the

// Mapa Competitivo (v1 flagship → CSO): each tracked competitor placed by current threat
// (ameaça, y) × window acceleration (momentum, x). Top-right = high + accelerating (danger).
// Bubble SIZE = market size (feed.entities[].fundamentals.ativo_bi, IF.data/CVM total assets,
// R$ bi) — area-proportional (sqrt scale, not linear radius) per dataviz convention, so a bank
// with 4x the assets doesn't look 4x the AREA of a 16x-bigger circle. Only ~30% of tracked
// entities carry this (listed/IF.data-covered institutions); an entity with no reported
// fundamentals gets a distinct SMALLER, dashed-outline default dot — it is never drawn at a
// fabricated size, and its tooltip says so explicitly.
const SC_R_MIN = 5, SC_R_MAX = 24, SC_R_UNKNOWN = 4;
// Per-competitor identity fill (2026-09-16, replaces a severity-value fill after an explicit
// scope call: color now tells entities apart at a glance instead of encoding ameaça — the Y
// axis already carries that precisely, unchanged). A 12-hue OKLCH wheel (fixed L=0.60/C=0.15,
// hue-stepped 30° from a real red's OKLCH hue ~29°), validated with the dataviz skill's
// validator (`node scripts/validate_palette.js … --mode light|dark`) against BOTH surfaces at
// once (0.60 sits inside both the light 0.43–0.77 and dark 0.48–0.67 OKLCH lightness bands, so
// one hex list serves both themes) — chroma floor and contrast all pass. It does NOT clear the
// strict all-pairs CVD check a scatter/bubble chart calls for (one adjacent pair, the
// orange/amber #BF6500↔#A47900, sits at ΔE 0.3 protan/deutan and 6.6 normal-vision, both below
// the floor) — flagged rather than hidden: the skill's own validated 8-hue default can't pass
// all-pairs beyond 3 slots for this chart TYPE either (any two bubbles can sit side by side), so
// this is the realistic ceiling, not a shortcut. Labels/tooltips remain the authoritative
// identity channel; this fill is an at-a-glance aid on top of them, not a replacement for them.
const ENTITY_PALETTE = ["#CA5749", "#BF6500", "#A47900", "#778B00", "#2A984B", "#009C82",
  "#0096B0", "#0089CF", "#5C79D9", "#8D68CC", "#B05BAC", "#C4547E"];

// across reloads and as the roster changes week to week, which matters once color is identity.
function entityColor(id) {
  let h = 0;
  const s = String(id || "");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return ENTITY_PALETTE[h % ENTITY_PALETTE.length];
}
// Label declutter: greedy vertical stacking. A busy cluster (several competitors within a
// handful of ameaça/momentum points of each other — the exact live case that prompted this,
// 2026-09-15: five fintechs' labels overlapping into unreadable text soup) gets its labels
// pushed apart vertically in placement order (highest ameaça first, so the most important name
// keeps its natural position and lower-priority ones cede ground); anything nudged more than a
// couple px gets a thin leader stub back to its real anchor so the displacement stays legible
// rather than looking like a labeling error.
function declutterLabels(cands) {
  const GAP = 13, XR = 170;
  const placed = [];
  cands.forEach(c => {
    let y = c.y;
    let moved = true, guard = placed.length + 1;
    // EPS: after y = p.py + GAP, float rounding can leave |p.py - y| at 12.999… (< GAP) and loop forever (#206).
    while (moved && guard-- > 0) {
      moved = false;
      for (const p of placed) {
        if (Math.abs(p.x - c.x) < XR && Math.abs(p.py - y) < GAP - 1e-6) { y = p.py + GAP; moved = true; }

    }
    placed.push({ ...c, py: y });
  });

function scatterMap(list) {
  list = (list || []).filter(inSector).filter(d => d && d.entity);
  if (!list.length) return U.empty("Sem dados de posição na janela.", "", "○");
  const W = 720, H = 380, padL = 46, padR = 18, padT = 18, padB = 40;
  const iw = W - padL - padR, ih = H - padT - padB;
  const M = Math.max(5, Math.ceil(Math.max(...list.map(d => Math.abs(d.momentum || 0)))));
  const x = m => padL + ((m + M) / (2 * M)) * iw;
  const y = a => padT + (1 - Math.max(0, Math.min(100, a)) / 100) * ih;
  const x0 = x(0), y50 = y(50);
  const maxSize = Math.max(1, ...list.map(d => d.size_bi || 0));
  const rFor = d => d.size_bi == null ? SC_R_UNKNOWN
    : SC_R_MIN + Math.sqrt(d.size_bi / maxSize) * (SC_R_MAX - SC_R_MIN);
  // Delta whisker: a short stem + arrowhead attached to the OUTSIDE of each dot's own edge,
  // pointing toward last week's ameaça (`prior`, the same 7-day-prior window _momentum() already
  // computes server-side) vs this week's (`recent`) — the one-week "movement from last position"
  // ask, grounded only in fields the feed already carries. Anchored at the dot's edge (r + 2) and
  // scaled/capped by the size of the move, NOT drawn between the literal prior/recent pixel
  // positions — a bubble's own radius (4–24px here) would otherwise swallow a same-length stem
  // whole for anything but the smallest dots, hiding the arrowhead entirely.
  const whiskers = list.filter(d => d.prior != null && d.recent != null && Math.abs(d.recent - d.prior) >= 0.5)
    .map(d => {
      const cx = x(d.momentum || 0), cy = y(d.recent || 0), r = rFor(d);
      const worse = d.recent > d.prior;             // higher ameaça = worse
      const dir = worse ? -1 : 1;                    // worse -> up (smaller y); better -> down
      const col = worse ? "var(--t-crit)" : "var(--ok)";
      const mag = Math.min(22, 8 + Math.abs(d.recent - d.prior) * 0.9);
      const baseY = cy + dir * (r + 2), tipY = cy + dir * (r + 2 + mag);
      return `<line class="sc-whisker" x1="${cx.toFixed(1)}" y1="${baseY.toFixed(1)}" ` +
        `x2="${cx.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="${col}" stroke-opacity=".6"/>` +
        `<path d="M${(cx - 3.5).toFixed(1)} ${tipY.toFixed(1)} L${(cx + 3.5).toFixed(1)} ${tipY.toFixed(1)} ` +
        `L${cx.toFixed(1)} ${(tipY + dir * 6).toFixed(1)} Z" fill="${col}" fill-opacity=".8"/>`;
    }).join("");
  // Paint largest bubbles first (underneath) so small/unknown-size competitors on top stay visible.
  const painted = [...list].sort((a, b) => (b.size_bi || 0) - (a.size_bi || 0));
  const dots = painted.map(d => {
    const cx = x(d.momentum || 0), cy = y(d.recent || 0), r = rFor(d), known = d.size_bi != null;
    const sizeTxt = known ? `R$ ${d.size_bi.toLocaleString("pt-BR", { maximumFractionDigits: 0 })} bi em ativos`
      : "sem dado de ativos";
    const deltaTxt = d.prior != null ? ` · ${d.recent > d.prior ? "subiu" : d.recent < d.prior ? "caiu" : "estável"} vs semana anterior (${d.prior})` : "";

  const body = JSON.stringify({ intent: "append_reference", officer, args: { decision_id: did, url, officer } });
  // navigator.sendBeacon cannot set headers, so it cannot carry the SigV4 payload
  // hash the AWS_IAM function URL now requires (WAF Phase 0). fetch(keepalive) keeps
  // the survive-unload guarantee for a body this small and does allow headers.
  try {
    actFetch(body, { keepalive: true }).catch(() => {});
  } catch (e) { /* best-effort — never blocks navigation */ }
}
// §E engagement telemetry — an attention event (headline expand/open), tagged for intelligence.
function engage(kind, action, cardId) {

    industries: (c && c.industries) || [], topics: (c && c.topics) || [],
    device: deviceClass(), standalone: isStandalone() } });
  // See beacon() above: sendBeacon cannot sign, fetch(keepalive) can.
  try {
    actFetch(body, { keepalive: true }).catch(() => {});
  } catch (e) { /* best-effort */ }
}
function evUrl(evId) { const c = BYID[evId]; return (c && (c.citations || [])[0] && c.citations[0].url) || ("card:" + evId); }

// --- CPO charts (inline SVG-free bars; sequential provenance ramp on --info) -
const TIER_ORDER = ["official", "structured", "registry", "identified"];
const TIER_MIX = { official: 88, structured: 60, registry: 38, identified: 20 }; // % of --info
function tierColor(t) { return `color-mix(in srgb, var(--info) ${TIER_MIX[t] || 30}%, transparent)`; }
function matBand(v) { return v >= 70 ? "ok" : v >= 50 ? "warn" : "high"; }

function hbars(rows) { // rows: [{label, value, max, bar (0-100), badge, colorTok}]
  return `<div class="chart">` + rows.map(r => `<div class="crow">
    <span class="cl" title="${U.esc(r.label)}">${U.esc(r.label)}</span>
    <span class="bar"><i style="width:${Math.max(2, Math.min(100, r.bar))}%;background:${r.colorTok || "var(--primary)"}"></i></span>
    <span class="cv">${r.value}${r.badge ? " " + r.badge : ""}</span></div>`).join("") + `</div>`;
}
function maturityChart(port) {
  return hbars(port.map(p => ({ label: p.label, value: p.maturity, bar: p.maturity,
    colorTok: `var(--${matBand(p.maturity) === "ok" ? "ok" : matBand(p.maturity) === "warn" ? "warn" : "t-high"})`,
    badge: `<span class="badge badge--${p.tier === "premium" ? "info" : p.tier === "mid" ? "ghost" : "low"}">${U.esc(p.tier || "")}</span>` })));
}
function provenanceLegend() {
  return `<div class="legend">` + TIER_ORDER.map(t =>
    `<span><i style="background:${tierColor(t)}"></i>${t}</span>`).join("") + `</div>`;
}
function provStack(mix) {
  const total = TIER_ORDER.reduce((s, t) => s + (mix[t] || 0), 0) || 1;
  return `<span class="stack">` + TIER_ORDER.map(t => {
    const w = (mix[t] || 0) / total * 100;
    return w ? `<i title="${t}: ${mix[t]}" style="width:${w}%;background:${tierColor(t)}"></i>` : "";
  }).join("") + `</span>`;
}
function provenanceChart(port) {
  return provenanceLegend() + `<div class="chart">` + port.filter(p => Object.keys(p.provenance || {}).length)
    .map(p => `<div class="crow"><span class="cl" title="${U.esc(p.label)}">${U.esc(p.label)}</span>${provStack(p.provenance)}
      <span class="cv">${p.provenance_score}</span></div>`).join("") + `</div>`;
}
const FIELD_LABEL = { ownership: "Controle", ticker: "Ticker", parent: "Grupo/parent", esg: "ESG", certifications: "Certificações" };
function completenessChart(obj) {
  const rows = Object.entries(obj || {}).sort((a, b) => a[1] - b[1]);
  return hbars(rows.map(([f, v]) => ({ label: FIELD_LABEL[f] || f, value: v + "%", bar: v,
    colorTok: `var(--${v >= 60 ? "ok" : v >= 20 ? "warn" : "t-crit"})` })));
}
function discoveryChart(port) {
  const rows = port.filter(p => p.discovery > 0).sort((a, b) => b.discovery - a.discovery);
  if (!rows.length) return U.empty("Sem pipeline de descoberta.", "", "○");
  const max = Math.max(...rows.map(p => p.discovery));
  return hbars(rows.map(p => ({ label: p.label, value: p.discovery, bar: p.discovery / max * 100,
    colorTok: "var(--cat-teal)" })));
}
function rowsTopEntities(list) {
  if (!(list || []).length) return U.empty("Sem entidades rastreadas no setor.", "", "○");
  const max = Math.max(...list.map(e => e.cards));
  return list.map(e => `<div class="crow"><span class="cl" title="${U.esc(e.label)}">${U.esc(e.label)}</span>
    <span class="bar"><i style="width:${e.cards / max * 100}%;background:var(--cat-steel)"></i></span>
    <span class="cv">${e.cards}</span></div>`).join("");
}
const fmtBi = v => v == null ? "—" : "R$" + (v / 1e9).toFixed(v >= 1e10 ? 0 : 1) + "bi";
// R3 — per-sector market size (todos) bars
function marketSizeChart(ms, sectors) {
  const rows = Object.entries(ms || {}).map(([s, m]) => ({ slug: s, m })).filter(x => x.m.covered);
  if (!rows.length) return U.empty("Sem emissores listados (CVM) no escopo.", "", "○");
  const label = s => (sectors.find(x => x.slug === s) || {}).label || s;
  const max = Math.max(...rows.map(x => x.m.size_revenue));
  rows.sort((a, b) => b.m.size_revenue - a.m.size_revenue);
  return hbars(rows.map(x => ({ label: label(x.slug), value: fmtBi(x.m.size_revenue), bar: x.m.size_revenue / max * 100,
    colorTok: "var(--cat-gold)", badge: `<span class="badge badge--ghost">${x.m.issuers} emissor(es)</span>` })));
}
// #75 — IF.data system-wide asset base (SFN) + leaders; NOT per-sector (whole-system, honest)
function ifdataMarketBlock(m) {
  if (!m || m.size_value == null) return U.empty("Base IF.data ainda não populada.", "", "○");
  const top = m.top || [];
  const max = Math.max(1, ...top.map(t => t.share_pct || 0));
  return `<div class="chart"><div class="crow"><span class="cl" style="color:var(--muted)">${U.esc(m.metric || "Ativo Total")} · ${U.esc(m.scope || "sistema")}</span>
      <span class="cv">${fmtBi(m.size_value)}</span></div></div>` +
    hbars(top.map(t => ({ label: t.label || t.entity, value: (t.share_pct == null ? "—" : t.share_pct + "%"),
      bar: (t.share_pct || 0) / max * 100, colorTok: "var(--cat-teal)" })));
}
// R3 — a single sector's constituents by revenue share
function marketDetail(m) {
  if (!m || !m.covered) return U.empty("Sem emissores listados (CVM) neste setor.", "sem tamanho fabricado", "○");
  const max = Math.max(...m.constituents.map(c => c.revenue));
  return `<div class="chart"><div class="crow"><span class="cl" style="color:var(--muted)">Tamanho (receita)</span>
      <span class="cv">${fmtBi(m.size_revenue)}</span></div>
    <div class="crow"><span class="cl" style="color:var(--muted)">Concentração (HHI)</span>
      <span class="cv">${m.hhi}</span></div></div>` +
    hbars(m.constituents.map(c => ({ label: c.label, value: Math.round((c.rev_share || 0) * 100) + "%",
      bar: c.revenue / max * 100, colorTok: "var(--cat-gold)" })));
}
// R5 — source health rows
function sourceHealthChart(list) {
  if (!(list || []).length) return U.empty("Sem sinais de fontes.", "", "○");
  const bmap = { ok: "ok", warn: "warn", stale: "gap" };
  return `<div class="chart">` + list.slice(0, 14).map(s => `<div class="cov" style="padding:5px 0">
    <span class="dot ${bmap[s.band]}"></span><span class="cl" style="min-width:120px" title="${U.esc(s.lens)}">${U.esc(s.lens)}</span>
    <span class="meta" style="flex:1">${s.docs} docs</span>
    <span class="cv">${s.staleness_days == null ? "—" : s.staleness_days + "d"}</span></div>`).join("") + `</div>`;
}
function sourceRunsChart(list) {
  if (!(list || []).length) return U.empty("Sem telemetria de fontes ainda.", "", "○");
  const bmap = { ok: "ok", warn: "warn", stale: "warn", error: "gap", never_ok: "gap" };
  const blbl = { ok: "ok", warn: "atenção", stale: "defasada", error: "erro", never_ok: "sem sucesso" };
  return `<div class="chart">` + list.slice(0, 16).map(s => `<div class="cov" style="padding:5px 0">
    <span class="dot ${bmap[s.band] || "gap"}"></span><span class="cl" style="min-width:150px" title="${U.esc(s.source)}">${U.esc(s.source)}</span>
    <span class="meta" style="flex:1" title="${U.esc(s.last_error || s.last_warning || "")}">${(s.last_error || s.last_warning) ? U.esc(String(s.last_error || s.last_warning).slice(0, 40)) : (blbl[s.band] || s.band)}</span>
    <span class="cv">${s.staleness_days == null ? "—" : s.staleness_days + "d"}</span></div>`).join("") + `</div>`;
}
function pricingBadge(p) {
  if (!p) return "";
  const cls = p.pressure === "alta" ? "high" : p.pressure === "média" ? "warn" : "low";
  return `<span class="badge badge--${cls}">pressão ${U.esc(p.pressure)}</span> <span class="hd-note">${p.recent} sinais recentes · inferência</span>`;
}

// --- #167 content-free push: opt-in per device, per alert type ------------------------------
// The notification never carries a finding ("Novo alerta no seu painel Onça" + a count); the
// finding shows only after the app opens. iOS needs 16.4+ AND the app installed to the home screen.
const PUSH_TYPE_PT = { radar: "radar de produto (instabilidade/reclamações)", distress: "estresse financeiro / RJ",
                       regulatory: "mudança regulatória material" };
const PUSH_DEFAULT = { cso: ["radar", "distress", "regulatory"], cpo: ["radar"], cco: ["distress"], cro: ["regulatory"] };
function pushSupported() { return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function b64uBytes(s) {
  const b = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function pushSub() {
  const reg = await navigator.serviceWorker.getRegistration("/exec");
  return reg ? reg.pushManager.getSubscription() : null;
}
async function pushApi(path, body, method) {
  await Ctx.ensureSession();
  const r = await fetch(path, { method: method || "POST", cache: "no-store",
    headers: { "content-type": "application/json", authorization: `Bearer ${Ctx.getIdToken() || ""}` },
    body: body ? JSON.stringify(body) : undefined });
  return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status));
}
async function renderPushBox(note) {
  const box = document.getElementById("pushBox"); if (!box || ADMIN) { if (box) box.innerHTML = ""; return; }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (!pushSupported()) {
    box.innerHTML = `<p class="hd-note">${ios && !isStandalone() ? "No iPhone, instale o app (Compartilhar → Adicionar à Tela de Início) para receber alertas." : "Este navegador não suporta alertas."}</p>`;
    return;
  }
  const sub = await pushSub().catch(() => null);
  let state = null;
  if (sub) { try { state = await pushApi(`/api/me/push?endpoint=${encodeURIComponent(sub.endpoint)}`, null, "GET"); } catch (e) {} }
  const on = !!(sub && state && state.subscribed);
  const types = (on && state.prefs && state.prefs.types) || PUSH_DEFAULT[OFFICER] || PUSH_DEFAULT.cso;
  box.innerHTML = `<div style="padding:0 var(--s3) var(--s3)">
    ${Object.keys(PUSH_TYPE_PT).map(t => `<label class="cvsub" style="display:flex;gap:var(--s2);align-items:center;min-height:44px">
      <input type="checkbox" class="ptype" value="${t}" ${types.indexOf(t) !== -1 ? "checked" : ""}> ${U.esc(PUSH_TYPE_PT[t])}</label>`).join("")}
    <p class="hd-note">Silêncio 21h–7h · no máximo 3 por dia (o excedente vira um só aviso).</p>
    <button class="btn ${on ? "" : "btn--primary"} hoje-act" id="pushToggle" type="button">${on ? "Desativar alertas neste aparelho" : "Ativar alertas neste aparelho"}</button>
    ${on ? `<button class="btn hoje-act" id="pushSave" type="button">Salvar tipos</button>` : ""}
    <span class="hd-note" id="pushMsg">${U.esc(note || "")}</span></div>`;
  const msg = (t) => { const e = document.getElementById("pushMsg"); if (e) e.textContent = t; };
  const chosen = () => [...box.querySelectorAll(".ptype:checked")].map(x => x.value);
  document.getElementById("pushToggle").onclick = async () => {
    let note = "";
    try {
      if (on) { await disablePush(); note = "alertas desativados"; }
      else {
        if (await Notification.requestPermission() !== "granted") { msg("permissão negada no aparelho"); return; }
        const reg = await navigator.serviceWorker.ready;
        const cfg = await pushApi("/api/me/push", null, "GET");
        const ps = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(cfg.public_key) });
        await pushApi("/api/me/push/subscribe", { subscription: ps.toJSON(), officer: OFFICER, prefs: { types: chosen() } });
        engage("push", "open", null);
        note = "alertas ativados";
      }
    } catch (e) { note = "não foi possível ativar neste navegador (" + (e.message || e) + ")"; }
    renderPushBox(note);
  };
  const save = document.getElementById("pushSave");
  if (save) save.onclick = async () => {
    try { await pushApi("/api/me/push/subscribe", { subscription: sub.toJSON(), officer: OFFICER, prefs: { types: chosen() } }); msg("tipos salvos"); }
    catch (e) { msg("falha ao salvar"); }

// --- #168 decisions from the phone: a second tap + optional note, idempotent, online-only ---
// A decision is append-only (irreversible), so every Aprovar/Rejeitar asks for confirmation. The
// idempotency key is minted at the FIRST tap and reused by every retry of that same choice, so a
// double tap or a retry after a timeout records ONCE. Offline, nothing is queued: the buttons are
// disabled ("sem conexão") — a decision must never land hours later.
function newIdem() {
  try { return crypto.randomUUID(); } catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
}
function askConfirm(btn, doCapture) {
  if (!navigator.onLine || OFFLINE) { syncOnline(); return; }
  const verdict = btn.getAttribute("data-tv") || btn.getAttribute("data-v");
  const holder = btn.parentElement;
  const idem = newIdem();
  const prev = holder.innerHTML;
  const word = verdict === "aprovado" ? "aprovação" : "rejeição";
  holder.insertAdjacentHTML("beforeend", `<div class="dconf"><span>Confirmar <b>${word}</b>?</span>
    <input class="dnote" maxlength="280" placeholder="nota (opcional)" aria-label="Nota da decisão">
    <button class="dok">Confirmar</button><button class="dcancel">Cancelar</button><span class="nonet">sem conexão</span></div>`);
  holder.querySelectorAll("button[data-tv],button[data-v]").forEach(b => { b.hidden = true; });
  const conf = holder.querySelector(".dconf");
  conf.querySelector(".dcancel").onclick = () => { holder.innerHTML = prev; rewire(holder, doCapture); };
  conf.querySelector(".dok").onclick = async () => {
    if (!navigator.onLine || OFFLINE) { syncOnline(); return; }
    const ok = conf.querySelector(".dok"); ok.disabled = true; ok.textContent = "Registrando…";
    const note = (conf.querySelector(".dnote").value || "").trim();
    const done = await doCapture(btn, { idem, note });
    if (done === false) { ok.disabled = false; ok.textContent = "Tentar de novo"; }   // same idem on retry
  };
}
function rewire(holder, doCapture) {
  holder.querySelectorAll("button[data-tv],button[data-v]").forEach(b => b.addEventListener("click", () => askConfirm(b, doCapture)));
}

let WEEKLY_TOP = [];
function weeklyChip(key, m) {
  const d = m.delta, dir = d > 0 ? "up" : d < 0 ? "down" : "flat", arrow = d > 0 ? "▲" : d < 0 ? "▼" : "■";
  return `<span class="mchip" title="${U.esc(WEEKLY_METRIC_LABEL[key])}: ${m.prior} → ${m.now} na janela"><span class="mk">${U.esc(WEEKLY_METRIC_LABEL[key])}</span>` +
    `<span class="mv">${m.now}</span>${d ? `<span class="md md--${dir}">${arrow}${Math.abs(d)}</span>` : ""}</span>`;
}
function weeklyBand() {
  if (OFFICER !== "cso") return "";
  const wk = ((EX.cso || {}).weekly || {}).by_industry || {};
  const w = wk[SECTOR] || wk.__all__;
  if (!w || !w.headline) return "";
  WEEKLY_TOP = w.top_priorities || [];
  WEEKLY_TOP.forEach((p, i) => markSeen("weekly:" + i + ":" + (p.id || "")));
  const chips = Object.keys(WEEKLY_METRIC_LABEL).map(k => weeklyChip(k, w.metrics[k])).join("");
  const rows = WEEKLY_TOP.length ? WEEKLY_TOP.map((p, i) => {
    const cls = WEEKLY_SOWHAT_CLS[p.so_what] || "low";
    return `<div class="rec" data-i="${i}"><div class="rec-t">${bandBadge(cls, p.so_what)} ${U.esc(p.entity_label || "")} — ${U.esc((p.title || "").slice(0, 160))}</div>
      <div class="rec-a">→ ${U.esc(p.decision.text)}${p.id ? ` · <a href="#" data-ev="${U.esc(p.id)}">evidência</a>` : ""}</div>
      <div class="cap"><button data-v="aprovado" data-i="${i}">Aprovar</button><button data-v="rejeitado" data-i="${i}">Rejeitar</button></div></div>`;
  }).join("") : U.empty("Sem prioridades na janela.", "", "○");
  return band("Briefing semanal do CSO", "semana vs. semana anterior · derivado do feed",
    `<div class="panel"><div class="panel__bd" style="padding:var(--s4)">
      <div class="weekly-headline">${U.esc(w.headline)}</div>
      <div class="weekly-chips">${chips}</div>
    </div></div>
    <div class="panel" style="margin-top:var(--s3)"><div class="panel__hd"><h2>Top prioridades da semana</h2></div>
    <div class="panel__bd" style="padding:var(--s3)">${rows}</div></div>`);
}
async function captureWeekly(btn, extra) {
  const p = WEEKLY_TOP[Number(btn.getAttribute("data-i"))]; if (!p) return;
  const d = p.decision || {}, verdict = btn.getAttribute("data-v"), cap = btn.closest(".cap");
  const x = extra || {};
  const industry = SECTOR !== "__all__" ? SECTOR : (d.industries && d.industries[0]) || null;
  const res = await postAct({ intent: "record_decision", officer: "cso", idempotency_key: x.idem,
    args: { officer: "cso", recommendation: d.text, verdict, industry, action_ref: d.action,
      evidence_id: d.evidence_id || p.id, context_id: "weekly:" + (p.id || d.entity),
      started_at: SEEN["weekly:" + btn.getAttribute("data-i") + ":" + (p.id || "")], rationale: x.note || null } });
  if (!res || !res.decision_id) return false;
  const rcard = cap.closest(".rec"); if (rcard) { rcard.dataset.did = res.decision_id; rcard.dataset.off = "cso"; }
  cap.innerHTML = `<span class="done">✓ ${verdict}</span><span class="hd-note">resultado:</span>
    <select data-did="${res.decision_id}" class="ocsel"><option value="pendente">pendente</option>
      <option value="favoravel">favorável</option><option value="desfavoravel">desfavorável</option><option value="neutro">neutro</option></select>${boardHtml()}`;
  cap.querySelector(".ocsel").addEventListener("change", (e) => setOutcome(res.decision_id, e.target.value, e.target));
  wireBoard(cap, res.decision_id);
}

// --- recommendations + capture (ADR-021 Step 1) ----------------------------
const HZ = [["imediato", "Imediato"], ["30d", "30 dias"], ["90d", "90 dias"], ["estrategico", "Estratégico"]];
let RECS = [];
function renderRecs(recs) {
  RECS = recs; recs.forEach(r => markSeen("rec:" + r.horizon + ":" + r.text)); const el = document.getElementById("recs");
  if (!recs.length) { el.innerHTML = U.empty("Sem ações recomendadas no escopo.", "", "○"); return; }
  el.innerHTML = `<div class="horizons">` + HZ.map(([key, label]) => {
    const items = recs.map((r, i) => [r, i]).filter(([r]) => r.horizon === key);
    return `<div class="hz"><h3>${label}</h3>` + (items.length ? items.map(([r, i]) =>
      `<div class="rec" data-i="${i}"><div class="rec-t">${U.esc(r.text)}</div>
        <div class="rec-a">→ ${U.esc(r.action)}${r.evidence_id ? ` · <a href="#" data-ev="${U.esc(r.evidence_id)}">evidência</a>` : ""}</div>
        <div class="cap"><button data-v="aprovado" data-i="${i}">Aprovar</button><button data-v="rejeitado" data-i="${i}">Rejeitar</button></div></div>`).join("")
      : `<div class="hz-empty">—</div>`) + `</div>`;
  }).join("") + `</div>`;
  el.querySelectorAll("a[data-ev]").forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); onEvidence(a); }));
  el.querySelectorAll(".cap button[data-v]").forEach(b => b.addEventListener("click", () => askConfirm(b, capture)));
}
async function capture(btn, extra) {
  const r = RECS[Number(btn.getAttribute("data-i"))]; if (!r) return;
  const verdict = btn.getAttribute("data-v"), cap = btn.closest(".cap");
  const x = extra || {};
  const industry = SECTOR !== "__all__" ? SECTOR : (r.industries && r.industries[0]) || null;
  const res = await postAct({ intent: "record_decision", officer: OFFICER, idempotency_key: x.idem,
    args: { officer: OFFICER, recommendation: r.text, verdict, industry, action_ref: r.action, evidence_id: r.evidence_id,
            context_id: r.horizon, started_at: SEEN["rec:" + r.horizon + ":" + r.text], rationale: x.note || null } });
  if (!res || !res.decision_id) return false;
  const rcard = cap.closest(".rec"); if (rcard) { rcard.dataset.did = res.decision_id; rcard.dataset.off = OFFICER; }
  cap.innerHTML = `<span class="done">✓ ${verdict}</span><span class="hd-note">resultado:</span>
    <select data-did="${res.decision_id}" class="ocsel"><option value="pendente">pendente</option>
      <option value="favoravel">favorável</option><option value="desfavoravel">desfavorável</option><option value="neutro">neutro</option></select>${boardHtml()}`;
  cap.querySelector(".ocsel").addEventListener("change", (e) => setOutcome(res.decision_id, e.target.value, e.target));
  wireBoard(cap, res.decision_id);
}
async function setOutcome(did, outcome, sel) {
  sel.disabled = true; const res = await postAct({ intent: "set_outcome", officer: OFFICER, args: { decision_id: did, outcome } });
  sel.disabled = false; if (res && res.decision_outcome) sel.title = "resultado registrado";
}
async function postAct(body) {
  if (body && body.intent === "record_decision" && body.args) body.args.device = deviceClass();
  try { if (!ADMIN) await Ctx.ensureSession();
    const r = await actFetch(JSON.stringify(body)); return await r.json(); }
  catch (e) { console.error("act failed", e); return null; }
}

// --- drill-down ------------------------------------------------------------
function inspectSectorEvent(id) {
  const r = (((EX.cro || {}).panels || {}).sector_events || []).find(x => x.id === id);
  if (!r) return false;
  const src = (r.sources || []).map(s => `<li><a href="${U.esc(s.url)}" target="_blank" rel="noopener">${U.esc(s.title || s.url)}</a>` +
    ` <span class="hd-note">${U.esc(s.kind === "official" ? "ato oficial" : "imprensa")} · ${U.esc(s.label || "")}${s.via ? " · via " + U.esc(s.via) : ""}` +
    `${s.section ? " · " + U.esc(s.section) : ""} · ${U.esc(s.date || "")}</span></li>`).join("");
  document.getElementById("drTitle").textContent = "Evento setorial — " + (r.change_label || "mudança regulatória");
  document.getElementById("drBody").innerHTML = `<div class="callout"><p><b>${U.esc(r.title || "")}</b></p>` +
    (r.summary ? `<p>${U.esc(r.summary)}</p>` : "") +
    `<p class="hd-note">Severidade ${U.esc(SECTOR_SEV_PT[r.severity] || r.severity || "—")} · ${U.esc(SECTOR_CONF_PT[r.confidence] || r.confidence || "")}` +
    ` · ${r.n_affected || 0} entidades do setor afetadas</p><ol>${src}</ol></div>`;
  openDrawer(id);
  return true;
}
function inspectEnforcement(id) {
  const r = (((EX.cco || {}).panels || {}).enforcement || []).find(x => x.id === id);
  if (!r) return false;
  const KIND = { official: "ato oficial", registry: "cadastro oficial", news: "imprensa" };
  const src = (r.sources || []).map(s => `<li><a href="${U.esc(s.url)}" target="_blank" rel="noopener">${U.esc(s.title || s.url)}</a>` +
    ` <span class="hd-note">${U.esc(KIND[s.kind] || s.kind || "")} · ${U.esc(s.label || "")} · ${U.esc(s.date || "")}</span></li>`).join("");
  document.getElementById("drTitle").textContent = "Enforcement — " + (r.kind_label || r.kind || "");
  document.getElementById("drBody").innerHTML = `<div class="callout"><p><b>${U.esc(r.label || r.target || "—")}</b></p>` +
    `<p>${U.esc(r.title || "")}</p>` + (r.summary && r.summary !== r.title ? `<p>${U.esc(r.summary)}</p>` : "") +
    `<p class="hd-note">${U.esc(r.authority || "")} · severidade ${U.esc(SECTOR_SEV_PT[r.severity] || r.severity || "—")} · ` +
    `${U.esc(ENF_CONF_PT[r.confidence] || r.confidence || "")}${r.entity ? "" : " · instituição fora do roster"}</p><ol>${src}</ol></div>`;
  openDrawer(id);
  return true;
}
function inspect(id) {
  if (String(id || "").indexOf("sector_event:") === 0 && inspectSectorEvent(id)) return;
  if (String(id || "").indexOf("enf:") === 0 && inspectEnforcement(id)) return;
  const c = BYID[id];
  document.getElementById("drTitle").textContent = (c && (c.entity_label || c.subject_label || c.entity)) || "Detalhe";
  document.getElementById("drBody").innerHTML = c
    ? `<div class="callout">${U.linkifyNarrative(c.narrative || "", U.citationModel(c))}${U.citationFooter(U.citationModel(c))}</div>`
    : U.empty("Sem cartão citável", `id: ${id || "—"}`, "○");
  openDrawer(c ? id : null);
}
// ADR 027 #129 caught this live: these used to toggle a ".on" class that no CSS rule
// anywhere defines (the shared v2/app.css only has `.drawer.open`/`.scrim.open`) — so
// aria-hidden and the drawer's content flipped correctly but the slide-in transform
// never fired; the drawer was functionally open yet stayed fully off-screen. "open" is
// the class the shared component vocabulary actually styles.
// --- #170 share a card without leaking it -----------------------------------------------
// The link is /exec?c=<first 16 hex of SHA-256(card id)> — card ids name entities
// ("cand-ent-itau-unibanco"), so the id itself never goes in the URL. The page's OpenGraph
// tags are generic, the share sheet gets no text, and the recipient must sign in: the hash is
// resolved against THEIR scoped feed, so a card outside their licence is "sem acesso".
let SHARE_ID = null;
async function sha16(v) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(v)));
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}
function shareableIds() {
  const ids = Object.keys(BYID);
  (((EX.cro || {}).panels || {}).sector_events || []).forEach(e => ids.push(e.id));
  (((EX.cco || {}).panels || {}).enforcement || []).forEach(e => e && e.id && ids.push(e.id));
  return ids;
}
async function shareCurrent() {
  if (!SHARE_ID) return;
  const url = `${location.origin}/exec?c=${await sha16(SHARE_ID)}`;
  const btn = document.getElementById("drShare");
  engage("share", "open", BYID[SHARE_ID] ? SHARE_ID : null);   // #165 count
  try {
    if (navigator.share) { await navigator.share({ title: "Onça — painel executivo", url }); return; }
    await navigator.clipboard.writeText(url);
    btn.textContent = "link copiado ✓"; setTimeout(() => { btn.textContent = "Compartilhar"; }, 2500);
  } catch (e) { /* the user dismissed the share sheet */ }
}
document.getElementById("drShare").addEventListener("click", shareCurrent);
async function resolveSharedLink() {
  const c = new URLSearchParams(location.search).get("c");
  if (!c || !/^[0-9a-f]{16}$/.test(c)) return;
  const url = new URL(location.href); url.searchParams.delete("c");
  history.replaceState({}, "", url.pathname + (url.search || "") + url.hash);
  for (const id of shareableIds()) {
    if (await sha16(id) === c) { if (VIEW === "hoje") { setView("painel"); render(); } inspect(id); return; }
  }
  SHARE_ID = null;
  document.getElementById("drTitle").textContent = "Sem acesso";
  document.getElementById("drBody").innerHTML = U.empty("Sem acesso a este conteúdo",
    "O item compartilhado não está no escopo da sua licença — ou saiu da janela de dados.", "⦸");
  openDrawer(null);
}
function openDrawer(shareId) {
  SHARE_ID = shareId || null;
  const sb = document.getElementById("drShare"); if (sb) sb.hidden = !SHARE_ID || ADMIN;
  document.getElementById("drawer").setAttribute("aria-hidden", "false");
  document.getElementById("scrim").classList.add("open"); document.getElementById("drawer").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").setAttribute("aria-hidden", "true");
  document.getElementById("scrim").classList.remove("open"); document.getElementById("drawer").classList.remove("open"); }
</script>
