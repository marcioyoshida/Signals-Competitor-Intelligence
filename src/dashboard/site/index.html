<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Onça — Warroom</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --panel2: #eef0f3; --border: #d9dde3;
    --ink: #1a1f26; --ink2: #4a5460; --muted: #79818c;
    --accent: #1f8f8a; /* single-hue sparkline accent */
    /* status tiers (severity) — reserved, always shown with a text label */
    --t-crit: #c62828; --t-high: #e06c00; --t-med: #b8860b; --t-low: #5b6673;
    --shadow: 0 1px 2px rgba(20,25,35,.06), 0 2px 8px rgba(20,25,35,.05);
  }
  html[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --panel2: #1d232c; --border: #2a313b;
    --ink: #e6e9ee; --ink2: #aeb6c2; --muted: #79818c;
    --accent: #3fbdb6;
    --t-crit: #ff6b6b; --t-high: #ffa04d; --t-med: #ffd166; --t-low: #8a95a5;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 16px 22px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--ink2);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { color: var(--ink); }
  .wrap { padding: 18px 22px; max-width: 1200px; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .tile .n { font-size: 26px; font-weight: 650; letter-spacing: .3px; }
  .tile .l { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .cols { display: grid; grid-template-columns: 1fr 340px; gap: 18px; margin-top: 18px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2,1fr); } }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; }
  select, input[type=search] {
    background: var(--bg); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; font-size: 13px;
  }
  label.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font-size: 13px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 0 16px 12px; color: var(--ink2); font-size: 12px; }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .feed { padding: 6px 10px 14px; }
  .card {
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
    padding: 12px 14px; margin: 8px 6px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card .row1 { display: flex; align-items: center; gap: 10px; }
  .tier {
    font-size: 10.5px; font-weight: 700; letter-spacing: .5px; padding: 2px 7px;
    border-radius: 999px; color: #fff; white-space: nowrap;
  }
  .entity { font-weight: 640; font-size: 15px; }
  .date { color: var(--muted); font-size: 12px; }
  .alert { color: var(--t-crit); font-weight: 700; font-size: 11px; border: 1px solid currentColor; padding: 1px 6px; border-radius: 6px; }
  .bar { height: 6px; border-radius: 999px; background: var(--panel2); margin: 9px 0 8px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; }
  .score { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink2); }
  .est { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; }
  .lenses { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 11px; color: var(--ink2); background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: 1px 7px; }
  .narr { margin: 8px 0 0; color: var(--ink); }
  .narr.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cites { margin-top: 9px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
  .cites .src { color: var(--muted); }
  .ent-row { display: grid; grid-template-columns: 1fr 96px 42px; align-items: center; gap: 8px;
    padding: 9px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .ent-row:hover { background: var(--panel2); }
  .ent-row.active { background: var(--panel2); }
  .ent-name { font-size: 13px; font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ent-meta { text-align: right; font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .spark { display: block; }
  table.tv { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tv th, table.tv td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  table.tv th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .hidden { display: none !important; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg);
    padding: 4px 8px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .1s; z-index: 20; }
</style>
</head>
<body>
<header>
  <h1>🐆 Onça <span style="color:var(--muted);font-weight:500">— Warroom</span></h1>
  <span class="sub" id="asof"></span>
  <span class="spacer"></span>
  <button class="btn" id="tableToggle">Table view</button>
  <button class="btn" id="themeToggle">Light</button>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="cols">
    <div class="panel">
      <h2>Threat-scored feed</h2>
      <div class="filters">
        <select id="fEntity"><option value="">All entities</option></select>
        <select id="fLens"><option value="">All lenses</option></select>
        <select id="fDate"><option value="">All dates</option></select>
        <label class="chk"><input type="checkbox" id="fAlert" /> Alerts only</label>
        <button class="btn" id="viewToggle" title="Summarize to one card per entity">By entity</button>
        <input type="search" id="fSearch" placeholder="Search narratives…" style="flex:1;min-width:140px" />
      </div>
      <div class="legend" id="legend"></div>
      <div class="feed" id="feed"></div>
      <div id="tableView" class="hidden" style="padding:6px 12px 16px"></div>
    </div>

    <div class="panel" style="align-self:start">
      <h2>Entity watch <span style="text-transform:none;letter-spacing:0">· peak score over window</span></h2>
      <div id="entities"></div>
    </div>
  </div>
  <p class="est" style="margin:16px 6px">Threat score is an estimated heuristic (not a validated model). Every claim links to its source.</p>
</div>

<div class="tip" id="tip"></div>

<script>
const TIERS = [
  { min: 0.85, label: "CRITICAL", var: "--t-crit" },
  { min: 0.65, label: "HIGH",     var: "--t-high" },
  { min: 0.40, label: "MEDIUM",   var: "--t-med"  },
  { min: 0.00, label: "LOW",      var: "--t-low"  },
];
const cssvar = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const tierOf = (s) => TIERS.find(t => (s ?? 0) >= t.min) || TIERS[TIERS.length - 1];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let DATA = null;
// "all" = flat list of distinct events (default); "entity" = one summary card per entity.
const state = { entity: "", lens: "", date: "", alert: false, q: "", view: "all" };

async function boot() {
  try {
    const r = await fetch("feed.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch (e) {
    document.getElementById("feed").innerHTML =
      `<div class="empty">No feed yet. It's published after the daily pipeline runs.<br><small>(${esc(e.message)})</small></div>`;
    return;
  }
  document.getElementById("asof").textContent =
    `as of ${DATA.as_of ?? "—"} · ${DATA.feed.length} narratives · ${DATA.dates.length}-day window`;
  renderKpis(); renderLegend(); populateFilters(); renderEntities(); render();
}

function renderKpis() {
  const k = DATA.kpis;
  const tiles = [
    ["Narratives today", k.narratives_latest],
    ["Alerts today", k.alerts_latest],
    ["Entities tracked", k.entities_tracked],
    ["Distinct sources", k.sources],
  ];
  document.getElementById("kpis").innerHTML = tiles.map(
    ([l, n]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`
  ).join("");
}

function renderLegend() {
  document.getElementById("legend").innerHTML =
    TIERS.map(t => `<span><span class="swatch" style="background:${cssvar(t.var)}"></span>${t.label}</span>`).join("")
    + `<span style="margin-left:auto"><span class="swatch" style="background:var(--accent)"></span>peak score trend</span>`;
}

function populateFilters() {
  const ent = document.getElementById("fEntity");
  DATA.entities.forEach(e => ent.add(new Option(e.label, e.entity)));
  const lenses = [...new Set(DATA.feed.flatMap(f => f.lenses))].sort();
  const lensSel = document.getElementById("fLens");
  lenses.forEach(l => lensSel.add(new Option(l, l)));
  const dSel = document.getElementById("fDate");
  [...DATA.dates].reverse().forEach(d => dSel.add(new Option(d, d)));

  ent.onchange = e => { state.entity = e.target.value; syncEntityHighlight(); render(); };
  lensSel.onchange = e => { state.lens = e.target.value; render(); };
  dSel.onchange = e => { state.date = e.target.value; render(); };
  document.getElementById("fAlert").onchange = e => { state.alert = e.target.checked; render(); };
  document.getElementById("fSearch").oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
}

function filtered() {
  return DATA.feed.filter(f =>
    (!state.entity || f.entity === state.entity) &&
    (!state.lens || f.lenses.includes(state.lens)) &&
    (!state.date || f.date === state.date) &&
    (!state.alert || f.is_alert) &&
    (!state.q || (f.narrative || "").toLowerCase().includes(state.q) || (f.entity_label || "").toLowerCase().includes(state.q))
  );
}

function citeHtml(c) {
  if (c.url) {
    let host = c.url; try { host = new URL(c.url).hostname.replace(/^www\./, ""); } catch (e) {}
    return `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(host)} ↗</a>`;
  }
  return `<span class="src">${esc(c.source || c.id || "source")}</span>`;
}

function cardHtml(f, group) {
  const t = tierOf(f.threat_score);
  const pct = Math.round((f.threat_score ?? 0) * 100);
  const multi = group && group.count > 1
    ? `<span class="est">· ${group.count} updates in window · peak ${group.peak.toFixed(2)}</span>`
    : "";
  return `<div class="card" data-id="${esc(f.id)}">
    <div class="row1">
      <span class="tier" style="background:${cssvar(t.var)}">${t.label}</span>
      <span class="entity">${esc(f.entity_label)}</span>
      ${f.is_alert ? '<span class="alert">ALERT</span>' : ''}
      <span class="spacer" style="flex:1"></span>
      <span class="date">${esc(f.date)}</span>
    </div>
    <div class="bar"><span style="width:${pct}%;background:${cssvar(t.var)}"></span></div>
    <div><span class="score">${(f.threat_score ?? 0).toFixed(2)} threat</span> <span class="est">· est.</span> ${multi}</div>
    <div class="lenses">${f.lenses.map(l => `<span class="chip">${esc(l)}</span>`).join("")}</div>
    <p class="narr clamp">${esc(f.narrative)}</p>
    <div class="cites">${f.citations.map(citeHtml).join("")}
      ${f.source_ids.length ? `<span class="src">· ${f.source_ids.length} sources</span>` : ""}</div>
  </div>`;
}

function signature(f) {
  // Stable set of underlying signals, ignoring date suffixes and volatile KB ids.
  const ids = (f.source_ids || [])
    .map(i => String(i).replace(/:\d{4}-\d{2}-\d{2}$/, ""))
    .filter(i => !i.startsWith("kb:"));
  return [...new Set(ids)].sort().join("|") || f.id;
}

function dedupBySignature(rows) {
  // Merge only genuinely identical signal sets (true repeats) — keep distinct events.
  const seen = new Set();
  return rows.filter(f => {
    const s = signature(f);
    if (seen.has(s)) return false;
    seen.add(s); return true;
  });
}

function collapseByEntity(rows) {
  // rows are pre-sorted newest-date-first then score desc, so the first seen
  // per entity is the representative (latest) card; peak/count span the window.
  const groups = new Map();
  for (const f of rows) {
    const key = f.entity || f.entity_label;
    let g = groups.get(key);
    if (!g) { g = { item: f, count: 0, peak: 0 }; groups.set(key, g); }
    g.count++; g.peak = Math.max(g.peak, f.threat_score ?? 0);
  }
  return [...groups.values()].sort((a, b) => b.peak - a.peak);
}

function render() {
  const rows = filtered();
  const feed = document.getElementById("feed");
  // Collapse repeats per entity by default; a specific date already scopes to one day.
  const collapse = state.view === "entity" && !state.date;
  let html;
  if (!rows.length) {
    html = `<div class="empty">No narratives match these filters.</div>`;
  } else if (collapse) {
    html = collapseByEntity(rows).map(g => cardHtml(g.item, g)).join("");
  } else {
    // Flat: distinct events, merging only truly identical signal sets.
    html = dedupBySignature(rows).map(f => cardHtml(f, null)).join("");
  }
  feed.innerHTML = html;
  feed.querySelectorAll(".card").forEach(c => c.onclick = () => {
    c.querySelector(".narr").classList.toggle("clamp");
  });
  renderTable(rows);
}

function renderTable(rows) {
  document.getElementById("tableView").innerHTML =
    `<table class="tv"><thead><tr><th>Date</th><th>Entity</th><th>Tier</th>
     <th>Threat (est.)</th><th>Alert</th><th>Lenses</th></tr></thead><tbody>` +
    rows.map(f => `<tr><td>${esc(f.date)}</td><td>${esc(f.entity_label)}</td>
      <td>${tierOf(f.threat_score).label}</td><td>${(f.threat_score ?? 0).toFixed(2)}</td>
      <td>${f.is_alert ? "yes" : ""}</td><td>${esc(f.lenses.join(", "))}</td></tr>`).join("") +
    `</tbody></table>`;
}

function sparkline(timeline) {
  const dates = DATA.dates, W = 96, H = 26, pad = 2;
  const byDate = Object.fromEntries(timeline.map(t => [t.date, t.max_score]));
  const pts = dates.map((d, i) => {
    const x = pad + (dates.length === 1 ? 0 : i * (W - 2 * pad) / (dates.length - 1));
    const v = byDate[d]; const y = v == null ? null : H - pad - v * (H - 2 * pad);
    return { x, y, d, v };
  });
  const line = pts.filter(p => p.y != null);
  const poly = line.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const dots = line.map(p =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="var(--accent)"
      data-d="${p.d}" data-v="${p.v.toFixed(2)}"></circle>`).join("");
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

function renderEntities() {
  const el = document.getElementById("entities");
  el.innerHTML = DATA.entities.map(e => `
    <div class="ent-row" data-entity="${esc(e.entity)}">
      <div class="ent-name" title="${esc(e.label)}">${esc(e.label)}</div>
      <div>${sparkline(e.timeline)}</div>
      <div class="ent-meta">${e.peak_score.toFixed(2)}</div>
    </div>`).join("");
  el.querySelectorAll(".ent-row").forEach(r => r.onclick = () => {
    const en = r.dataset.entity;
    state.entity = state.entity === en ? "" : en;
    document.getElementById("fEntity").value = state.entity;
    syncEntityHighlight(); render();
  });
  const tip = document.getElementById("tip");
  el.querySelectorAll("circle").forEach(c => {
    c.onmousemove = ev => {
      tip.textContent = `${c.dataset.d}: ${c.dataset.v}`;
      tip.style.left = (ev.clientX + 12) + "px"; tip.style.top = (ev.clientY - 10) + "px";
      tip.style.opacity = 1;
    };
    c.onmouseleave = () => tip.style.opacity = 0;
  });
}

function syncEntityHighlight() {
  document.querySelectorAll(".ent-row").forEach(r =>
    r.classList.toggle("active", r.dataset.entity === state.entity && state.entity !== ""));
}

document.getElementById("themeToggle").onclick = (e) => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  e.target.textContent = dark ? "Dark" : "Light";
  if (DATA) { renderLegend(); renderEntities(); render(); syncEntityHighlight(); }
};
document.getElementById("viewToggle").onclick = (e) => {
  state.view = state.view === "entity" ? "all" : "entity";
  e.target.textContent = state.view === "entity" ? "Updates" : "By entity";
  render();
};
document.getElementById("tableToggle").onclick = (e) => {
  const tv = document.getElementById("tableView");
  const hidden = tv.classList.toggle("hidden");
  document.getElementById("feed").classList.toggle("hidden", !hidden);
  e.target.textContent = hidden ? "Table view" : "Card view";
};

boot();
</script>
</body>
</html>
