name: ci

# PR checks (issue #6): tests + `cdk synth` (template compiles) on pull requests.
# No AWS credentials, no deploy — deploy happens on merge to main (deploy.yml).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CDK CLI
        run: npm install -g aws-cdk@2
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r infra/requirements.txt
      - name: Run tests
        run: pytest -q --ignore=tests/test_lambda_port.py
      - name: Stage Lambda asset (so from_asset paths resolve at synth)
        run: |
          rm -rf build/lambda && mkdir -p build/lambda
          pip install -r requirements.txt -t build/lambda
          rsync -a --delete --exclude=__pycache__ --exclude='*.pyc' src/ build/lambda/src/
      - name: CDK synth (no deploy, no creds)
        working-directory: infra
        run: cdk synth OncaPrototypeStack --app "python app.py" >/dev/null
