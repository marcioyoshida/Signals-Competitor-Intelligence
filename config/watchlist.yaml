# Onça watchlist configuration
lookback_days: 7

# Substrings matched against CVM fund administrator names (case-insensitive).
# Replace with your actual competitor set.
competitors:
  - ITAU
  - BTG PACTUAL
  - NU INVEST
  - XP INVESTIMENTOS
  # Private fintechs — distinctive substrings only. STONE / NEON are omitted
  # here (crude substring would catch StoneX / NeoEnergia in CVM); their precise
  # aliases in src/synth/entities.py still cluster them accurately.
  - CREDITAS
  - RECARGAPAY
  - CLOUDWALK
  - INFINITEPAY
  - NOMAD

# Pix competitor tracking (BCB Pix statistics).
# ISPB = 8-digit institution identifier in the SPI. Find via BCB's
# participant list; leave empty to rank all institutions.
# Examples (VERIFY before use): Nubank 18236120, Itaú 60701190, BTG 30306294
competitor_ispb: []

# Minimum month-over-month % change in Pix value to flag as a signal.
pix_move_threshold_pct: 15.0

# BCB juros médios (average rates by institution × modality).
# Institution name substrings (case-insensitive). Empty = all institutions.
juros_competitors: []
# Modalidade substrings. Defaults in code cover card revolving/installment,
# unsecured personal credit, and overdraft when this list is omitted/empty
# and juros_use_default_modalities is true.
juros_modalities: []
juros_use_default_modalities: true
# Relative % change in TaxaJurosAoAno to flag (first run seeds baseline only).
juros_move_threshold_pct: 10.0

# CVM Ofertas de Distribuição (capital raise / product launch).
# Lookback window for event dates (Data_Registro / Data_Inicio_Oferta).
ofertas_lookback_days: 30
# Name substrings for issuer/leader/admin/manager. Empty = all recent offerings
# (noisier; first run seeds baseline without alerting).
# Reuses competitors list when ofertas_use_competitors_watchlist is true.
ofertas_watchlist: []
ofertas_use_competitors_watchlist: true

# CVM Informe Diário (fund AUM + daily flows). Joins RCVM 175 registry to
# monthly inf_diario_fi_YYYYMM.zip. Empty watchlist + use_competitors →
# reuse competitors (admin/gestor name substrings).
inf_diario_watchlist: []
inf_diario_use_competitors_watchlist: true
# Relative % AUM (VL_PATRIM_LIQ) move to flag (first run seeds baseline).
inf_diario_move_threshold_pct: 10.0
# Optional cap by PL after filter (null/omit = all watchlisted funds that day).
# inf_diario_top_n: 500

# CVM material facts (Fato Relevante / Comunicado ao Mercado) from B3-listed
# competitors. Precise names (avoid "ITAU" bare — catches "ITAUNENSE").
# Empty watchlist would pull all issuers (noisy), so this is required to enable.
fatos_lookback_days: 45
fatos_use_competitors: true
fatos_watchlist:
  - ITAU UNIBANCO
  - ITAUSA
  - BRADESCO
  - SANTANDER
  - BANCO DO BRASIL
  - BTG PACTUAL
# Categorias to keep (empty = defaults: Fato Relevante, Comunicado ao Mercado).
fatos_categories: []

# Diário Oficial da União — official acts (SUSEP / CADE / BACEN / PREVIC / CVM)
# naming a competitor. Reuses the fatos watchlist + competitors as search terms
# (quoted phrases). Organ allowlist in code keeps only intel-relevant regulators.
dou_lookback_days: 30
dou_use_competitors: true
dou_watchlist: []

# Trade-press (Google News RSS) — brand-name queries; headline + link only, cite
# the publisher (no full-text scrape). Finance-context filter in code drops
# band/stadium/culture noise for ambiguous names (Stone, Inter).
news_lookback_days: 14
news_use_competitors: true
# IMPORTANT: this list must stay in sync with the tracked-entity set
# (src/synth/entities.py ENTITY_ALIASES / the DynamoDB registry). An entity
# that is tracked (so the silence detector watches it) but MISSING here gets no
# news fetch — when its official-source coverage lulls it looks "silent" even
# when the press is covering it, a false silence (e.g. C6/PicPay 2026-08-19).
# Use precise brand phrases; bare noisy words (Santander, Caixa) get a qualifier.
news_watchlist:
  - Nubank
  - Stone
  - PagBank
  - Banco Inter
  - XP Investimentos
  - Creditas
  - InfinitePay
  - RecargaPay
  - Neon
  - Nomad
  - Mercado Pago
  - Itaú Unibanco
  - Bradesco
  - BTG Pactual
  # Previously missing tracked entities (caused false silences) —
  - C6 Bank
  - PicPay
  - Banco do Brasil
  - Santander Brasil
  - Caixa Econômica Federal
  - Banco Original

# US-listed Brazilian fintechs to track via SEC EDGAR. Empty = skip SEC
# entirely (appropriate if your target customer is a bank/insurer and
# these acquirers/fintechs aren't relevant competitors).
# STNE=Stone, PAGS=PagSeguro, NU=Nu Holdings, INTR=Inter&Co, XP=XP Inc
sec_tickers:
  - STNE
  - PAGS
  - NU
  - INTR
  - XP
# Only filings with filingDate within this many days (caps seed volume).
sec_lookback_days: 365
# SEC fair-access User-Agent (must include a contact). Override in env via
# ONCA_SEC_USER_AGENT if you prefer not to commit an email here.
# Short product + email form (SEC returns 403 on some verbose UA strings).
sec_user_agent: "Onca Competitive Intelligence marcioyoshida@gmail.com"
