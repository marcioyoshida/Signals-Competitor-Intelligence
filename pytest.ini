[pytest]
# CI-safe defaults (issue #29):
#  - strict markers so a typo'd/unknown marker fails instead of silently passing.
#  - per-test timeout (pytest-timeout) so a hung live call can't stall CI; thread
#    method works with blocking C calls (requests/boto3).
#  - `network` marks tests that perform live external I/O; CI runs `-m "not network"`
#    for a fast, hermetic suite, and the socket guard in conftest.py fails any
#    unmarked test that tries to reach the network.
addopts = --strict-markers
timeout = 120
timeout_method = thread
markers =
    network: performs live external network I/O (BCB/CVM/news/AWS). Deselect with -m "not network".
