# #259: the bottom officer tab bar switches the view. Hoje is data-driven and looks alike across
# officers, so the check runs on Painel, whose heading names the board ("Sala executiva — Risco").
# ADR 032 (2026-11-12): five boards, plain names, no C-suite acronyms.
# Needs MAESTRO_QA_EMAIL / MAESTRO_QA_PASSWORD (the qa admin persona: five board tabs).
appId: org.onssa.onca
tags:
  - auth
---
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- assertVisible: "Estratégia"
- assertVisible: "Risco"
- assertVisible: "Compliance"
- assertVisible: "Produto"
- assertVisible: "Regulatório"
- tapOn: "Painel"
- extendedWaitUntil:
    visible: ".*— Estratégia"
    timeout: 15000
- tapOn: "Risco"
- extendedWaitUntil:
    visible: ".*— Risco"
    timeout: 15000
- takeScreenshot: tab-risco
- tapOn: "Compliance"
- extendedWaitUntil:
    visible: ".*— Compliance"
    timeout: 15000
- takeScreenshot: tab-compliance
- tapOn: "Produto"
- extendedWaitUntil:
    visible: ".*— Produto"
    timeout: 15000
- takeScreenshot: tab-produto
- tapOn: "Regulatório"
- extendedWaitUntil:
    visible: ".*— Regulatório"
    timeout: 15000
- takeScreenshot: tab-regulatorio
- tapOn: "Estratégia"
- extendedWaitUntil:
    visible: ".*— Estratégia"
    timeout: 15000
- takeScreenshot: tab-estrategia
- assertNotVisible: "Assinar.*"
