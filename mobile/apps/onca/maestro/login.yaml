# #259: needs MAESTRO_QA_EMAIL / MAESTRO_QA_PASSWORD (a qa-internal-* persona, excluded from usage
# metrics). Sign in through the system browser, offline relaunch (Android), sign out through the
# "Sua conta" sheet.
appId: org.onssa.onca
tags:
  - auth
---
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- assertNotVisible: "Assinar.*"
- assertNotVisible: ".*R\\$ .*"
- takeScreenshot: signed-in
# offline relaunch: the last feed of THIS user, labelled offline. setAirplaneMode is Android-only
# (Maestro: iOS simulators have no airplane mode — it passes without effect there).
- runFlow:
    when:
      platform: Android
    commands:
      # leave the app first, as a person does, and give the WebView time to write localStorage and
      # Cache Storage to disk: a force-stop ~1 s after sign-in can drop both (run 40141373644 came
      # back to the gate, not the offline feed). The OS killing a backgrounded app is the real case.
      - pressKey: Home
      - extendedWaitUntil:
          visible: "__never__"
          timeout: 10000
          optional: true
      - setAirplaneMode: enabled
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: ".*offline.*|.*Sem conexão.*"
          timeout: 30000
      - assertVisible: "Estratégia"
      - takeScreenshot: offline
      - setAirplaneMode: disabled
      - stopApp
      - launchApp
- extendedWaitUntil:
    visible: "Estratégia"
    timeout: 45000
# logout: the avatar (aria-label "Sua conta: <e-mail>") opens the account sheet
- tapOn: "Sua conta.*"
- extendedWaitUntil:
    visible: "Sair desta conta"
    timeout: 15000
- tapOn: "Sair desta conta"
- tapOn:                      # the logout trip uses an ephemeral session; a prompt is unexpected,
    text: "Continue|Continuar" # but must not strand the flow if an OS version shows one
    optional: true
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 45000
- assertNotVisible: "Estratégia"
- takeScreenshot: signed-out
