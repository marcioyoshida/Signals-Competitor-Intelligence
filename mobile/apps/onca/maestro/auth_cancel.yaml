# #259: the person backs out of sign-in. App.tsx shows "Login não concluído" only when sign-in
# FAILED; a cancel must return quietly to the gate. No credentials needed.
#   iOS: Cancel on the "Wants to Use … to Sign In" prompt (or on the auth sheet) -> type "cancel".
#   Android: Back closes the Custom Tab. expo-web-browser 57 resolves that as type "dismiss";
#   App.tsx maps an Android dismiss to "cancel" (quiet), so this passes on Android too.
appId: org.onssa.onca
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 45000
- tapOn: "Entrar"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Cancel|Cancelar"
          timeout: 20000
      - tapOn: "Cancel|Cancelar"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:                 # a fresh emulator's Chrome first-run screens, if any
          text: "Use without an account|Accept & continue|No thanks|Got it"
          optional: true
      - tapOn:
          text: "Use without an account|No thanks|Got it"
          optional: true
      - extendedWaitUntil:     # the Custom Tab is up with the Hosted UI
          visible: ".*[Ss]enha.*|.*[Pp]assword.*"
          timeout: 45000
      - back
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Login não concluído"
- assertVisible: "Entrar"
- takeScreenshot: auth-cancelled
