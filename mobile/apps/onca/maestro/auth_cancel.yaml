# #259: the person backs out of sign-in. App.tsx shows "Login não concluído" only when sign-in
# FAILED; a cancel must return quietly to the gate. No credentials needed.
#   iOS: Cancel on the "Wants to Use … to Sign In" prompt (or on the auth sheet) -> type "cancel".
#   Android: Back closes the Custom Tab. NB expo-web-browser 57 resolves that as type "dismiss",
#   which App.tsx (authFailureMessage) treats as a failure — this flow is expected to FAIL on
#   Android until the shell tells a user-closed tab apart from a lost redirect.
appId: org.onssa.onca
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 45000
- tapOn: "Entrar"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Cancel|Cancelar"
          timeout: 20000
      - tapOn: "Cancel|Cancelar"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:     # the Custom Tab is up with the Hosted UI
          visible: ".*[Ss]enha.*|.*[Pp]assword.*"
          timeout: 45000
      - back
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Login não concluído"
- assertVisible: "Entrar"
- takeScreenshot: auth-cancelled
